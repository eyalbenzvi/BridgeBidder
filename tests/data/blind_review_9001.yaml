# Scenarios from the blind expert review of seed 9001 (DECISIONS.md, "Reading
# a lost board as an expert would" and the round that followed).  Each is a
# lost board whose flawed call a blind reviewer named together with the
# agreement that should have covered it; the hand and auction are the real
# ones.  Where two calls are defensible both are accepted.

# --- advancer after our overcall is doubled (negative double)
- name: br_advancer_raises_over_negative_double_5_trumps
  hand: "KJ642.Q83.A.9642"
  calls: ["1H", "1S", "X"]
  expect: { calls: ["3S", "2S"] }
- name: br_advancer_raises_over_negative_double_4_trumps
  hand: "9853.A986.2.A963"
  calls: ["1D", "1S", "X"]
  expect: { calls: ["2S", "3S"] }
- name: br_advancer_raises_jump_overcall_over_negative_double
  hand: "AT76.T.T93.KQT97"
  calls: ["1D", "2S", "X"]
  expect: { call: "3S" }
- name: br_advancer_shows_3_card_support_not_weak_diamonds
  hand: "T52.A95.K97542.T"
  calls: ["1C", "1H", "X"]
  expect: { call: "2H" }
- name: br_advancer_does_not_run_on_3_count
  hand: "JT4.T7.QT643.765"
  calls: ["1C", "1S", "X"]
  expect: { call: "P" }

