  calls: ["1H", "P", "1NT"]
  expect: { call: "X", forcing: one_round }

- name: r1_sandwich_overcall_1S
  hand: "KQJ52.86.A94.932"
  dealer: E
  calls: ["1C", "P", "1H"]
  expect: { call: "1S" }

- name: r1_sandwich_pass_flat
  hand: "K752.Q64.KJ9.J32"
  dealer: E
  calls: ["1C", "P", "1H"]
  expect: { call: "P" }

