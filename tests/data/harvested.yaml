# Scenarios distilled from harvested self-play failures (tools/harvest.py).
# Each one is a real dealt board that exposed a bug; the fix is locked here.

# round 1, board 16: engine pulled its own doubled 4S to 5S/6S (-500 vs par +140)
- name: r1b16_no_self_pull_of_doubled_contract
  hand: "AJ654.A.K874.K73"
  dealer: N
  calls: ["1S", "2C", "3C", "P", "4S", "X", "P", "P"]
  expect: { call: "P" }

# round 1, board 16 (earlier turn): with 18 support points opposite a cue
# raise, bid the game instead of a random second suit
- name: r1b16_bid_game_over_cue_raise
  hand: "AJ654.A.K874.K73"
  dealer: N
  calls: ["1S", "2C", "3C", "P"]
  expect: { calls: ["4S", "3S"] }

