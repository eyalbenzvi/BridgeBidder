# Blind expert review, round 7 (seed 3141, 1000 lost boards packed with the
# second, --with-ben question; the run was stopped early on cost grounds
# after 323 of 2000 tables reviewed, so this round is narrow: one context
# gap found from two flags both questions agreed on, plus two more boards
# (1792, 632) the held-out adjudication itself turned up while checking that
# fix - not a full pass over the corpus.

# --- the takeout doubler's own continuation over advancer's forced 1-level
# major answer (nothing at all offered "1H - X - P - 1S - P - ?" before;
# the generic uncontested-continuation layer stood in for it)
- name: br7_doubler_jump_raises_forced_1level_major_answer
  hand: "AKQ2.K5.AQ2.KQT5"
  calls: ["1H", "X", "P", "1S", "P"]
  expect: { call: "3S" }
- name: br7_doubler_raises_forced_1level_major_answer_three_card_support
  hand: "AK2.KQ6.KJ92.K97"
  calls: ["P", "1C", "X", "P", "1S", "P"]
  expect: { call: "2S" }

# --- a good, high-quality second major shown cheaply beats a marginal raise
