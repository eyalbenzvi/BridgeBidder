# Undiscussed situations: the engine must still produce something sensible.

# their 3-level preempt is now real system content (round-4 harvest), so the
# undiscussed check moved to a genuinely unauthored deep sequence
- name: preempt_defense_is_systemic
  hand: "AKQ52.K64.A94.32"
  dealer: E
  calls: ["3C"]
  expect: { calls: ["X", "3S"], fallback: false }

# the general agreements (round 5) cover ordinary deep sequences too: this
# used to be an undiscussed fallback and is now an explained systemic raise
- name: deep_sequence_is_systemic
  hand: "AQ52.6.KQ94.KQ32"
  calls: ["1C", "P", "1H", "P", "1S", "P", "2D", "P"]
  expect: { fallback: false, calls: ["4D", "3D", "3NT", "2NT"] }

- name: pass_over_their_game_is_systemic
  hand: "852.864.94.QJ432"
  dealer: E
  calls: ["4S"]
  expect: { call: "P", fallback: false }

- name: gf_landing_3NT_no_fit
  hand: "K52.86.AQ4.KQ932"
  calls: ["1H", "P", "2C", "P", "2D", "P"]
