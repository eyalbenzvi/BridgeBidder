          # shortness normally goes through a splinter (9-13); above that
          # range the hand is too strong for one, so Jacoby takes it back
          any_of:
            - evals: { total_points: [13, 40], singleton_or_void: [0, 0] }
            - hcp: [15, 40]
              evals: { total_points: [15, 40] }
        shows: "Jacoby 2NT: 4+ spades, game-forcing raise, no shortness"
        establishes: { forcing: game_forcing, agreed_suit: S }
        alertable: true
        convention: jacoby_2nt
        when: { passed_hand: false }
      - id: r1S_2C
        call: 2C
        priority: 75
        requires: { hcp: [12, 40], suits: { C: [3, 13] }, not: { suits: { S: [4, 13] } } }
        shows: "2/1 game forcing: 3+ clubs, 12+ HCP"
        establishes: { forcing: game_forcing }
        when: { passed_hand: false, config: { two_over_one_suit_length: 3 } }
      - id: r1S_2C_4
        call: 2C
        priority: 75
        requires: { hcp: [12, 40], suits: { C: [4, 13] }, not: { suits: { S: [4, 13] } } }
        shows: "2/1 game forcing: 4+ clubs, 12+ HCP"
        establishes: { forcing: game_forcing }
        when: { passed_hand: false, config: { two_over_one_suit_length: 4 } }
      - id: r1S_2D
        call: 2D
        priority: 76
        requires: { hcp: [12, 40], suits: { D: [4, 13] }, evals: { "suit_diff(D,C)": [1, 13] }, not: { suits: { S: [4, 13] } } }
        shows: "2/1 game forcing: 4+ diamonds, 12+ HCP"
        establishes: { forcing: game_forcing }
        when: { passed_hand: false }
      - id: r1S_2H
        call: 2H
        priority: 77
        requires: { hcp: [12, 40], suits: { H: [5, 13] }, not: { suits: { S: [4, 13] } } }
        shows: "2/1 game forcing: 5+ hearts, 12+ HCP"
        establishes: { forcing: game_forcing }
        when: { passed_hand: false }
      - id: r1S_raise_passed
        call: 2S
        priority: 63
        when: { passed_hand: true }
        requires: { suits: { S: [3, 13] }, evals: { total_points: [10, 11] } }
        shows: "passed-hand raise: 10-11 kept LOW opposite a possibly light 3rd/4th-seat opening"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: r1S_limit_raise
        call: 3S
        priority: 62
        requires: { suits: { S: [3, 13] }, evals: { total_points: [10, 13] }, hcp: [8, 11] }
        shows: "limit raise: 3+ spades, 10-13 support points (a shapely 4-trump hand may hold 13)"
        establishes: { forcing: invitational, agreed_suit: S }
      - id: r1S_single_raise
        call: 2S
        priority: 60
        requires: { suits: { S: [3, 13] }, evals: { total_points: [6, 9] } }
        shows: "single raise: 3+ spades, 6-9 support points"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: r1S_game_raise_preempt
        call: 4S
        priority: 63
        requires:
          suits: { S: [5, 13] }
          hcp: [2, 9]
          features: [ "singleton_or_void(any)" ]
        shows: "preemptive game raise: 5+ spades, weak with shortness"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: r1S_1NT
        call: 1NT
        priority: 40
        requires:
          hcp: [6, 11]
          not: { suits: { S: [3, 13] }, evals: { total_points: [6, 9] } }
        shows: "1NT response: 6-11 HCP, denies a simple raise (semi-forcing)"
        establishes: { forcing: non_forcing }
        announce: "semi-forcing"
        when: { config: { forcing_nt: semi } }
      - id: r1S_1NT_full
        call: 1NT
        priority: 40
        requires:
          hcp: [6, 11]
          not: { suits: { S: [3, 13] }, evals: { total_points: [6, 9] } }
        shows: "forcing 1NT: 6-11 HCP"
        establishes: { forcing: one_round }
        alertable: true
        when: { config: { forcing_nt: full } }
      - id: r1S_pass
        call: P
        priority: 15
        requires: { hcp: [0, 5] }
        shows: "0-5 HCP: too weak to respond"
        establishes: { forcing: sign_off }

  # ===========================================================================
  # RESPONSES TO WEAK TWOS AND PREEMPTS (partner opened)
  # ===========================================================================

  - id: resp_weak2
    description: "Responses to partner's weak two (RONF: raises are to play)"
    expand: { W: [D, H, S] }
    pattern: "2$W - P - ?"
    rules:
      - id: rw2_raise3
        call: 3$W
        priority: 60
        requires: { suits: { $W: [3, 13] }, hcp: [0, 14] }
        shows: "raise to play / furthering the preempt (RONF)"
        establishes: { forcing: sign_off, agreed_suit: $W }
      - id: rw2_2NT_ask
        call: 2NT
        priority: 70
        # not with a VOID in partner's suit: the feature ask is a slam try in
        # the suit partner preempted, and you cannot ask about a suit you will
        # never play.  Such a hand has a fit-1.0 forcing new suit of its own.
        requires: { hcp: [15, 40], suits: { $W: [1, 13] } }
        shows: "strong inquiry (15+), asking for a feature"
        establishes: { forcing: one_round }
        alertable: true
        convention: feature_ask
      - id: rw2_pass
        call: P
        priority: 40
        requires: { hcp: [0, 14], suits: { $W: [0, 2] } }
        shows: "nothing to say opposite a weak two"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  - id: resp_weak2_major_game
    description: "Raising partner's weak two major to game"
    expand: { W: [H, S] }
    pattern: "2$W - P - ?"
    rules:
      - id: rw2_game
        call: 4$W
        priority: 65
        requires:
          suits: { $W: [3, 13] }
          any_of:
            - evals: { total_points: [17, 40] }
            - suits: { $W: [4, 13] }
              hcp: [4, 12]
        shows: "to play: values for game or a further preempt"
        establishes: { forcing: sign_off, agreed_suit: $W }

  # ===========================================================================
  # OPENER REBIDS after 1m - P - 1M - P
  # ===========================================================================

  - id: opener_rebid_1m_1M
    description: "Opener's rebid after a 1-level major response, no interference"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - ?"
    rules:
      - id: ob_raise_2$M
        call: 2$M
        priority: 80
        requires: { suits: { $M: [4, 13] }, evals: { total_points: [12, 15] } }
        shows: "raise: 4 $M support, minimum (12-15)"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: ob_raise_3$M
        call: 3$M
        priority: 78
        requires: { suits: { $M: [4, 13] }, evals: { total_points: [16, 18] } }
        shows: "jump raise: 4 $M support, invitational (16-18)"
        establishes: { forcing: invitational, agreed_suit: $M }
      # capped at 24 so a monster reaches the keycard rules (the 31-combined
      # gate opens at 25 opposite the 6+ response) instead of being shadowed
      - id: ob_raise_4$M
        call: 4$M
        priority: 76
        requires: { suits: { $M: [4, 13] }, evals: { total_points: [19, 24] } }
        shows: "game raise: 4 $M support, 19+ support points"
        establishes: { forcing: sign_off, agreed_suit: $M }
      # THE LIMIT BID BEATS THE SECOND SUIT.  With a semi-balanced minimum and
      # no fit, 1NT names the hand in one call; the cheap second minor is what
      # you bid when you cannot.  `ob_1D1S_2C` (priority 57) and this rule both
      # fit 1.00 on a 4-4 minor two-suiter that is also semi-balanced, and the
      # undescriptive call won on priority alone.  Raised from 55: a duplicate
      # rung at 57.5 has identical `requires` and therefore identical effect,
      # but it splits one call into two readings and loses a denial.
      - id: ob_1NT
        call: 1NT
        priority: 57.5
        # semi-balanced, not balanced: 5-4-2-2 is a 1NT rebid in anyone's
        # system, and requiring at most one doubleton pushed those hands
        # into rebidding a five-card minor instead.
        requires: { hcp: [12, 14], evals: { semi_balanced: [1, 1] }, not: { suits: { $M: [4, 13] } } }
        shows: "balanced minimum 12-14, no fit"
        establishes: { forcing: non_forcing }
      - id: ob_2NT
        call: 2NT
        priority: 56
        requires: { hcp: [18, 19], balanced: true, not: { suits: { $M: [4, 13] } } }
        shows: "jump: balanced 18-19, no fit"
        establishes: { forcing: non_forcing }
      - id: ob_rebid_2$m
        call: 2$m
        priority: 50
        requires: { suits: { $m: [5, 13] }, hcp: [10, 15], not: { suits: { $M: [4, 13] } } }
        shows: "rebid: 5+ (usually 6) $m, minimum"
        establishes: { forcing: non_forcing }
      - id: ob_rebid_3$m
        call: 3$m
        priority: 49
        requires: { suits: { $m: [6, 13] }, hcp: [16, 18], not: { suits: { $M: [4, 13] } } }
        shows: "jump rebid: 6+ good $m, 16-18"
        establishes: { forcing: invitational }

  - id: opener_rebid_1C_1H_extras
    description: "1C - 1H: opener's 1S / reverses"
    pattern: "1C - P - 1H - P - ?"
    rules:
      # Floor 10, not 12: the system opens 10- and 11-counts by the rule of
      # 20, and opener's rebids have to cover the hands opener actually
      # holds.  Rebidding the minor with four spades hidden was the result.
      - id: ob_1C1H_1S
        call: 1S
        priority: 60
        # A ONE-LEVEL rebid in a new suit is not limited to 17: it is the
        # cheapest way to show the second suit and opener bids again.  The
        # 17 cap left 18-19 WITH A FOUR-CARD MAJOR with no rule at all (the
        # 18-19 balanced 2NT rebid explicitly denies one), so an 18-count
        # holding 4-4 in the majors bid a generic 3NT over the 1D response.
        requires: { suits: { S: [4, 13] }, hcp: [10, 19], not: { suits: { H: [4, 13] } } }
        shows: "4+ spades, 10-17, unbalanced or 4-4-x-x"
        establishes: { forcing: non_forcing }
      - id: ob_1C1H_2D_reverse
        call: 2D
        priority: 58
        requires: { suits: { D: [4, 13], C: [5, 13] }, hcp: [17, 21] }
        shows: "reverse: 4+ diamonds, longer clubs, 17+"
        establishes: { forcing: one_round }
    when: {}

  - id: opener_rebid_1D_1H_extras
    description: "1D - 1H: opener's 1S / reverses"
    pattern: "1D - P - 1H - P - ?"
    rules:
      - id: ob_1D1H_1S
        call: 1S
        priority: 60
        # A ONE-LEVEL rebid in a new suit is not limited to 17: it is the
        # cheapest way to show the second suit and opener bids again.  The
        # 17 cap left 18-19 WITH A FOUR-CARD MAJOR with no rule at all (the
        # 18-19 balanced 2NT rebid explicitly denies one), so an 18-count
        # holding 4-4 in the majors bid a generic 3NT over the 1D response.
        requires: { suits: { S: [4, 13] }, hcp: [10, 19], not: { suits: { H: [4, 13] } } }
        shows: "4+ spades, 10-17"
        establishes: { forcing: non_forcing }
      - id: ob_1D1H_2C
        call: 2C
        priority: 58
        requires: { suits: { C: [4, 13], D: [4, 13] }, hcp: [10, 17], not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] } }
        shows: "second suit: 4+ clubs, 10-17"
        establishes: { forcing: non_forcing }
      - id: ob_1D1H_3C_jump
        call: 3C
        priority: 57
        requires: { suits: { C: [4, 13], D: [4, 13] }, hcp: [18, 21] }
        shows: "jump shift: 4+ clubs, 18+, game forcing"
        establishes: { forcing: game_forcing }

  - id: opener_rebid_1m_1S_extras
    description: "1m - 1S: opener's second suit / reverses"
    expand: { m: [C, D] }
    pattern: "1$m - P - 1S - P - ?"
    rules:
      - id: ob_1m1S_2H_reverse
        call: 2H
        priority: 58
        requires: { suits: { H: [4, 13], $m: [5, 13] }, hcp: [17, 21] }
        shows: "reverse: 4+ hearts, longer $m, 17+"
        establishes: { forcing: one_round }

  - id: opener_rebid_1C_1S_2D
    description: "1C - 1S: 2D is a reverse"
    pattern: "1C - P - 1S - P - ?"
    rules:
      - id: ob_1C1S_2D_reverse
        call: 2D
        priority: 57
        requires: { suits: { D: [4, 13], C: [5, 13] }, hcp: [17, 21] }
        shows: "reverse: 4+ diamonds, longer clubs, 17+"
        establishes: { forcing: one_round }

  - id: opener_rebid_1D_1S_2C
    description: "1D - 1S: 2C second suit (not a reverse)"
    pattern: "1D - P - 1S - P - ?"
    rules:
      - id: ob_1D1S_2C
        call: 2C
        priority: 57
        requires: { suits: { C: [4, 13], D: [4, 13] }, hcp: [10, 17], not: { suits: { S: [4, 13] } } }
        shows: "second suit: 4+ clubs, 10-17"
        establishes: { forcing: non_forcing }
      - id: ob_1D1S_3C_jump
        call: 3C
        priority: 56
        requires: { suits: { C: [4, 13], D: [4, 13] }, hcp: [18, 21] }
        shows: "jump shift: 4+ clubs, 18+, game forcing"
        establishes: { forcing: game_forcing }

  # ===========================================================================
  # OPENER REBIDS after 1M - P - 1NT (semi-forcing) and 1H - P - 1S
  # ===========================================================================

  - id: opener_rebid_1H_1S
    description: "Opener's rebid after 1H - 1S"
    pattern: "1H - P - 1S - P - ?"
    rules:
      - id: ob_1H1S_raise2S
        call: 2S
        priority: 80
        requires: { suits: { S: [4, 13] }, evals: { total_points: [12, 15] } }
        shows: "raise: 4 spades, minimum"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: ob_1H1S_raise3S
        call: 3S
        priority: 78
        requires: { suits: { S: [4, 13] }, evals: { total_points: [16, 18] } }
        shows: "jump raise: 4 spades, 16-18"
        establishes: { forcing: invitational, agreed_suit: S }
      # capped at 24 so a monster reaches the keycard rules (the 31-combined
      # gate opens at 25 opposite the 6+ response) instead of being shadowed
      - id: ob_1H1S_raise4S
        call: 4S
        priority: 76
        requires: { suits: { S: [4, 13] }, evals: { total_points: [19, 24] } }
        shows: "game raise: 4 spades, 19+"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: ob_1H1S_1NT
        call: 1NT
        priority: 55
        requires: { hcp: [12, 14], evals: { semi_balanced: [1, 1] }, not: { suits: { S: [4, 13] } } }
        shows: "12-14, no spade fit"
        establishes: { forcing: non_forcing }
      - id: ob_1H1S_2NT
        call: 2NT
        priority: 54
        requires: { hcp: [18, 19], balanced: true, not: { suits: { S: [4, 13] } } }
        shows: "jump: 18-19 balanced"
        establishes: { forcing: non_forcing }
      - id: ob_1H1S_2H
        call: 2H
        priority: 52
        requires: { suits: { H: [6, 13] }, hcp: [10, 15], not: { suits: { S: [4, 13] } } }
        shows: "rebid: 6+ hearts, minimum"
        establishes: { forcing: non_forcing }
      # Sibling sweep from ob_1M1NT_3$M, the same jump rebid over the 1NT
      # response, which states the gate in PLAYING points plus suit quality and
      # outranks the simple rebid instead of sitting under it.  Neither was ever
      # carried onto the 1H-1S ladder, so 15 HCP with seven hearts and a
      # singleton - an eighteen-point hand - rebid "minimum" and was passed.
      # The old HCP band is kept as an any_of branch, so this can only ever be a
      # superset of the rule it replaces.
      - id: ob_1H1S_3H
        call: 3H
        priority: 52.5
        requires:
          suits: { H: [6, 13] }
          not: { suits: { S: [4, 13] } }
          any_of:
            - { hcp: [16, 18] }
            - { evals: { total_points: [16, 19] }, features: [ "good_suit(H)" ] }
        shows: "jump rebid: 6+ good hearts, 16-19 playing strength"
        establishes: { forcing: invitational }
      - id: ob_1H1S_2m
        call: 2C
        priority: 50
        requires: { suits: { C: [4, 13] }, hcp: [12, 17], not: { suits: { S: [4, 13] } } }
        shows: "second suit: 4+ clubs"
        establishes: { forcing: non_forcing }
      - id: ob_1H1S_2D
        call: 2D
        priority: 49
        requires: { suits: { D: [4, 13] }, hcp: [12, 17], not: { any_of: [ { suits: { S: [4, 13] } }, { suits: { C: [5, 13] } } ] } }
        shows: "second suit: 4+ diamonds"
        establishes: { forcing: non_forcing }
      # Opener's cheap second suit IS limited - partner can pass 2C - so 18-21
      # belongs in a JUMP shift.  That ladder exists for 1D - 1M - 3C and was
      # never given to the major tree, so an 18-to-21 count with a second suit
      # had no rule at all and described itself as "13-19 balanced" by bidding
      # a generic 3NT.  Not applied to the 2C/2D rungs themselves: widening
      # those would delete the jump shift by priority.
      - id: ob_1H1S_3C_jump
        call: 3C
        priority: 48
        requires: { suits: { C: [4, 13] }, hcp: [18, 21], not: { suits: { S: [4, 13] } } }
        shows: "jump shift: 4+ clubs, 18-21, game forcing"
        establishes: { forcing: game_forcing }
      - id: ob_1H1S_3D_jump
        call: 3D
        priority: 47
        requires: { suits: { D: [4, 13] }, hcp: [18, 21], not: { any_of: [ { suits: { S: [4, 13] } }, { suits: { C: [5, 13] } } ] } }
        shows: "jump shift: 4+ diamonds, 18-21, game forcing"
        establishes: { forcing: game_forcing }

  - id: opener_rebid_1M_1NT
    description: "Opener's rebid over the (semi-)forcing 1NT"
    expand: { M: [H, S] }
    pattern: "1$M - P - 1NT - P - ?"
    rules:
      - id: ob_1M1NT_pass
        call: P
        priority: 55
        requires: { hcp: [12, 14], balanced: true }
        shows: "balanced minimum: passing the semi-forcing 1NT"
        establishes: { forcing: sign_off }
        when: { config: { forcing_nt: semi } }
      - id: ob_1M1NT_2C
        call: 2C
        priority: 52
        requires: { suits: { C: [3, 13] }, hcp: [12, 17], not: { suits: { $M: [6, 13] } } }
        shows: "3+ clubs, 12-17, no 6-card major"
        establishes: { forcing: non_forcing }
      - id: ob_1M1NT_2D
        call: 2D
        priority: 53
        requires: { suits: { D: [4, 13] }, hcp: [12, 17], not: { suits: { $M: [6, 13] } } }
        shows: "4+ diamonds, 12-17"
        establishes: { forcing: non_forcing }
      - id: ob_1M1NT_2$M
        call: 2$M
        priority: 54
        requires: { suits: { $M: [6, 13] }, hcp: [10, 15], evals: { total_points: [10, 15] } }
        shows: "6+ $M, minimum"
        establishes: { forcing: non_forcing }
      - id: ob_1M1NT_2NT
        call: 2NT
        priority: 51
        requires: { hcp: [18, 19], balanced: true }
        shows: "jump: 18-19 balanced"
        establishes: { forcing: non_forcing }
      - id: ob_1M1NT_3$M
        call: 3$M
        priority: 56
        requires:
          suits: { $M: [6, 13] }
          evals: { total_points: [16, 19] }
          features: [ "good_suit($M)" ]
        shows: "jump rebid: 6+ good $M, 16-19 playing strength"
        establishes: { forcing: invitational }
      - id: ob_1M1NT_4$M
        call: 4$M
        priority: 57
        requires:
          suits: { $M: [6, 13] }
          evals: { total_points: [20, 40] }
        shows: "too strong to invite: bidding game opposite 6-11"
        establishes: { forcing: sign_off, agreed_suit: $M }

  - id: opener_rebid_1S_1NT_second_major
    description: "1S - 1NT: 2H is the second suit (five spades and four hearts)"
    pattern: "1S - P - 1NT - P - ?"
    rules:
      # The 1M - 1NT context is expanded over both majors, so it can offer a
      # second suit in a minor but never the other major - and 1H - 1NT - 2S
      # would be a reverse, so only this half of it is a plain second suit.
      # Without it a 5-4 major hand had nothing to say and the generic 3NT
      # took over: on the BEN match that jump was the single most expensive
      # call in the rulebook.
      - id: ob_1S1NT_2H
        call: 2H
        priority: 53.5
        requires:
          suits: { S: [5, 13], H: [4, 13] }
          hcp: [12, 17]
          not: { suits: { S: [6, 13] } }
        shows: "second suit: five spades and 4+ hearts, 12-17"
        establishes: { forcing: non_forcing }

  - id: opener_rebid_1S_2H
    description: "Opener's rebid after the 1S - 2H game force"
    pattern: "1S - P - 2H - P - ?"
    rules:
      - id: ob_1S2H_raise3H
        call: 3H
        priority: 80
        requires: { suits: { H: [3, 13] } }
        shows: "3+ hearts: setting trumps (GF continues)"
        establishes: { forcing: game_forcing, agreed_suit: H }
      - id: ob_1S2H_4H
        call: 4H
        priority: 78
        requires: { suits: { H: [4, 13] }, hcp: [12, 14], evals: { singleton_or_void: [0, 0] } }
        shows: "4 hearts, minimum, no shortness"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: ob_1S2H_2S
        call: 2S
        priority: 60
        requires: { suits: { S: [6, 13] }, not: { suits: { H: [3, 13] } } }
        shows: "6+ spades"
        establishes: { forcing: game_forcing }
      # extras and a self-sufficient suit jump, setting trumps (see the
      # 2/1 trump-setting block below for why the jump matters: a quiet 2S
      # hides a 17-count and the auction drifts to 3NT past the slam)
      - id: ob_1S2H_3S
        call: 3S
        priority: 61
        requires: { suits: { S: [6, 13] }, hcp: [15, 21], not: { suits: { H: [3, 13] } } }
        shows: "jump rebid: 6+ spades and extras (15+), setting trumps (GF)"
        establishes: { forcing: game_forcing, agreed_suit: S }
      - id: ob_1S2H_2NT
        call: 2NT
        priority: 55
        requires: { evals: { semi_balanced: [1, 1] }, suits: { S: [5, 5] }, not: { suits: { H: [3, 13] } } }
        shows: "5332-ish, no heart fit"
        establishes: { forcing: game_forcing }
      - id: ob_1S2H_3C
        call: 3C
        priority: 52
        requires: { suits: { C: [4, 13] }, not: { any_of: [ { suits: { H: [3, 13] } }, { suits: { S: [6, 13] } } ] } }
        shows: "second suit: 4+ clubs"
        establishes: { forcing: game_forcing }
      - id: ob_1S2H_3D
        call: 3D
        priority: 51
        requires: { suits: { D: [4, 13] }, not: { any_of: [ { suits: { H: [3, 13] } }, { suits: { S: [6, 13] } } ] } }
        shows: "second suit: 4+ diamonds"
        establishes: { forcing: game_forcing }

  # ===========================================================================
  # OPENER REBIDS after a 2/1 in a minor (game force)
  # ===========================================================================

  - id: opener_rebid_after_2over1_minor
    description: "Opener's rebid after 1M - 2m (GF)"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
    pattern: "1$M - P - 2$x - P - ?"
    rules:
      - id: ob_2over1_2$M
        call: 2$M
        priority: 60
        requires: { suits: { $M: [6, 13] } }
        shows: "6+ $M (GF continues)"
        establishes: { forcing: game_forcing }
      - id: ob_2over1_2NT
        call: 2NT
        priority: 52
        requires: { hcp: [12, 14], evals: { semi_balanced: [1, 1] } }
        shows: "balanced minimum, stoppers likely (GF)"
        establishes: { forcing: game_forcing }
      - id: ob_2over1_3NT
        call: 3NT
        priority: 50
        requires: { hcp: [18, 19], balanced: true }
        shows: "18-19 balanced"
        establishes: { forcing: non_forcing }
      - id: ob_2over1_raise
        call: 3$x
        priority: 58
        requires: { suits: { $x: [4, 13] } }
        shows: "raising the 2/1 suit: 4+ $x (GF)"
        establishes: { forcing: game_forcing, agreed_suit: $x }
      # The strong jump rebid: a self-sufficient six-card suit with extras
      # sets trumps below game, so the cue-bid and keycard floor is reachable
      # from opener's side too.  Without it a 17-count with AKQxxx rebid a
      # quiet 2M (12-21) and the auction drifted to 3NT past a cold slam -
      # the head-to-head match lost exactly this board (1S - 2H - 2S - 2NT -
      # 3NT with 6S making).
      - id: ob_2over1_jump3$M
        call: 3$M
        priority: 62
        requires: { suits: { $M: [6, 13] }, hcp: [15, 21] }
        shows: "jump rebid: 6+ $M and extras (15+), setting trumps (GF)"
        establishes: { forcing: game_forcing, agreed_suit: $M }

  # ===========================================================================
  # RESPONDER'S REBID IN A 2/1 AUCTION: SETTING TRUMPS BELOW GAME
  #
  # The biggest structural hole the slam analysis found.  These positions had
  # no authored rules at all, so the generic toolkit's game raise fired: a
  # seventeen-count with three-card support jumped to a NON-FORCING 4M over
  # opener's rebid and the auction died at game with a slam on.  In 2/1 the
  # whole point of the game force is that nobody needs to jump: the raise to
  # THREE of opener's major sets trumps, is forcing to game by definition,
  # and leaves the four-level free for the cue-bid and keycard machinery
  # that already exists (agreed suit + game force + standing bid at the
  # three level is exactly the gate those contexts fire on).
  #
  # Fast arrival carries the negative inference: with a dead-minimum flat
  # game force responder jumps to game DIRECTLY, so the 3M raise promises
  # thirteen-plus and slam interest is real when the cheaper raise is chosen.
  # The 13/14 seam is deliberate: 3M's shown floor of 13 is what lets
  # opener's cue gate (14+ own, 28 combined) open opposite it.
  # ===========================================================================

  - id: responder_21_after_2M
    description: "Responder's rebid after 1M - 2m - 2M (opener shows 6+)"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
    pattern: "1$M - P - 2$x - P - 2$M - P - ?"
    rules:
      - id: r21_fast4_$M$x
        call: 4$M
        priority: 72
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [12, 13], semi_balanced: [1, 1] } }
        shows: "fast arrival: minimum flat game force with support, no slam interest"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: r21_set3_$M$x
        call: 3$M
        priority: 71
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [13, 40] } }
        shows: "setting trumps: 3+ $M, 13+, game forcing (slam interest possible)"
        establishes: { forcing: game_forcing, agreed_suit: $M }

  - id: responder_21_after_2NT
    description: "Responder's rebid after 1M - 2m - 2NT (opener balanced minimum)"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
    pattern: "1$M - P - 2$x - P - 2NT - P - ?"
    rules:
      - id: r21nt_fast4_$M$x
        call: 4$M
        priority: 72
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [12, 13] } }
        shows: "fast arrival: minimum game force with 3+ $M, no slam interest"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: r21nt_set3_$M$x
        call: 3$M
        priority: 71
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [13, 40] } }
        shows: "setting trumps: 3+ $M, 13+, game forcing (slam interest possible)"
        establishes: { forcing: game_forcing, agreed_suit: $M }

  # The same trump-setting raise when opener's rebid was a second suit: the
  # raise of opener's FIRST major promises only three (the suit is five-plus),
  # the raise of the second suit promises four.  Both are unlimited and both
  # leave the machinery room; the first-suit raise ranks above the 4-4 raise
  # because the 5-3 major is the fit the auction has actually confirmed.
  - id: responder_21_after_second_suit_1S
    description: "Responder's rebid after 1S - 2m - 2H"
    expand: { x: [C, D] }
    pattern: "1S - P - 2$x - P - 2H - P - ?"
    rules:
      - id: r21ss_set3_S$x
        call: 3S
        priority: 71
        requires: { suits: { S: [3, 13] }, evals: { total_points: [13, 40] } }
        shows: "setting trumps: 3+ spades, 13+, game forcing (slam interest possible)"
        establishes: { forcing: game_forcing, agreed_suit: S }
      - id: r21ss_raise2nd_H$x
        call: 3H
        priority: 70
        requires: { suits: { H: [4, 13] }, evals: { total_points: [13, 40] }, not: { suits: { S: [3, 13] } } }
        shows: "raising the second suit: 4+ hearts, 13+, game forcing"
        establishes: { forcing: game_forcing, agreed_suit: H }

  - id: responder_21_after_1S2H_rebid
    description: "Responder's rebid after 1S - 2H - 2S/2NT: delayed spade support"
    expand: { y: [2S, 2NT] }
    pattern: "1S - P - 2H - P - $y - P - ?"
    rules:
      - id: r21h_set3_S$y
        call: 3S
        priority: 71
        requires: { suits: { S: [3, 13] }, evals: { total_points: [13, 40] } }
        shows: "setting trumps: 3+ spades, 13+, game forcing (slam interest possible)"
        establishes: { forcing: game_forcing, agreed_suit: S }

  - id: responder_21_after_second_suit_1H
    description: "Responder's rebid after 1H - 2m - (second suit)"
    expand_pairs:
      - { x: C, y: 2D }
      - { x: C, y: 2S }
      - { x: D, y: 2S }
      - { x: D, y: 3C }
    pattern: "1H - P - 2$x - P - $y - P - ?"
    rules:
      - id: r21ss_set3_H$x$y
        call: 3H
        priority: 71
        requires: { suits: { H: [3, 13] }, evals: { total_points: [13, 40] } }
        shows: "setting trumps: 3+ hearts, 13+, game forcing (slam interest possible)"
        establishes: { forcing: game_forcing, agreed_suit: H }

  - id: opener_rebid_1H_2C_extras
    description: "1H - 2C: opener's second suits"
    pattern: "1H - P - 2C - P - ?"
    rules:
      - id: ob_1H2C_2D
        call: 2D
        priority: 55
        requires: { suits: { D: [4, 13] }, not: { suits: { H: [6, 13] } } }
        shows: "second suit: 4+ diamonds (GF)"
        establishes: { forcing: game_forcing }
      - id: ob_1H2C_2S
        call: 2S
        priority: 54
        requires: { suits: { S: [4, 13] }, hcp: [15, 21], not: { suits: { H: [6, 13] } } }
        shows: "second suit: 4+ spades, extras (high reverse in a GF)"
        establishes: { forcing: game_forcing }
  - id: opener_rebid_1H_2D_extras
    description: "1H - 2D: opener's second suits"
    pattern: "1H - P - 2D - P - ?"
    rules:
      - id: ob_1H2D_3C
        call: 3C
        priority: 54
        requires: { suits: { C: [4, 13] }, not: { suits: { H: [6, 13] } } }
        shows: "second suit: 4+ clubs (GF)"
        establishes: { forcing: game_forcing }
      - id: ob_1H2D_2S
        call: 2S
        priority: 53
        requires: { suits: { S: [4, 13] }, hcp: [15, 21], not: { suits: { H: [6, 13] } } }
        shows: "second suit: 4+ spades, extras (GF)"
        establishes: { forcing: game_forcing }
  - id: opener_rebid_1S_2m_extras
    description: "1S - 2m: opener's second suits"
    expand: { x: [C, D] }
    pattern: "1S - P - 2$x - P - ?"
    rules:
      - id: ob_1S2x_2H
        call: 2H
        priority: 54
        requires: { suits: { H: [4, 13] }, not: { suits: { S: [6, 13] } } }
        shows: "second suit: 4+ hearts (GF)"
        establishes: { forcing: game_forcing }

  # ===========================================================================
  # RESPONDER REBIDS (main uncontested lines)
  # ===========================================================================

  - id: responder_rebid_after_1NT_rebid
    description: "Responder's second call after 1m - 1M - 1NT"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 1NT - P - ?"
    rules:
      - id: rr_nt_pass
        call: P
        priority: 50
        requires: { hcp: [6, 10] }
        shows: "no game interest opposite 12-14"
        establishes: { forcing: sign_off }
      - id: rr_nt_2NT
        call: 2NT
        priority: 52
        requires: { hcp: [11, 12], not: { suits: { $M: [6, 13] } } }
        shows: "invitational 11-12"
        establishes: { forcing: invitational }
      # 13-16 plays 3NT; 17-18 opposite the 12-14 rebid is 29-32 combined,
      # which is a quantitative invite, not a sign-off (a 4-4 heart slam was
      # lost to this rule reading 13-18 - the invite is how 17+14 finds it)
      # full band kept as the backstop (the 4NT invite outranks it at 17-18)
      - id: rr_nt_3NT
        call: 3NT
        priority: 54
        requires: { hcp: [13, 18], not: { suits: { $M: [5, 13] } } }
        shows: "to play"
        establishes: { forcing: sign_off }
      - id: rr_nt_4NT
        call: 4NT
        priority: 55
        requires: { hcp: [17, 18], evals: { semi_balanced: [1, 1] }, not: { suits: { $M: [6, 13] } } }
        shows: "quantitative: 17-18 opposite the 12-14 rebid, inviting slam"
        establishes: { forcing: non_forcing }
        alertable: true
      - id: rr_nt_2$M
        call: 2$M
        priority: 51
        requires: { suits: { $M: [6, 13] }, hcp: [6, 10] }
        shows: "6+ $M, to play"
        establishes: { forcing: sign_off }
      - id: rr_nt_4$M
        call: 4$M
        priority: 53
        requires: { suits: { $M: [6, 13] }, hcp: [13, 18] }
        shows: "6+ $M, game values"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: rr_nt_second_$oM
        call: 2$oM
        priority: 51.5
        requires: { suits: { $oM: [4, 13], $M: [5, 13] }, hcp: [6, 11] }
        shows: "5-4: the second suit, to play"
        establishes: { forcing: non_forcing }
      - id: rr_nt_gf3_$M
        call: 3$M
        priority: 53.5
        requires: { suits: { $M: [5, 13] }, hcp: [12, 18] }
        shows: "5+ $M, game forcing: asking for three-card support"
        establishes: { forcing: game_forcing }
      - id: rr_nt_slam3_$M
        call: 3$M
        priority: 56
        requires: { suits: { $M: [5, 13] }, hcp: [19, 40] }
        shows: "5+ $M with slam values opposite the 12-14 rebid"
        establishes: { forcing: game_forcing }

  - id: responder_rebid_after_1H_1S_1NT
    description: "Responder's second call after 1H - 1S - 1NT (the 1m twin is above)"
    pattern: "1H - P - 1S - P - 1NT - P - ?"
    rules:
      - id: rrh_nt_pass
        call: P
        priority: 50
        requires: { hcp: [6, 10] }
        shows: "no game interest opposite 12-14"
        establishes: { forcing: sign_off }
      - id: rrh_nt_2NT
        call: 2NT
        priority: 52
        requires: { hcp: [11, 12], not: { suits: { S: [6, 13] } } }
        shows: "invitational 11-12"
        establishes: { forcing: invitational }
      - id: rrh_nt_3NT
        call: 3NT
        priority: 54
        requires: { hcp: [13, 18], not: { suits: { S: [5, 13] } } }
        shows: "to play"
        establishes: { forcing: sign_off }
      - id: rrh_nt_2S
        call: 2S
        priority: 51
        requires: { suits: { S: [6, 13] }, hcp: [6, 10] }
        shows: "6+ S, to play"
        establishes: { forcing: sign_off }
      - id: rrh_nt_2H
        call: 2H
        priority: 51.5
        requires: { suits: { H: [3, 13] }, hcp: [6, 10] }
        shows: "preference back to opener's hearts, no game interest"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: rrh_nt_3S
        call: 3S
        priority: 53.5
        requires: { suits: { S: [5, 13] }, hcp: [12, 18] }
        shows: "5+ S, game forcing: asking for three-card support"
        establishes: { forcing: game_forcing }
      - id: rrh_nt_3H
        call: 3H
        priority: 53
        requires: { suits: { H: [3, 13] }, hcp: [11, 12] }
        shows: "invitational raise of opener's hearts"
        establishes: { forcing: invitational, agreed_suit: H }
      - id: rrh_nt_4H
        call: 4H
        priority: 54.5
        requires: { suits: { H: [3, 13] }, hcp: [13, 18] }
        shows: "game in opener's hearts"
        establishes: { forcing: sign_off, agreed_suit: H }

  # The 3$M checkback was authored without the seat that has to ANSWER it.
  # Opener's reply fell to the generic toolkit, which invented calls like 4C
  # over a game-forcing 3S: a ladder and its answering context are one fix,
  # never two.
  - id: opener_answers_checkback_3M
    description: "Opener answers responder's game-forcing 3M over the 1NT rebid"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 1NT - P - 3$M - P - ?"
    rules:
      - id: oac3_4NT_$M
        call: 4NT
        priority: 62
        requires:
          suits: { $M: [3, 13] }
          hcp: [14, 14]
          evals: { controls: [4, 12] }
        shows: "three-card support and a maximum: keycard ask for $M"
        establishes: { forcing: one_round, agreed_suit: $M, asking: keycards }
        alertable: true
        convention: rkc_1430
      - id: oac3_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [3, 13] } }
        shows: "three-card support for the checkback: game in $M"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: oac3_3NT_$M
        call: 3NT
        priority: 58
        requires: { suits: { $M: [0, 2] } }
        shows: "no third trump: 3NT is our game"
        establishes: { forcing: sign_off }

  - id: opener_answers_checkback_3S
    description: "Opener answers the 3S checkback after 1H - 1S - 1NT"
    pattern: "1H - P - 1S - P - 1NT - P - 3S - P - ?"
    rules:
      - id: oac3s_4NT
        call: 4NT
        priority: 62
        requires:
          suits: { S: [3, 13] }
          hcp: [14, 14]
          evals: { controls: [4, 12] }
        shows: "three-card support and a maximum: keycard ask for spades"
        establishes: { forcing: one_round, agreed_suit: S, asking: keycards }
        alertable: true
        convention: rkc_1430
      - id: oac3s_4S
        call: 4S
        priority: 60
        requires: { suits: { S: [3, 13] } }
        shows: "three-card support for the checkback: game in spades"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: oac3s_3NT
        call: 3NT
        priority: 58
        requires: { suits: { S: [0, 2] } }
        shows: "no third trump: 3NT is our game"
        establishes: { forcing: sign_off }

  - id: responder_rebid_after_raise
    description: "Responder's second call after 1m - 1M - 2M"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2$M - P - ?"
    rules:
      - id: rr_raise_pass
        call: P
        priority: 50
        requires: { evals: { total_points: [6, 10] } }
        shows: "no game interest opposite the minimum raise"
        establishes: { forcing: sign_off }
      # Capped at 18: the head-to-head lost a board where a 19-count jumped
      # to game here (this rule read 13-40) and shadowed the RKC ask by
      # priority - opposite the 12-15 raise, nineteen-plus is slam territory
      # and belongs to the slam-try rules, not to a sign-off.
      - id: rr_raise_game
        call: 4$M
        priority: 54
        requires: { evals: { total_points: [13, 18] }, suits: { $M: [4, 13] } }
        shows: "game values opposite the raise (slam moves start at 19)"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: rr_raise_inv
        call: 3$M
        priority: 52
        requires: { evals: { total_points: [11, 12] }, suits: { $M: [4, 13] } }
        shows: "invitational opposite the raise"
        establishes: { forcing: invitational, agreed_suit: $M }

  - id: responder_rebid_after_1M_raise
    description: "Responder continuation after 1M - 2M"
    expand: { M: [H, S] }
    pattern: "1$M - P - 2$M - P - ?"
    rules:
      - id: op_after_raise_pass
        call: P
        priority: 50
        requires: { evals: { total_points: [12, 16] } }
        shows: "no game interest opposite 6-9"
        establishes: { forcing: sign_off }
      # Capped at 24 (was 19-40) so a true monster reaches the RKC rules
      # instead of being shadowed by this sign-off's higher priority:
      # opposite the 6-9 raise the keycard gate (31 combined) opens at 25.
      - id: op_after_raise_game
        call: 4$M
        priority: 54
        requires: { evals: { total_points: [19, 24] } }
        shows: "bidding game opposite the single raise"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: op_after_raise_inv
        call: 3$M
        priority: 52
        requires: { evals: { total_points: [17, 18] } }
        shows: "game try opposite the single raise"
        establishes: { forcing: invitational, agreed_suit: $M }

  - id: opener_after_limit_raise
    description: "Opener over the limit raise 1M - 3M"
    expand: { M: [H, S] }
    pattern: "1$M - P - 3$M - P - ?"
    rules:
      # Capped at 20 (was 14-40) so a slam-worthy opener is not shadowed out
      # of the keycard rules by this sign-off's priority: opposite the 10-13
      # limit raise the 31-combined gate opens at 21.
      - id: op_lr_game
        call: 4$M
        priority: 54
        requires: { evals: { total_points: [14, 20] } }
        shows: "accepting the limit raise"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: op_lr_pass
        call: P
        priority: 50
        requires: { evals: { total_points: [12, 13] } }
        shows: "declining the limit raise (dead minimum)"
        establishes: { forcing: sign_off }

  - id: opener_after_splinter_wasted
    description: "Opener over responder's splinter: duplication check"
    expand_pairs:
      - { M: H, J: 3S }
      - { M: H, J: 4C }
      - { M: H, J: 4D }
      - { M: S, J: 4C }
      - { M: S, J: 4D }
      - { M: S, J: 4H }
    pattern: "1$M - P - $J - P - ?"
    rules:
      # The splinter shows shortness where responder bid; K/Q/J there are
      # wasted, and the classic rule is: wasted values sign off, working
      # values (aces, small cards) cooperate.  With no waste the existing
      # cue and keycard rules take over - this context only adds the brake.
      - id: spl_wasted_4$M
        call: 4$M
        priority: 47
        requires: { evals: { wasted_in_partner_shortness: [4, 40], total_points: [0, 18] } }
        shows: "wasted honors opposite the splinter shortness: minimum game"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      # the floor: a context that defines a call must never delete it.  This
      # context claimed 4$M and thereby shadowed the generic game sign-off;
      # a softly-vetoed 4NT then won by default and a 4H+1 became 6H-1.
      - id: spl_signoff_4$M
        call: 4$M
        priority: 34
        requires: {}
        shows: "signing off in the agreed game over the splinter"
        establishes: { forcing: non_forcing, agreed_suit: $M }
        negative_inference_weight: soft

  - id: opener_after_jacoby
    description: "Opener's rebid over Jacoby 2NT"
    expand: { M: [H, S] }
    pattern: "1$M - P - 2NT - P - ?"
    rules:
      - id: jac_shortness_C
        call: 3C
        priority: 70
        requires: { suits: { C: [0, 1] }, hcp: [12, 40] }
        shows: "singleton or void in clubs"
        establishes: { forcing: game_forcing }
        alertable: true
      - id: jac_shortness_D
        call: 3D
        priority: 70
        requires: { suits: { D: [0, 1] }, hcp: [12, 40] }
        shows: "singleton or void in diamonds"
        establishes: { forcing: game_forcing }
        alertable: true
      - id: jac_extras_3$M
        call: 3$M
        priority: 60
        requires: { hcp: [15, 40], evals: { singleton_or_void: [0, 0] } }
        shows: "extra values (15+), no shortness: slam interest"
        establishes: { forcing: game_forcing }
      - id: jac_3NT
        call: 3NT
        priority: 55
        requires: { hcp: [14, 15], evals: { singleton_or_void: [0, 0] } }
        shows: "14-15 semi-balanced, no shortness"
        establishes: { forcing: game_forcing }
        alertable: true
      - id: jac_minimum_4$M
        call: 4$M
        priority: 50
        requires: { hcp: [12, 14], evals: { singleton_or_void: [0, 0] } }
        shows: "minimum, no shortness, no slam interest"
        establishes: { forcing: non_forcing }

  - id: opener_after_jacoby_H_shortS
    description: "1H - 2NT: 3S shows spade shortness"
    pattern: "1H - P - 2NT - P - ?"
    rules:
      - id: jac_H_short_S
        call: 3S
        priority: 70
        requires: { suits: { S: [0, 1] }, hcp: [12, 40] }
        shows: "singleton or void in spades"
        establishes: { forcing: game_forcing }
        alertable: true
  - id: opener_after_jacoby_S_shortH
