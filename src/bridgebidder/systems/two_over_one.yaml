  # ===========================================================================
  # AFTER A REDOUBLE
  #
  # The redouble left the same hole the double did: no generic pattern matches
  # a trailing XX, so 55 of 131 undiscussed fallbacks over 1000 deals were
  # sitting in one of these two positions.  Both are covered here - the call
  # straight after the redouble, and the one after it has been passed back.
  #
  # `we_bid_last` splits the roles again:
  #
  #   their bid stands - partner doubled it and they redoubled.  Partner has
  #     announced a takeout double's values and asked for my suit; the
  #     redouble says they are happy to play it there.  Passing hands them a
  #     redoubled contract, so I bid my longest suit, four cards is plenty,
  #     and points do not come into it.
  #
  #   our bid stands - my call was doubled and partner redoubled, so the
  #     values are ours and the auction is not going away.  Describe the
  #     hand: six of my own suit, a balanced hand with a stopper, a second
  #     suit, in that order.
  # ===========================================================================

  - id: general_after_redouble
    description: "General agreements once a redouble is on the table"
    expand: { TAIL: [ "?", "P - ?" ] }
    pattern: "... - XX - $TAIL"
    rules:
      - id: rr_run_C1
        call: 1C
        priority: 26
        when: { we_bid_last: false, unbid_suit: C, cheapest_in_suit: true, i_have_acted: false }
