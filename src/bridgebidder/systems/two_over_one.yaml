  # ===========================================================================
  # ROUND-6 GAPS: continuations after a 2NT-opening transfer, and opener's
  # action over responder's competitive invitational 2NT
  # ===========================================================================

  - id: nt2_after_transfer
    description: "Responder's rebid after the completed 2NT transfer"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "2NT - P - 3$T - P - 3$M - P - ?"
    rules:
      - id: nt2_tr_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [5, 13] }, hcp: [3, 40] }
        shows: "game in $M opposite 20-21"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: nt2_tr_3NT
        call: 3NT
        priority: 56
        requires: { suits: { $M: [5, 5] }, hcp: [5, 40], evals: { semi_balanced: [1, 1] } }
        shows: "choice of games with exactly 5 $M opposite 20-21"
        establishes: { forcing: sign_off }
      - id: nt2_tr_slam
        call: 4NT
        priority: 58
        requires: { hcp: [11, 40], evals: { semi_balanced: [1, 1] } }
        shows: "quantitative slam invitation opposite 20-21"
        establishes: { forcing: invitational }
        alertable: true
      - id: nt2_tr_pass
        call: P
        priority: 45
        requires: { hcp: [0, 2] }
        shows: "bust: 3$M is high enough opposite 20-21"
        establishes: { forcing: sign_off }

  - id: opener_over_competitive_2NT
    description: "Opener's action over responder's invitational 2NT in competition"
    expand: { M: [H, S] }
    pattern: "1$M - act - 2NT - P - ?"
    rules:
      - id: oc2nt_4$M
        call: 4$M
        priority: 62
        requires:
          suits: { $M: [6, 13] }
          evals: { total_points: [15, 40] }
        shows: "6+ $M with extras: bidding game opposite the invitation"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: oc2nt_3$M
        call: 3$M
        priority: 58
        requires:
          suits: { $M: [6, 13] }
          evals: { total_points: [12, 14] }
        shows: "6+ $M, minimum: correcting to our suit"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: oc2nt_3NT
        call: 3NT
        priority: 56
        requires:
          hcp: [14, 40]
          features: [ "stopper(their)" ]
          not: { suits: { $M: [6, 13] } }
        shows: "accepting the invitation with a stopper in their suit"
        establishes: { forcing: sign_off }
      - id: oc2nt_pass
        call: P
        priority: 45
        requires:
          hcp: [12, 13]
          not: { suits: { $M: [6, 13] } }
        shows: "minimum: declining the invitation"
        establishes: { forcing: sign_off }

  - id: opener_choice_after_2NT_jump_3M
    description: "Opener chooses the game after responder shows 5 cards over the 2NT jump"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2NT - P - 3$M - P - ?"
    rules:
      - id: o2ntj_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [3, 13] } }
        shows: "3-card support: playing game in the 5-3 major fit"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: o2ntj_3NT
        call: 3NT
        priority: 55
        requires: { suits: { $M: [0, 2] } }
        shows: "no 3-card support: 3NT it is"
        establishes: { forcing: sign_off }

  # ===========================================================================
  # REGRET-ROUND GAP: opener's rebid after 1C - 1D (the general 2NT rule was
  # filling this in, describing opener as 11-12 when opener holds 12+)
  # ===========================================================================

  - id: opener_rebid_1C_1D
    description: "Opener's rebid after 1C - P - 1D"
    pattern: "1C - P - 1D - P - ?"
    rules:
      - id: ob1C1D_1H
