        priority: 64
        requires: { suits: { S: [6, 13] }, hcp: [13, 40], features: [ "good_suit(S)" ] }
        shows: "overcalling the preempt: good 6+ S, 13+"
        establishes: { forcing: non_forcing }
      - id: v3_C_pass
        call: P
        priority: 30
        requires: { hcp: [0, 15] }
        shows: "nothing suitable over their preempt"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

