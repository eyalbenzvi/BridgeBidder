# =============================================================================
# Two-over-One Game Forcing — system knowledge base
#
# The bidding system is DATA.  Each context matches a family of auction
# positions (pattern is matched after stripping leading passes; "?" is the
# decision point, "..." matches any prefix).  Rules are candidate calls with
# hand constraints, priorities (higher = systemically preferred), shown
# meanings, forcing implications and conditions.
#
# Style decisions and config flags are documented in DECISIONS.md.
# =============================================================================

system:
  name: "Two-over-One Game Forcing"
  config:
    forcing_nt: semi            # semi | full  (semi: opener may pass 1NT with bal min)
    two_over_one_suit_length: 3 # minimum minor length for a 2/1 response
    nt_with_5M: true            # 1NT opening allowed with a 5-card major (5332)
  defense_notes: >
    Defense to their 1NT: natural (X = penalty 15+, 2-level bids natural 5+
    cards, constructive).  No Michaels/unusual NT; cue-bids of their suit are
    limit+ raises of partner only in the sequences defined below.

contexts:

  # ===========================================================================
  # OPENING BIDS (pattern "?" = nobody has acted yet; leading passes stripped,
  # opening_seat conditions distinguish 1st-4th chair)
  # ===========================================================================

  - id: openings
    description: "Opening bids, all seats"
    pattern: "?"
    rules:
      - id: open_2C
        call: 2C
        priority: 96
        requires:
          any_of:
            - hcp: [22, 40]
            - hcp: [18, 21]
              evals: { ltc: [0, 3.5], longest_suit_length: [5, 13] }
        shows: "strong artificial: 22+ HCP or equivalent playing strength"
        establishes: { forcing: game_forcing, game_force: false }
        alertable: true
        convention: strong_2C

      - id: open_2NT
        call: 2NT
        priority: 94
        requires: { hcp: [20, 21], balanced: true }
        shows: "20-21 balanced"
        establishes: { forcing: non_forcing }

      - id: open_1NT
        call: 1NT
        priority: 92
        requires: { hcp: [15, 17], balanced: true }
        shows: "15-17 balanced (may contain a 5-card major)"
        establishes: { forcing: non_forcing }
        when: { config: { nt_with_5M: true } }

      - id: open_1NT_no5M
        call: 1NT
        priority: 92
        requires:
          hcp: [15, 17]
          balanced: true
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "15-17 balanced, no 5-card major"
        establishes: { forcing: non_forcing }
        when: { config: { nt_with_5M: false } }

      - id: open_1S
        call: 1S
        priority: 81
        requires:
          suits: { S: [5, 13] }
          hcp: [12, 21]
          evals: { "suit_diff(S,H)": [0, 13] }
        shows: "5+ spades, 12-21 HCP"
        establishes: { forcing: non_forcing }

      - id: open_1H
        call: 1H
        priority: 80
        requires:
          suits: { H: [5, 13] }
          hcp: [12, 21]
          evals: { "suit_diff(H,S)": [1, 13] }
        shows: "5+ hearts, 12-21 HCP"
        establishes: { forcing: non_forcing }

      # rule-of-20 light openings, 1st/2nd seat only
      # rule-of-22 refinement, split by suit: the majors open on 1.5 quick
      # tricks (a shapely 5-5 or good 6-card major is an opening bid in any
      # expert's book - a flat 2.0 gate measurably passed those), while the
      # minors keep the full 2.0 so quacky collections stay closed
      - id: open_1S_rule20
        call: 1S
        priority: 79
        requires:
          suits: { S: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_20: [20, 33], quick_tricks: [1.5, 12], "suit_diff(S,H)": [0, 13], suit_quality(S): [1.5, 9] }
        shows: "5+ spades, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      # Seat 3 had NO rule-of-20 opening at all: the third-seat light rule
      # demands 2.5 suit quality, a HIGHER bar than seats 1-2, so a hand that
      # opens light in first chair was passed out in third.  Capped at seven
      # cards so an eight-bagger still preempts.
      - id: open_1S_rule20_third
        call: 1S
        priority: 79
        requires:
          suits: { S: [5, 7] }
          hcp: [10, 11]
          evals: { rule_of_20: [20, 33], quick_tricks: [1.5, 12], "suit_diff(S,H)": [0, 13], suit_quality(S): [1.5, 9] }
        shows: "5+ spades, third-seat light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [3] }

      - id: open_1H_rule20
        call: 1H
        priority: 78
        requires:
          suits: { H: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_20: [20, 33], quick_tricks: [1.5, 12], "suit_diff(H,S)": [1, 13], suit_quality(H): [1.5, 9] }
        shows: "5+ hearts, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      - id: open_1H_rule20_third
        call: 1H
        priority: 78
        requires:
          suits: { H: [5, 7] }
          hcp: [10, 11]
          evals: { rule_of_20: [20, 33], quick_tricks: [1.5, 12], "suit_diff(H,S)": [1, 13], suit_quality(H): [1.5, 9] }
        shows: "5+ hearts, third-seat light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [3] }

      # Third-seat light opening: partner has passed, so the bid is part
      # obstruction, part lead direction - and it is allowed ONLY with a
      # suit worth leading (two-plus of the top honours).  A bad suit light
      # third-seat opening helps the defence more than the offence.
      - id: open_1S_third_light
        call: 1S
        priority: 76
        requires:
          # capped at 7 cards: an 8-bagger is a 4-level preempt, not a 1-bid
          suits: { S: [5, 7] }
          # a 6-7 card suit at 9-10 HCP is a weak two / preempt, which is
          # both more descriptive and more obstructive; the light 1-bid is
          # for the 5-card hands, and for 11-counts too strong to preempt
          any_of:
            - suits: { S: [5, 5] }
            - hcp: [11, 11]
          hcp: [9, 11]
          evals: { "suit_quality(S)": [2.5, 9] }
        shows: "third-seat light opening: 5+ good spades, 9-11"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [3] }
      - id: open_1H_third_light
        call: 1H
        priority: 75
        requires:
          # capped at 7 cards: an 8-bagger is a 4-level preempt, not a 1-bid
          suits: { H: [5, 7] }
          # a 6-7 card suit at 9-10 HCP is a weak two / preempt, which is
          # both more descriptive and more obstructive; the light 1-bid is
          # for the 5-card hands, and for 11-counts too strong to preempt
          any_of:
            - suits: { H: [5, 5] }
            - hcp: [11, 11]
          hcp: [9, 11]
          evals: { "suit_quality(H)": [2.5, 9], "suit_diff(H,S)": [1, 13] }
        shows: "third-seat light opening: 5+ good hearts, 9-11"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [3] }

      # 4th seat: rule of 15
      - id: open_1S_rule15
        call: 1S
        priority: 77
        requires:
          suits: { S: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_15: [15, 30], "suit_diff(S,H)": [0, 13] }
        shows: "5+ spades, 4th-seat opening satisfying the rule of 15"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [4] }

      - id: open_1H_rule15
        call: 1H
        priority: 76
        requires:
          suits: { H: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_15: [15, 30], "suit_diff(H,S)": [1, 13] }
        shows: "5+ hearts, 4th-seat opening satisfying the rule of 15"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [4] }
      - id: open_1D_rule15
        call: 1D
        priority: 75
        requires:
          suits: { D: [4, 13] }
          hcp: [10, 11]
          evals: { rule_of_15: [15, 30], "suit_diff(D,C)": [0, 13] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "4th-seat opening satisfying the rule of 15 (better minor)"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [4] }
      - id: open_1C_rule15
        call: 1C
        priority: 74
        requires:
          suits: { C: [4, 13] }
          hcp: [10, 11]
          evals: { rule_of_15: [15, 30], "suit_diff(C,D)": [1, 13] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "4th-seat opening satisfying the rule of 15 (better minor)"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [4] }

      - id: open_1D
        call: 1D
        priority: 74
        requires:
          hcp: [12, 21]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
          any_of:
            - suits: { D: [4, 13] }
              evals: { "suit_diff(D,C)": [0, 13] }
            - suits: { D: [3, 3], C: [0, 2] }
        shows: "opening, 3+ diamonds (better minor), no 5-card major, 12-21 HCP"
        establishes: { forcing: non_forcing }

      - id: open_1C
        call: 1C
        priority: 73
        requires:
          hcp: [12, 21]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
          any_of:
            - suits: { C: [4, 13] }
              evals: { "suit_diff(C,D)": [1, 13] }
            - suits: { C: [3, 3], D: [0, 3] }
        shows: "opening, 3+ clubs (better minor), no 5-card major, 12-21 HCP"
        establishes: { forcing: non_forcing }

      - id: open_1m_rule20
        call: 1D
        priority: 72
        requires:
          hcp: [10, 11]
          suits: { D: [5, 13] }
          evals: { rule_of_20: [20, 33], "suit_diff(D,C)": [0, 13] }
          # 2 quick tricks, waived for a 7+ card suit: the hand must open SOMETHING
          any_of:
            - evals: { quick_tricks: [2, 12] }
            - suits: { D: [7, 13] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "5+ diamonds, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      # SIBLING GAP: open_1$M_rule20_third exists for both majors and the
      # minors never got one, so third seat could not make a light minor
      # opening at all - eleven points with five clubs and two quick tricks
      # passed out where BEN opens 1C at confidence 1.00.  Same gates as the
      # first/second-seat rule above, plus the third-seat lead-direction
      # requirement the major twins carry: a light third-seat opening is part
      # obstruction and part lead direction, so the suit must be worth leading.
      - id: open_1D_rule20_third
        call: 1D
        priority: 72
        requires:
          hcp: [10, 11]
          suits: { D: [5, 13] }
          evals: { rule_of_20: [20, 33], "suit_diff(D,C)": [0, 13],
                   quick_tricks: [1.5, 12], "suit_quality(D)": [1.5, 9] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "5+ d, third-seat light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [3] }

      - id: open_1C_rule20
        call: 1C
        priority: 71
        requires:
          hcp: [10, 11]
          suits: { C: [5, 13] }
          evals: { rule_of_20: [20, 33], "suit_diff(C,D)": [1, 13] }
          # 2 quick tricks, waived for a 7+ card suit: the hand must open SOMETHING
          any_of:
            - evals: { quick_tricks: [2, 12] }
            - suits: { C: [7, 13] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "5+ clubs, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      # weak twos: 6-card suit, 5-10 HCP, suit quality tightens when vulnerable.
      # Preempt veto: fast defensive tricks OUTSIDE the suit veto the
      # preempt (2.5+; AK inside your own seven-bagger is offence, and the
      # measured corpus keeps preempts holding exactly two outside).
      # SIBLING GAP: open_1$M_rule20_third exists for both majors and the
      # minors never got one, so third seat could not make a light minor
      # opening at all - eleven points with five clubs and two quick tricks
      # passed out where BEN opens 1C at confidence 1.00.  Same gates as the
      # first/second-seat rule above, plus the third-seat lead-direction
      # requirement the major twins carry: a light third-seat opening is part
      # obstruction and part lead direction, so the suit must be worth leading.
      - id: open_1C_rule20_third
        call: 1C
        priority: 71
        requires:
          hcp: [10, 11]
          suits: { C: [5, 13] }
          evals: { rule_of_20: [20, 33], "suit_diff(C,D)": [1, 13],
                   quick_tricks: [1.5, 12], "suit_quality(C)": [1.5, 9] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "5+ c, third-seat light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [3] }

      - id: open_weak_2S_nv
        call: 2S
        priority: 66
        requires:
          suits: { S: [6, 6], H: [0, 3] }
          hcp: [5, 10]
          evals: { "suit_quality(S)": [1, 9], "quick_tricks_outside(S)": [0, 2] }
        shows: "weak two: 6 spades, 5-10 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_weak_2S_vul
        call: 2S
        priority: 66
        requires:
          suits: { S: [6, 6], H: [0, 3] }
          hcp: [7, 10]
          evals: { "suit_quality(S)": [1.5, 9], "quick_tricks_outside(S)": [0, 2] }
        shows: "weak two: 6 decent spades, 7-10 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_weak_2H_nv
        call: 2H
        priority: 65
        requires:
          suits: { H: [6, 6], S: [0, 3] }
          hcp: [5, 10]
          evals: { "suit_quality(H)": [1, 9], "quick_tricks_outside(H)": [0, 2] }
        shows: "weak two: 6 hearts, 5-10 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_weak_2H_vul
        call: 2H
        priority: 65
        requires:
          suits: { H: [6, 6], S: [0, 3] }
          hcp: [7, 10]
          evals: { "suit_quality(H)": [1.5, 9], "quick_tricks_outside(H)": [0, 2] }
        shows: "weak two: 6 decent hearts, 7-10 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_weak_2D_nv
        call: 2D
        priority: 64
        requires:
          suits: { D: [6, 6], H: [0, 3], S: [0, 3] }
          hcp: [5, 10]
          evals: { "suit_quality(D)": [1, 9], "quick_tricks_outside(D)": [0, 2] }
        shows: "weak two: 6 diamonds, 5-10 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_weak_2D_vul
        call: 2D
        priority: 64
        requires:
          suits: { D: [6, 6], H: [0, 3], S: [0, 3] }
          hcp: [7, 10]
          evals: { "suit_quality(D)": [1.5, 9], "quick_tricks_outside(D)": [0, 2] }
        shows: "weak two: 6 decent diamonds, 7-10 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }

      # 3-level preempts: 7-card suit, seats 1-3.  A side major vetoes the
      # preempt only when it is a REAL suit (4+ cards with 1.5+ quality):
      # the maxim protects a biddable major fit, and Q9xxx or T8xx is not
      # a suit worth passing a seven-bagger for.
      # A seven-card suit is the preempt; `good_suit` (two of the top three)
      # was refusing to preempt on KJ9xxxx and QJTxxxx, which is most of
      # them.  Quality is a matter of degree and of vulnerability instead:
      # any seven-bagger with an honour or two non-vulnerable, a decent one
      # when a bad result costs 200 a trick.
      - id: open_3C_nv
        call: 3C
        priority: 60
        requires:
          suits: { C: [7, 13] }
          not:
            any_of:
              - suits: { H: [4, 13] }
                evals: { "suit_quality(H)": [1.5, 9] }
              - suits: { S: [4, 13] }
                evals: { "suit_quality(S)": [1.5, 9] }
          hcp: [3, 9]
          evals: { "suit_quality(C)": [0, 9], "quick_tricks_outside(C)": [0, 2] }
        shows: "preempt: 7+ clubs, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3C_vul
        call: 3C
        priority: 60
        requires:
          suits: { C: [7, 13] }
          not:
            any_of:
              - suits: { H: [4, 13] }
                evals: { "suit_quality(H)": [1.5, 9] }
              - suits: { S: [4, 13] }
                evals: { "suit_quality(S)": [1.5, 9] }
          hcp: [5, 9]
          evals: { "suit_quality(C)": [1, 9], "quick_tricks_outside(C)": [0, 2] }
        shows: "preempt: 7+ decent clubs, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_3D_nv
        call: 3D
        priority: 60
        requires:
          suits: { D: [7, 13] }
          not:
            any_of:
              - suits: { H: [4, 13] }
                evals: { "suit_quality(H)": [1.5, 9] }
              - suits: { S: [4, 13] }
                evals: { "suit_quality(S)": [1.5, 9] }
          hcp: [3, 9]
          evals: { "suit_quality(D)": [0, 9], "quick_tricks_outside(D)": [0, 2] }
        shows: "preempt: 7+ diamonds, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3D_vul
        call: 3D
        priority: 60
        requires:
          suits: { D: [7, 13] }
          not:
            any_of:
              - suits: { H: [4, 13] }
                evals: { "suit_quality(H)": [1.5, 9] }
              - suits: { S: [4, 13] }
                evals: { "suit_quality(S)": [1.5, 9] }
          hcp: [5, 9]
          evals: { "suit_quality(D)": [1, 9], "quick_tricks_outside(D)": [0, 2] }
        shows: "preempt: 7+ decent diamonds, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_3H_nv
        call: 3H
        priority: 60
        requires:
          suits: { H: [7, 13] }
          not: { suits: { S: [4, 13] }, evals: { "suit_quality(S)": [1.5, 9] } }
          hcp: [3, 9]
          evals: { "suit_quality(H)": [0, 9], "quick_tricks_outside(H)": [0, 2] }
        shows: "preempt: 7+ hearts, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3H_vul
        call: 3H
        priority: 60
        requires:
          suits: { H: [7, 13] }
          not: { suits: { S: [4, 13] }, evals: { "suit_quality(S)": [1.5, 9] } }
          hcp: [5, 9]
          evals: { "suit_quality(H)": [1, 9], "quick_tricks_outside(H)": [0, 2] }
        shows: "preempt: 7+ decent hearts, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_3S_nv
        call: 3S
        priority: 60
        requires:
          suits: { S: [7, 13] }
          not: { suits: { H: [4, 13] }, evals: { "suit_quality(H)": [1.5, 9] } }
          hcp: [3, 9]
          evals: { "suit_quality(S)": [0, 9], "quick_tricks_outside(S)": [0, 2] }
        shows: "preempt: 7+ spades, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3S_vul
        call: 3S
        priority: 60
        requires:
          suits: { S: [7, 13] }
          not: { suits: { H: [4, 13] }, evals: { "suit_quality(H)": [1.5, 9] } }
          hcp: [5, 9]
          evals: { "suit_quality(S)": [1, 9], "quick_tricks_outside(S)": [0, 2] }
        shows: "preempt: 7+ decent spades, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }

      # Eight of them is a four-level preempt, not a three-level one: the
      # extra trump is a trick, and the hand is worthless on defence.
      - id: open_4H
        call: 4H
        priority: 61
        requires:
          suits: { H: [8, 13] }
          hcp: [3, 10]
          evals: { "quick_tricks_outside(H)": [0, 2] }
        shows: "preempt: 8+ hearts, 3-10 HCP"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2, 3] }
      - id: open_4S
        call: 4S
        priority: 61
        requires:
          suits: { S: [8, 13] }
          hcp: [3, 10]
          evals: { "quick_tricks_outside(S)": [0, 2] }
        shows: "preempt: 8+ spades, 3-10 HCP"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2, 3] }

      - id: open_pass_4th
        call: P
        priority: 22
        requires: { hcp: [0, 12], evals: { rule_of_15: [0, 14] } }
        shows: "4th seat: not worth opening (rule of 15 fails)"
        establishes: { forcing: sign_off }
        when: { opening_seat: [4] }
        negative_inference_weight: soft

      - id: open_pass
        call: P
        priority: 20
        requires: { hcp: [0, 11] }
        shows: "fewer than opening values"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  # ===========================================================================
  # 1NT OPENING STRUCTURE (Stayman, Jacoby transfers, invitational sequences)
  # ===========================================================================

  - id: resp_1NT
    description: "Responses to a 1NT opening"
    pattern: "1NT - P - ?"
    rules:
      - id: nt_stayman
        call: 2C
        priority: 85
        requires:
          hcp: [8, 40]
          any_of: [ { suits: { H: [4, 4] } }, { suits: { S: [4, 4] } } ]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "Stayman: at least one 4-card major, invitational+ values"
        establishes: { forcing: one_round }
        convention: stayman
        announce: null

      - id: nt_transfer_H
        call: 2D
        priority: 88
        requires: { suits: { H: [5, 13] } }
        shows: "Jacoby transfer to hearts (5+ hearts, any strength)"
        establishes: { forcing: one_round }
        convention: jacoby_transfer
        announce: "transfer"

      - id: nt_transfer_S
        call: 2H
        priority: 87
        requires: { suits: { S: [5, 13] }, evals: { "suit_diff(S,H)": [0, 13] } }
        shows: "Jacoby transfer to spades (5+ spades, any strength)"
        establishes: { forcing: one_round }
        convention: jacoby_transfer
        announce: "transfer"

      - id: nt_2NT_inv
        call: 2NT
        priority: 60
        requires:
          hcp: [8, 9]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "invitational, 8-9 HCP, no 4-card major"
        establishes: { forcing: invitational }

      - id: nt_3C_bail
        call: 3C
        priority: 46
        requires: { suits: { C: [6, 13] }, hcp: [0, 7] }
        shows: "weak bail: 6+ clubs, no game interest opposite 15-17"
        establishes: { forcing: sign_off, agreed_suit: C }
      - id: nt_3D_bail
        call: 3D
        priority: 46
        requires: { suits: { D: [6, 13] }, hcp: [0, 7] }
        shows: "weak bail: 6+ diamonds, no game interest opposite 15-17"
        establishes: { forcing: sign_off, agreed_suit: D }
      - id: nt_3NT
        call: 3NT
        priority: 62
        requires:
          hcp: [10, 15]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "to play, 10-15 HCP, no 4-card major"
        establishes: { forcing: sign_off }

      # the minor-slam route over 1NT (minimum viable version): a running
      # 6+ card minor is worth ~3 points more than its HCP, so 12-15 with
      # one invites exactly like a balanced 16-17
      - id: nt_4NT_quant_minor
        call: 4NT
        priority: 63
        requires:
          hcp: [12, 15]
          any_of:
            - suits: { C: [6, 13] }
              evals: { "two_of_top3(C)": [1, 1] }
            - suits: { D: [6, 13] }
              evals: { "two_of_top3(D)": [1, 1] }
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "quantitative slam invitation: 12-15 with a running 6+ card minor"
        establishes: { forcing: invitational }
      - id: nt_4NT_quant
        call: 4NT
        priority: 64
        requires:
          hcp: [16, 17]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "quantitative slam invitation, 16-17 HCP (not Blackwood)"
        establishes: { forcing: invitational }
        alertable: true

      - id: nt_6NT
        call: 6NT
        priority: 63
        requires:
          hcp: [18, 20]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "to play: 18-20 HCP balanced opposite 15-17"
        establishes: { forcing: sign_off }

      - id: nt_pass
        call: P
        priority: 25
        requires:
          hcp: [0, 7]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } }, { suits: { D: [6, 13] } } ] }
        shows: "weak hand, no 5-card major"
        establishes: { forcing: sign_off }

  - id: nt_stayman_rebid
    description: "Opener's rebid over Stayman"
    pattern: "1NT - P - 2C - P - ?"
    rules:
      - id: stayman_2H
        call: 2H
        priority: 70
        requires: { suits: { H: [4, 5] } }
        shows: "4+ hearts (may also hold 4 spades)"
        establishes: { forcing: non_forcing }
      - id: stayman_2S
        call: 2S
        priority: 60
        requires: { suits: { S: [4, 5] } }
        shows: "4+ spades, denies 4 hearts"
        establishes: { forcing: non_forcing }
      - id: stayman_2D
        call: 2D
        priority: 50
        requires:
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "no 4-card major"
        establishes: { forcing: non_forcing }

  - id: stayman_resp_after_2D
    description: "Responder's rebid after Stayman 2D denial"
    pattern: "1NT - P - 2C - P - 2D - P - ?"
    rules:
      - id: stm_2D_2NT
        call: 2NT
        priority: 60
        requires: { hcp: [8, 9] }
        shows: "invitational, 8-9 HCP (had a 4-card major)"
        establishes: { forcing: invitational }
      # same arithmetic as stm_6NT_nofit, opposite the 2D denial
      - id: stm_2D_6NT
        call: 6NT
        priority: 64
        requires: { hcp: [18, 21], evals: { controls: [4, 12] } }
        shows: "18+ opposite a 15-17 notrump: 33+ combined, bidding the slam"
        establishes: { forcing: sign_off }
      - id: stm_2D_3NT
        call: 3NT
        priority: 62
        requires: { hcp: [10, 17] }
        shows: "to play, game values (had a 4-card major)"
        establishes: { forcing: sign_off }

  - id: stayman_resp_after_2M
    description: "Responder's rebid after Stayman finds/misses a fit"
    expand: { M: [H, S] }
    pattern: "1NT - P - 2C - P - 2$M - P - ?"
    rules:
      # Two repairs, both WIDENINGS.  (1) CEILING: with the 4-4 fit the ladder
      # ran 8-9 / 10-15 / 15-17 and stopped, so 18+ opposite a 15-17 notrump -
      # 33+ combined with a known eight-card fit - had no rule and passed 2H.
      # The no-fit half of this same context was given its 18-21 rung a round
      # ago; this half was never swept.  (2) Every other keycard ask in the file
      # carries the round-6 waiver: a hand holding three keycards itself gets an
      # unambiguous answer and may ask with a worthless doubleton.
      - id: stm_rkc_4NT
        call: 4NT
        priority: 73
        requires:
          suits: { $M: [4, 4] }
          hcp: [15, 21]
          evals: { controls: [4, 12] }
          any_of:
            - evals: { "void(any)": [0, 0], worthless_doubleton: [0, 0] }
            - evals: { "keycards($M)": [3, 5] }
        shows: "RKC 1430 for $M: slam values with the 4-4 fit found by Stayman"
        establishes: { forcing: one_round, agreed_suit: $M, asking: keycards }
        alertable: true
        convention: rkc_1430
      - id: stm_raise_3$M
        call: 3$M
        priority: 70
        requires: { suits: { $M: [4, 4] }, hcp: [8, 9] }
        shows: "invitational raise with a 4-card fit"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: stm_raise_4$M
        call: 4$M
        priority: 72
        requires: { suits: { $M: [4, 4] }, hcp: [10, 15] }
        shows: "game raise with a 4-card fit"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: stm_2NT_nofit
        call: 2NT
        priority: 55
        requires: { hcp: [8, 9], suits: { $M: [0, 3] } }
        shows: "invitational, no fit for the major"
        establishes: { forcing: invitational }
      # Opposite a 15-17 notrump the arithmetic is exact: 16-17 is 31-34 and
      # belongs in 3NT, 18+ is 33+ and belongs in slam.  The ladder stopped at
      # 15, so an 18-count with no major fit PASSED opener's 2S with 6NT cold.
      - id: stm_6NT_nofit
        call: 6NT
        priority: 59
        requires: { hcp: [18, 21], suits: { $M: [0, 3] }, evals: { controls: [4, 12] } }
        shows: "18+ opposite a 15-17 notrump: 33+ combined, bidding the slam"
        establishes: { forcing: sign_off }
      - id: stm_3NT_nofit
        call: 3NT
        priority: 57
        requires: { hcp: [10, 17], suits: { $M: [0, 3] } }
        shows: "to play, no fit for the major (opener may correct with the other major)"
        establishes: { forcing: sign_off }

  # Opener's answers to the invitational 2NT after Stayman: 15 declines,
  # 16-17 accepts.  Before these existed the generic 13-19 3NT accepted the
  # invite on any opener, so every 15-opposite-8 played a hopeless game.
  # Over the 2H reply the auction carries an extra inference: responder's
  # Stayman promised a four-card major and 2NT denied four hearts, so
  # responder holds exactly four SPADES and opener's four-card spade suit
  # is a known 4-4 fit worth showing on the way.
  - id: stayman_invite_accept_2D
    description: "Opener over 2NT after 1NT - 2C - 2D"
    pattern: "1NT - P - 2C - P - 2D - P - 2NT - P - ?"
    rules:
      - id: stmi_2D_pass
        call: P
        priority: 60
        requires: { hcp: [15, 15] }
        shows: "declining the invite: minimum 1NT opener"
        establishes: { forcing: sign_off }
      - id: stmi_2D_3NT
        call: 3NT
        priority: 58
        requires: { hcp: [16, 17] }
        shows: "accepting the invite: 16-17"
        establishes: { forcing: sign_off }

  - id: stayman_invite_accept_2H
    description: "Opener over 2NT after 1NT - 2C - 2H (responder marked with 4 spades)"
    pattern: "1NT - P - 2C - P - 2H - P - 2NT - P - ?"
    rules:
      - id: stmi_2H_3S
        call: 3S
        priority: 62
        requires: { suits: { S: [4, 4] }, hcp: [15, 15] }
        shows: "4 spades, minimum: offering the known 4-4 fit below game"
        establishes: { forcing: invitational, agreed_suit: S }
      - id: stmi_2H_4S
        call: 4S
        priority: 61
        requires: { suits: { S: [4, 4] }, hcp: [16, 17] }
        shows: "4 spades, maximum: game in the known 4-4 fit"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: stmi_2H_pass
        call: P
        priority: 60
        requires: { hcp: [15, 15], suits: { S: [0, 3] } }
        shows: "declining the invite: minimum 1NT opener"
        establishes: { forcing: sign_off }
      - id: stmi_2H_3NT
        call: 3NT
        priority: 58
        requires: { hcp: [16, 17], suits: { S: [0, 3] } }
        shows: "accepting the invite: 16-17"
        establishes: { forcing: sign_off }

  - id: stayman_invite_accept_2S
    description: "Opener over 2NT after 1NT - 2C - 2S (no second fit possible)"
    pattern: "1NT - P - 2C - P - 2S - P - 2NT - P - ?"
    rules:
      - id: stmi_2S_pass
        call: P
        priority: 60
        requires: { hcp: [15, 15] }
        shows: "declining the invite: minimum 1NT opener"
        establishes: { forcing: sign_off }
      - id: stmi_2S_3NT
        call: 3NT
        priority: 58
        requires: { hcp: [16, 17] }
        shows: "accepting the invite: 16-17"
        establishes: { forcing: sign_off }

  # They doubled the transfer (lead-directing): opener completes with 3+
  # cards in responder's REAL suit, passes with exactly 2 (responder can
  # redouble a retransfer or bid on), and the transfer bidder completes
  # himself if the doubled artificial call comes back around - the pair
  # must never play 2-of-the-transfer-suit doubled in a 6-1.
  # The 2C opening under interference had NO contexts at all: a 22-count
  # passed out their overcall at the two level, and passed its own doubled
  # 2C.  Minimal honest structure below.
  - id: strong_2C_doubled
    description: "Responder after 2C - (X)"
    pattern: "2C - X - ?"
    rules:
      - id: c2x_pass
        call: P
        priority: 55
        requires: { hcp: [0, 7] }
        shows: "waiting over their double (the 2C force stands)"
        establishes: { forcing: non_forcing }
      - id: c2x_2D
        call: 2D
        priority: 56
        requires: { hcp: [0, 40] }
        shows: "waiting, as without the double"
        establishes: { forcing: game_forcing }
      - id: c2x_XX
        call: XX
        priority: 57
        requires: { hcp: [8, 40] }
        shows: "redouble: a positive opposite the strong 2C"
        establishes: { forcing: game_forcing }

  - id: strong_2C_doubled_reopen
    description: "The doubled 2C came back to opener"
    pattern: "2C - X - P - P - ?"
    rules:
      - id: c2xpp_cheapest
        call: 2D
        priority: 55
        requires: {}
        shows: "the strong hand bids on over their double (cheapest, waiting-ish)"
        establishes: { forcing: game_forcing }
      - id: c2xpp_suit_H
        call: 2H
        priority: 58
        requires: { suits: { H: [5, 13] } }
        shows: "natural: the strong hand's suit"
        establishes: { forcing: game_forcing }
      - id: c2xpp_suit_S
        call: 2S
        priority: 57
        requires: { suits: { S: [5, 13] } }
        shows: "natural: the strong hand's suit"
        establishes: { forcing: game_forcing }

  - id: strong_2C_overcalled
    description: "Responder after 2C - (their bid)"
    pattern: "2C - bid - ?"
    rules:
      - id: c2b_pass
        call: P
        priority: 55
        requires: { hcp: [0, 7] }
        shows: "double negative over their interference"
        establishes: { forcing: non_forcing }
      - id: c2b_X
        call: X
        priority: 57
        requires: { hcp: [8, 40] }
        shows: "values opposite the strong 2C (their bid dies doubled or we play)"
        establishes: { forcing: one_round }
      - id: c2b_suit_H
        call: 3H
        priority: 56
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires: { suits: { H: [5, 13] }, hcp: [8, 40] }
        shows: "natural positive over their interference"
        establishes: { forcing: game_forcing }
      - id: c2b_suit_S
        call: 3S
        priority: 56
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires: { suits: { S: [5, 13] }, hcp: [8, 40] }
        shows: "natural positive over their interference"
        establishes: { forcing: game_forcing }

  - id: strong_2C_reopen
    description: "Opener MUST act when their overcall of 2C is passed around"
    pattern: "2C - bid - P - P - ?"
    rules:
      - id: c2r_X
        call: X
        priority: 58
        requires: { evals: { max_their_suit_length: [0, 2] } }
        shows: "takeout-flavored double: the strong hand bids on"
        establishes: { forcing: one_round }
      - id: c2r_3NT
        call: 3NT
        priority: 57
        requires: { hcp: [20, 40], evals: { weakest_their_stopper: [0.9, 9] } }
        shows: "natural: 20+ with their suit stopped"
        establishes: { forcing: non_forcing }
      - id: c2r_suit_H
        call: 3H
        priority: 56
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires: { suits: { H: [5, 13] } }
        shows: "natural, forcing: the strong hand's suit"
        establishes: { forcing: one_round }
      - id: c2r_suit_S
        call: 3S
        priority: 56
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires: { suits: { S: [5, 13] } }
        shows: "natural, forcing: the strong hand's suit"
        establishes: { forcing: one_round }
      - id: c2r_suit_D
        call: 3D
        priority: 55
        when: { unbid_suit: D, cheapest_in_suit: true }
        requires: { suits: { D: [5, 13] } }
        shows: "natural, forcing: the strong hand's suit"
        establishes: { forcing: one_round }
      - id: c2r_suit_C
        call: 3C
        priority: 54
        when: { unbid_suit: C, cheapest_in_suit: true }
        requires: { suits: { C: [5, 13] } }
        shows: "natural, forcing: the strong hand's suit"
        establishes: { forcing: one_round }
      - id: c2r_floor_X
        call: X
        priority: 40
        requires: {}
        shows: "the strong hand never sells out at the two level (undiscussed shape)"
        establishes: { forcing: one_round }

  - id: transfer_doubled
    description: "Opener after their double of the Jacoby transfer"
    expand_pairs:
      - { T: D, M: H }
      - { T: H, M: S }
    pattern: "1NT - P - 2$T - X - ?"
    rules:
      - id: trx_accept_$T
        call: 2$M
        priority: 60
        requires: { suits: { $M: [3, 13] } }
        shows: "completing the doubled transfer: 3+ $M"
        establishes: { forcing: non_forcing }
      - id: trx_XX_$T
        call: XX
        priority: 58
        requires: { suits: { $T: [5, 13], $M: [0, 2] } }
        shows: "redouble: real $T behind the lead-director, happy to play here"
        establishes: { forcing: non_forcing }
      - id: trx_pass_$T
        call: P
        priority: 55
        requires: { suits: { $M: [0, 2] } }
        shows: "exactly two $M: responder decides"
        establishes: { forcing: non_forcing }

  - id: stayman_doubled_pull
    description: "Our Stayman 2C was doubled and passed round: escape"
    pattern: "1NT - P - 2C - X - P - P - ?"
    rules:
      # opener's pass over the double denied a four-card major, so this is
      # a landing-spot problem: play in a real suit, or sit 2C doubled with
      # actual clubs.  (Before this existed the engine had ZERO candidates
      # here once the fallback pass was withheld.)
      - id: stmxpp_pass
        call: P
        priority: 60
        requires: { suits: { C: [5, 13] } }
        shows: "real clubs: 2C doubled is a playable spot"
        establishes: { forcing: sign_off }
      - id: stmxpp_2S
        call: 2S
        priority: 58
        requires: { suits: { S: [5, 13] } }
        shows: "escaping to my long major"
        establishes: { forcing: sign_off }
      - id: stmxpp_2H
        call: 2H
        priority: 57
        requires: { suits: { H: [5, 13] } }
        shows: "escaping to my long major"
        establishes: { forcing: sign_off }
      - id: stmxpp_2D
        call: 2D
        priority: 55
        requires: {}
        shows: "escaping the doubled Stayman: diamonds is the landing spot"
        establishes: { forcing: sign_off }

  - id: transfer_doubled_pull
    description: "The doubled transfer came back to responder: complete it"
    expand_pairs:
      - { T: D, M: H }
      - { T: H, M: S }
    pattern: "1NT - P - 2$T - X - P - P - ?"
    rules:
      - id: trxpp_complete_$T
        call: 2$M
        priority: 60
        requires: {}
        shows: "completing my own doubled transfer: the real suit is $M"
        establishes: { forcing: non_forcing }

  - id: nt_transfer_accept_H
    description: "Opener completes the hearts transfer"
    pattern: "1NT - P - 2D - P - ?"
    rules:
      - id: tr_super_3H
        call: 3H
        priority: 60
        requires: { suits: { H: [4, 5] }, hcp: [17, 17] }
        shows: "super-accept: 4 hearts, maximum"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: tr_accept_2H
        call: 2H
        priority: 55
        requires: {}
        shows: "completing the transfer (forced)"
        establishes: { forcing: non_forcing }

  - id: nt_transfer_accept_S
    description: "Opener completes the spades transfer"
    pattern: "1NT - P - 2H - P - ?"
    rules:
      - id: tr_super_3S
        call: 3S
        priority: 60
        requires: { suits: { S: [4, 5] }, hcp: [17, 17] }
        shows: "super-accept: 4 spades, maximum"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: tr_accept_2S
        call: 2S
        priority: 55
        requires: {}
        shows: "completing the transfer (forced)"
        establishes: { forcing: non_forcing }

  - id: nt_after_transfer
    description: "Responder's rebid after a completed transfer"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "1NT - P - 2$T - P - 2$M - P - ?"
    rules:
      - id: tr_pass_weak
        call: P
        priority: 55
        requires: { hcp: [0, 7], suits: { $M: [5, 13] } }
        shows: "weak with 5+ $M: sign-off"
        establishes: { forcing: sign_off }
      - id: tr_2NT_inv
        call: 2NT
        priority: 56
        requires: { hcp: [8, 9], suits: { $M: [5, 5] } }
        shows: "invitational, exactly 5 $M (opener passes/corrects)"
        establishes: { forcing: invitational }
      - id: tr_3M_inv
        call: 3$M
        priority: 57
        requires: { hcp: [8, 9], suits: { $M: [6, 13] } }
        shows: "invitational with 6+ $M"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: tr_3NT_choice
        call: 3NT
        priority: 58
        requires: { hcp: [10, 15], suits: { $M: [5, 5] } }
        shows: "game values, exactly 5 $M: choice of games (opener corrects to 4$M with 3+)"
        establishes: { forcing: sign_off }
      - id: tr_4$M
        call: 4$M
        priority: 59
        requires: { hcp: [10, 15], suits: { $M: [6, 13] } }
        shows: "game with 6+ $M"
        establishes: { forcing: sign_off, agreed_suit: $M }

  - id: nt_transfer_3NT_choice
    description: "Opener's correction over the choice-of-games 3NT"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "1NT - P - 2$T - P - 2$M - P - 3NT - P - ?"
    rules:
      - id: choice_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [3, 5] } }
        shows: "3+ card fit: playing game in the major"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: choice_pass
        call: P
        priority: 55
        requires: { suits: { $M: [0, 2] } }
        shows: "doubleton in responder's major: 3NT stands"
        establishes: { forcing: sign_off }

  # The 1NT analogue above was authored and its 2NT twin was not: after
  # 2NT - 3T - 3M - 3NT opener had NO CONTEXT AT ALL, so a hand with three-card
  # support and an eight-card fit passed 3NT through the code fallback.
  - id: nt2_transfer_3NT_choice
    description: "Opener's correction over the choice-of-games 3NT after a 2NT opening"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "2NT - P - 3$T - P - 3$M - P - 3NT - P - ?"
    rules:
      - id: nt2_choice_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [3, 5] } }
        shows: "3+ card fit: playing game in the major"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: nt2_choice_pass
