  - id: general_uncontested_continuation
    description: "General constructive agreements in an uncontested auction"
    pattern: "... - P - ?"
    when: { we_hold_contract: false }
    rules:
      - id: uc_raise_C2
        call: 2C
        priority: 30
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [6, 9], "lott_total_trumps(C)": [7, 26] }
        shows: "raise of partner's C: 3+ trumps, 6-9 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: uc_raise_C3
        call: 3C
        priority: 31
