          not: { any_of: [ { suits: { S: [4, 13] } }, { suits: { H: [3, 13] }, evals: { total_points: [6, 9] } } ] }
        shows: "1NT response: 6-11 HCP, denies 4 spades and a simple raise (semi-forcing)"
        establishes: { forcing: non_forcing }
        announce: "semi-forcing"
        when: { config: { forcing_nt: semi } }
      - id: r1H_1NT_full
        call: 1NT
        priority: 40
        requires:
          hcp: [6, 11]
          not: { any_of: [ { suits: { S: [4, 13] } }, { suits: { H: [3, 13] }, evals: { total_points: [6, 9] } } ] }
        shows: "forcing 1NT: 6-11 HCP, denies 4 spades"
        establishes: { forcing: one_round }
        alertable: true
        when: { config: { forcing_nt: full } }
      - id: r1H_pass
        call: P
        priority: 15
        requires: { hcp: [0, 5] }
        shows: "0-5 HCP: too weak to respond"
        establishes: { forcing: sign_off }

