  - id: defense_vs_preempt_C
    description: "Direct seat over their 3C preempt"
    pattern: "3C - ?"
    rules:
      - id: v3_C_X
        call: X
        priority: 70
        requires:
          evals: { longest_suit_length: [0, 5] }
          any_of:
            - hcp: [14, 17]
              suits: { C: [0, 3] }
            - hcp: [18, 40]
        shows: "takeout double of the 3-level preempt"
        establishes: { forcing: one_round }
      - id: v3_C_3NT
        call: 3NT
        priority: 66
        requires: { hcp: [16, 21], features: [ "stopper(C)" ], evals: { semi_balanced: [1, 1] } }
        shows: "to play: 16-21 with a stopper"
        establishes: { forcing: sign_off }
      - id: v3_C_D
        call: 3D
        priority: 64
        requires: { suits: { D: [6, 13] }, hcp: [13, 40], features: [ "good_suit(D)" ] }
        shows: "overcalling the preempt: good 6+ D, 13+"
        establishes: { forcing: non_forcing }
      - id: v3_C_H
        call: 3H
        priority: 64
        requires: { suits: { H: [6, 13] }, hcp: [13, 40], features: [ "good_suit(H)" ] }
        shows: "overcalling the preempt: good 6+ H, 13+"
        establishes: { forcing: non_forcing }
      - id: v3_C_S
