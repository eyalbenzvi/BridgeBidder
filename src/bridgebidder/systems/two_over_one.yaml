  - id: responder_rebid_after_1C_1D_1M
    description: "Responder's rebid after 1C - 1D - 1M (the Walsh diamond hand)"
    expand: { M: [H, S] }
    pattern: "1C - P - 1D - P - 1$M - P - ?"
    rules:
      - id: r1c1d_2D_$M
        call: 2D
        priority: 56
        requires: { suits: { D: [5, 13] }, hcp: [6, 10] }
