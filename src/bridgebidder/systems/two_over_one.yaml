        priority: 18
        requires: {}
        shows: "leaving the redoubled contract where it is"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  # ===========================================================================
  # ROUND-6 GAPS: continuations after a 2NT-opening transfer, and opener's
  # action over responder's competitive invitational 2NT
  # ===========================================================================

  - id: nt2_after_transfer
    description: "Responder's rebid after the completed 2NT transfer"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "2NT - P - 3$T - P - 3$M - P - ?"
    rules:
      # with exactly five trumps and a balanced hand the textbook call is
      # 3NT (choice of games) - the old any-5-suit 4M played 5-2 fits
      - id: nt2_tr_4$M
        call: 4$M
        priority: 60
        requires:
          hcp: [3, 40]
          any_of:
            - suits: { $M: [6, 13] }
            - suits: { $M: [5, 13] }
              evals: { singleton_or_void: [1, 2] }
        shows: "game in $M opposite 20-21 (6+ trumps, or 5 with shortness)"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: nt2_tr_3NT
        call: 3NT
        priority: 56
        requires: { suits: { $M: [5, 5] }, hcp: [4, 40], evals: { semi_balanced: [1, 1] } }
        shows: "choice of games with exactly 5 $M opposite 20-21"
        establishes: { forcing: sign_off }
      # 15 opposite a shown 20-21 is 35-36 combined: the invite is not the bid,
      # the slam is.  Added as a RUNG ABOVE the invite rather than as a cap on
      # it, so no strength band is left without a rule.
      - id: nt2_tr_6NT
        call: 6NT
        priority: 59
        requires: { hcp: [15, 40], evals: { semi_balanced: [1, 1] } }
        shows: "33+ combined opposite 20-21: bidding the slam"
        establishes: { forcing: sign_off }
      - id: nt2_tr_slam
        call: 4NT
        priority: 58
        requires: { hcp: [11, 40], evals: { semi_balanced: [1, 1] } }
        shows: "quantitative slam invitation opposite 20-21"
        establishes: { forcing: invitational }
        alertable: true
      - id: nt2_tr_pass
        call: P
        priority: 45
        requires: { hcp: [0, 2] }
        shows: "bust: 3$M is high enough opposite 20-21"
        establishes: { forcing: sign_off }

  - id: opener_over_competitive_2NT
    description: "Opener's action over responder's invitational 2NT in competition"
    expand: { M: [H, S] }
    pattern: "1$M - act - 2NT - P - ?"
    rules:
      - id: oc2nt_4$M
        call: 4$M
        priority: 62
        requires:
          suits: { $M: [6, 13] }
          evals: { total_points: [15, 40] }
        shows: "6+ $M with extras: bidding game opposite the invitation"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: oc2nt_3$M
        call: 3$M
        priority: 58
        requires:
          suits: { $M: [6, 13] }
          evals: { total_points: [12, 14] }
        shows: "6+ $M, minimum: correcting to our suit"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      # five-card rungs: opener's 2NT ladder demanded six, so a 5-card
      # major with a fit had no rebid and the auction died in notrump
      - id: oc2nt_five4_$M
        call: 4$M
        priority: 61
        requires:
          suits: { $M: [5, 13] }
          evals: { total_points: [15, 40] }
        shows: "5+ $M with extras: bidding game opposite the invitation"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: oc2nt_five3_$M
        call: 3$M
        priority: 57
        requires:
          suits: { $M: [5, 13] }
          evals: { total_points: [10, 14] }
        shows: "5+ $M, minimum: correcting to our suit"
        establishes: { forcing: non_forcing, agreed_suit: $M }

  - id: opener_choice_after_2NT_jump_3M
    description: "Opener chooses the game after responder shows 5 cards over the 2NT jump"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2NT - P - 3$M - P - ?"
    rules:
      - id: o2ntj_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [3, 13] } }
        shows: "3-card support: playing game in the 5-3 major fit"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: o2ntj_3NT
        call: 3NT
        priority: 55
        requires: { suits: { $M: [0, 2] } }
        shows: "no 3-card support: 3NT it is"
        establishes: { forcing: sign_off }

  # ===========================================================================
  # REGRET-ROUND GAP: opener's rebid after 1C - 1D (the general 2NT rule was
  # filling this in, describing opener as 11-12 when opener holds 12+)
  # ===========================================================================

  - id: opener_rebid_1C_1D
    description: "Opener's rebid after 1C - P - 1D"
    pattern: "1C - P - 1D - P - ?"
    rules:
      - id: ob1C1D_1H
        call: 1H
        priority: 62
        # A ONE-LEVEL rebid in a new suit is not limited to 17: it is the
        # cheapest way to show the second suit and opener bids again.  The
        # 17 cap left 18-19 WITH A FOUR-CARD MAJOR with no rule at all (the
        # 18-19 balanced 2NT rebid explicitly denies one), so an 18-count
        # holding 4-4 in the majors bid a generic 3NT over the 1D response.
        requires: { suits: { H: [4, 13] }, hcp: [12, 19] }
        shows: "4+ hearts, 12-19"
        establishes: { forcing: one_round }
      - id: ob1C1D_1S
        call: 1S
        priority: 61
        # A ONE-LEVEL rebid in a new suit is not limited to 17: it is the
        # cheapest way to show the second suit and opener bids again.  The
        # 17 cap left 18-19 WITH A FOUR-CARD MAJOR with no rule at all (the
        # 18-19 balanced 2NT rebid explicitly denies one), so an 18-count
        # holding 4-4 in the majors bid a generic 3NT over the 1D response.
        requires: { suits: { S: [4, 13] }, hcp: [12, 19], not: { suits: { H: [4, 13] } } }
        shows: "4+ spades, 12-19, denies 4 hearts"
        establishes: { forcing: one_round }
      - id: ob1C1D_1NT
        call: 1NT
        priority: 58
        requires:
          hcp: [12, 14]
          balanced: true
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "12-14 balanced"
        establishes: { forcing: non_forcing }
      - id: ob1C1D_2NT
        call: 2NT
        priority: 59
        requires:
          hcp: [18, 19]
          balanced: true
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "jump: 18-19 balanced"
        establishes: { forcing: non_forcing }
      - id: ob1C1D_2D
        call: 2D
        priority: 57
        requires: { suits: { D: [4, 13] }, evals: { total_points: [12, 15] } }
        shows: "raise: 4+ diamonds, minimum"
        establishes: { forcing: non_forcing, agreed_suit: D }
      - id: ob1C1D_3D
        call: 3D
        priority: 56
        requires: { suits: { D: [4, 13] }, evals: { total_points: [16, 18] } }
        shows: "jump raise: 4+ diamonds, invitational"
        establishes: { forcing: invitational, agreed_suit: D }
      - id: ob1C1D_2C
        call: 2C
        priority: 54
        requires: { suits: { C: [6, 13] }, hcp: [12, 15] }
        shows: "rebid: 6+ clubs, minimum"
        establishes: { forcing: non_forcing }
      - id: ob1C1D_3C
        call: 3C
        priority: 53
        requires: { suits: { C: [6, 13] }, hcp: [16, 18] }
        shows: "jump rebid: 6+ good clubs, 16-18"
        establishes: { forcing: invitational }
