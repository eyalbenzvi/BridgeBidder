  # ===========================================================================
  # UNCONTESTED CONTINUATIONS harvested as gaps (round 2)
  # ===========================================================================

  - id: responder_after_jump_raise
    description: "Responder over opener's invitational jump raise 1x - 1M - 3M"
    # 1H - 1S - 3S was missing: with spades agreed the generic toolkit's
    # uc_raise_H4 (same priority as uc_raise_S4, cheaper call wins the tie)
    # corrected partner's raise of MY suit back to HIS.
    expand_pairs:
      - { m: C, M: H }
      - { m: C, M: S }
      - { m: D, M: H }
      - { m: D, M: S }
      - { m: H, M: S }
    pattern: "1$m - P - 1$M - P - 3$M - P - ?"
    rules:
      - id: rjr_game
        call: 4$M
        priority: 45
        requires: { evals: { total_points: [8, 40] } }
        shows: "accepting the invitation (opener showed 16-18)"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: rjr_pass
        call: P
        priority: 50
        requires: { evals: { total_points: [0, 7] } }
        shows: "declining the invitation"
        establishes: { forcing: sign_off }

  - id: responder_after_2NT_jump
    description: "Responder over opener's 18-19 2NT jump rebid"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2NT - P - ?"
    rules:
      - id: r2ntj_3$M
        call: 3$M
        priority: 57
        requires: { hcp: [6, 13], suits: { $M: [5, 5] } }
        shows: "5 $M opposite 18-19: offering the major before 3NT"
        establishes: { forcing: one_round }
      - id: r2ntj_3NT
        call: 3NT
        priority: 55
        requires: { hcp: [6, 12], not: { suits: { $M: [5, 13] } } }
        shows: "game opposite 18-19, no 5-card major"
        establishes: { forcing: sign_off }
      # opposite a shown 18-19 the arithmetic is known exactly: 15+ makes 33
      # combined (slam), 13-14 makes 31-32 (invite it, opener accepts on 19).
      # The old cap of 13 left every strong responder with no rule at all -
      # 3NT was bid on 35 combined while BEN bid the making 6NT.
      - id: r2ntj_4NT_quant
        call: 4NT
        # 56.5, not 56: it tied with the 4$M game jump, and on a tie the lower
        # call wins, so the invitation could never be reached by a hand that
        # also fitted the game bid - which is every six-card-major hand the new
        # branch below exists for.
        priority: 56.5
        requires:
          any_of:
            - hcp: [13, 14]
              evals: { semi_balanced: [1, 1] }
            # Banded by strength and never by SHAPE: the two rungs above the
            # game jump are notrump ones gated on semi_balanced/controls, so a
            # SIX-card major opposite a shown 18-19 - 31+ combined by the same
            # arithmetic those rungs use - had only the fast-arrival 4$M and
            # signed off by construction.  Added as a BRANCH of the existing
            # quantitative raise rather than as a second rule defining 4NT: a
            # separate rung outranks this one and would steal the primary
            # reading, explaining a 4-3-3-3 fourteen-count's 4NT as "six
            # spades".  The answering context already exists.
            - suits: { $M: [6, 13] }
              evals: { rule_of_26_sharp: [31, 99] }
        shows: "quantitative: 31+ combined (balanced, or with a six-card $M), opener bids slam with 19"
        establishes: { forcing: non_forcing }
        alertable: true
      - id: r2ntj_6NT
        call: 6NT
        priority: 57
        requires: { hcp: [15, 40], evals: { controls: [5, 12] } }
        shows: "33+ combined and the controls to match: bidding the slam"
        establishes: { forcing: sign_off }
      - id: r2ntj_4M
        call: 4$M
        priority: 56
        requires: { hcp: [6, 13], suits: { $M: [6, 13] } }
        shows: "game with a 6+ card suit opposite 18-19"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: r2ntj_pass
        call: P
        priority: 40
        requires: { hcp: [0, 5] }
        shows: "bust: even 18-19 opposite may not make 3NT"
        establishes: { forcing: sign_off }

  - id: opener_accepts_quant_over_2NT_jump
    description: "Opener over responder's quantitative 4NT (after the 18-19 2NT jump)"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2NT - P - 4NT - P - ?"
    rules:
      - id: q2ntj_6NT
        call: 6NT
