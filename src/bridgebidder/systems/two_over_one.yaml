        requires: { hcp: [15, 40] }
        shows: "penalty double of 1NT: 15+"
        establishes: { forcing: non_forcing }
      - id: v1NT_2C
        call: 2C
        priority: 60
        requires: { suits: { C: [6, 13] }, hcp: [8, 15], features: [ "good_suit(C)" ] }
        shows: "natural: 6+ clubs, 8-15"
