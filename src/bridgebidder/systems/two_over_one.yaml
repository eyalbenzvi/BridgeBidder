        priority: 76
        requires: { hcp: [12, 40], suits: { D: [4, 13] }, evals: { "suit_diff(D,C)": [1, 13] }, not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] } }
        shows: "2/1 game forcing: 4+ diamonds, 12+ HCP"
        establishes: { forcing: game_forcing }
        when: { passed_hand: false }
      - id: r1H_1S
        call: 1S
        priority: 72
        requires: { hcp: [6, 40], suits: { S: [4, 13] }, not: { suits: { H: [3, 13] }, hcp: [5, 9] } }
        shows: "4+ spades, 6+ HCP, forcing one round"
        establishes: { forcing: one_round }
      - id: r1H_raise_passed
        call: 2H
        priority: 63
        when: { passed_hand: true }
        requires: { suits: { H: [3, 13] }, evals: { total_points: [10, 11] } }
        shows: "passed-hand raise: 10-11 kept LOW opposite a possibly light 3rd/4th-seat opening"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: r1H_limit_raise
        call: 3H
        priority: 62
        requires: { suits: { H: [3, 13] }, evals: { total_points: [10, 13] }, hcp: [8, 11] }
        shows: "limit raise: 3+ hearts, 10-13 support points (a shapely 4-trump hand may hold 13)"
        establishes: { forcing: invitational, agreed_suit: H }
      - id: r1H_single_raise
        call: 2H
        priority: 60
        requires: { suits: { H: [3, 13] }, evals: { total_points: [6, 9] } }
        shows: "single raise: 3+ hearts, 6-9 support points"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: r1H_game_raise_preempt
        call: 4H
        priority: 63
        requires:
          suits: { H: [5, 13] }
          hcp: [2, 9]
          features: [ "singleton_or_void(any)" ]
