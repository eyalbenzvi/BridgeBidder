  # ===========================================================================
  # DIRECT-SEAT COMPETITIVE: overcalls & takeout doubles of their 1-level opening
  # (one context per opening suit so jump vs simple overcalls stay distinct)
  # ===========================================================================

  - id: overcalls_of_1C
    description: "Overcalls of their 1C opening"
    pattern: "1C - ?"
    rules:
      - id: oc1C_1NT
        call: 1NT
        priority: 82
        requires: { hcp: [15, 18], balanced: true, features: [ "stopper(C)" ] }
        shows: "1NT overcall: 15-18 balanced with a club stopper"
        establishes: { forcing: non_forcing }
      - id: oc1C_X
        call: X
        priority: 72
        requires:
          # A takeout double asks partner to pick a suit, so it must not be
          # hiding a five-card major of its own: partner will name the other
          # one.  With five, overcall it; the strong branch draws the line at
          # six, where the suit is worth showing on its own.
          any_of:
            - hcp: [11, 16]
              suits: { C: [0, 2], S: [3, 4], H: [3, 4], D: [3, 13] }
            - hcp: [17, 40]
              suits: { S: [0, 5], H: [0, 5] }
              # a chunky five-card major is the bid, not the double
              not: { any_of: [ { suits: { S: [5, 13] }, evals: { "two_of_top3(S)": [1, 1] } },
                               { suits: { H: [5, 13] }, evals: { "two_of_top3(H)": [1, 1] } } ] }
        shows: "takeout double: opening values, short clubs, support for the other suits, no five-card major (or any 17+)"
        establishes: { forcing: one_round }
      - id: oc1C_1D
        call: 1D
        priority: 70
        requires: { suits: { D: [5, 13] }, hcp: [8, 16], evals: { suit_quality(D): [1, 9] } }
        shows: "overcall: 5+ diamonds, 8-16"
        establishes: { forcing: non_forcing }
      - id: oc1C_1H
        call: 1H
        priority: 71
        requires: { suits: { H: [5, 13] }, hcp: [8, 16], evals: { suit_quality(H): [1, 9] } }
        shows: "overcall: 5+ hearts, 8-16"
        establishes: { forcing: non_forcing }
      - id: oc1C_1S
        call: 1S
        priority: 71
        requires: { suits: { S: [5, 13] }, hcp: [8, 16], evals: { suit_quality(S): [1, 9] } }
        shows: "overcall: 5+ spades, 8-16"
        establishes: { forcing: non_forcing }
      - id: oc1C_2D_jump
        call: 2D
        priority: 60
        requires: { suits: { D: [6, 7] }, hcp: [5, 10], features: [ "good_suit(D)" ] }
        shows: "weak jump overcall: 6 diamonds, 5-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_2H_jump
        call: 2H
        priority: 60
        requires: { suits: { H: [6, 7] }, hcp: [5, 10], features: [ "good_suit(H)" ] }
        shows: "weak jump overcall: 6 hearts, 5-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_2S_jump
        call: 2S
        priority: 60
        requires: { suits: { S: [6, 7] }, hcp: [5, 10], features: [ "good_suit(S)" ] }
        shows: "weak jump overcall: 6 spades, 5-10"
        establishes: { forcing: non_forcing }
      # CEILING: the weak jump overcall above is capped at SEVEN cards
      # (`suits: [6, 7]`) and was the top of the ladder, so an eight- or
      # nine-card suit had no overcall at all and passed - one hand held
      # KT9876542 of hearts over 1C and passed it out, where BEN bids 4H at
      # confidence 0.91.  These mirror the OPENING preempts' own gates: 7+ to
      # the three level, 8+ to four, 3-10 HCP, at most two quick tricks
      # outside the suit.
      - id: oc1C_3D_preempt
        call: 3D
        priority: 58
        when: { unbid_suit: D }
        requires:
          suits: { D: [7, 13] }
          hcp: [3, 10]
          evals: { "suit_quality(D)": [1.5, 9], "quick_tricks_outside(D)": [0, 2] }
        shows: "preemptive overcall: seven-card d suit, 3-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_3H_preempt
        call: 3H
        priority: 58
        when: { unbid_suit: H }
        requires:
          suits: { H: [7, 13] }
          hcp: [3, 10]
          evals: { "suit_quality(H)": [1.5, 9], "quick_tricks_outside(H)": [0, 2] }
        shows: "preemptive overcall: seven-card h suit, 3-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_4H_preempt
        call: 4H
        # above the three-level rung: an EIGHT-card suit belongs at the
        # four level, and both rungs fit it
        priority: 59
        when: { unbid_suit: H }
        requires:
          suits: { H: [8, 13] }
          hcp: [3, 10]
          evals: { "quick_tricks_outside(H)": [0, 2] }
        shows: "preemptive overcall: eight-card h suit, 3-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_3S_preempt
        call: 3S
        priority: 58
        when: { unbid_suit: S }
        requires:
          suits: { S: [7, 13] }
          hcp: [3, 10]
          evals: { "suit_quality(S)": [1.5, 9], "quick_tricks_outside(S)": [0, 2] }
        shows: "preemptive overcall: seven-card s suit, 3-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_4S_preempt
        call: 4S
        # above the three-level rung: an EIGHT-card suit belongs at the
        # four level, and both rungs fit it
        priority: 59
        when: { unbid_suit: S }
        requires:
          suits: { S: [8, 13] }
          hcp: [3, 10]
          evals: { "quick_tricks_outside(S)": [0, 2] }
        shows: "preemptive overcall: eight-card s suit, 3-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_pass
        call: P
        priority: 25
        requires: { hcp: [0, 15] }
        shows: "nothing suitable over 1C"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

