      # The negative double and the responsive double are the same shape of
      # agreement - our side has already acted, they have bid a suit, and I
      # hold values with a major they have not bid - so one rule covers both.
      # The specific negative-double contexts are more specific and still win
      # where they exist; this catches the overcalls they do not cover (a
      # minor overcall, a two-level overcall, a bid over partner's double).
      # Two gates keep it honest: it is my FIRST call in the auction (later
      # doubles mean other things, and the rule was doubling twice in one
      # auction), and I have no five-card suit of my own - with one of those
      # the bid is the suit, not a double asking partner to guess it.  The
      # price of the double rises with the level partner has to answer at,
      # so the two-level version asks for two more points.
      - id: cl_negative_X1
