      - id: r1c1d_2NT_$M
        call: 2NT
        priority: 55
        requires: { hcp: [11, 12], evals: { semi_balanced: [1, 1] } }
        shows: "invitational 11-12"
        establishes: { forcing: invitational }
      - id: r1c1d_3NT_$M
        call: 3NT
        priority: 54
        requires: { hcp: [13, 18] }
        shows: "game values"
        establishes: { forcing: sign_off }

  - id: weak2_ask_continuation
    description: "The 2NT asker places the contract after opener's feature reply"
    expand: { W: [D, H, S] }
    pattern: "2$W - P - 2NT - P - bid - P - ?"
    rules:
      - id: w2ac_game_$W
        call: 4$W
        priority: 56
        when: { partner_suit: $W }
        requires: { suits: { $W: [3, 13] }, evals: { total_points: [15, 40] } }
        shows: "placing the game opposite the weak two"
        establishes: { forcing: sign_off, agreed_suit: $W }
      - id: w2ac_3NT_$W
        call: 3NT
        priority: 55
        requires: { hcp: [14, 40], evals: { weakest_unshown_stopper: [0.9, 9] } }
        shows: "nine tricks: the unshown suits are stopped"
        establishes: { forcing: sign_off }
      # THE ASK HAS BEEN ANSWERED.  `w2ac_game_$W` asks how long MY suit is,
      # opposite a partner who opened a weak two and has therefore already
      # promised six: my doubleton is the eighth trump.  The generic raises
      # learned this and say so in their own comments; this ladder never got
      # the sweep, so a 17-count opposite an answered ask signed off in three.
      # Additive rather than a widening: loosening `w2ac_game_$W` in place also
      # loosens the MINOR, where nine tricks beat eleven and 3NT is right.
      # Hence priority 54.5 - under `w2ac_3NT_$W` (55), over `w2ac_sign_$W` (54).
      - id: w2ac_game8_$W
        call: 4$W
        priority: 54.5
        when: { partner_suit: $W, is_competitive: false }
        requires:
          suits: { $W: [2, 13] }
          evals: { total_points: [15, 40], "lott_total_trumps($W)": [8, 26], longest_suit_length: [0, 5] }
        shows: "placing the game opposite the weak two: partner showed six, so my doubleton is the eighth trump"
        establishes: { forcing: sign_off, agreed_suit: $W }
      - id: w2ac_sign_$W
        call: 3$W
        priority: 54
        when: { partner_suit: $W, cheapest_in_suit: true }
        requires: {}
        shows: "no game opposite the reply: back to the suit"
        establishes: { forcing: sign_off, agreed_suit: $W }

  - id: redouble_continuations
