  # `vw2_2NT` is a 15-18 balanced notrump overcall of their weak two and NOTHING
  # answered it: the seat fell through to the generic toolkit, whose catch-all
  # pass fits 1.00 at priority 18, so the overcall was passed out on all six of
  # its firings in the review corpus - once with eleven points opposite the
  # shown fifteen and 3NT making twelve tricks.  An overcall that describes a
  # notrump opening needs the raise that answers it.  Deliberately two rungs and
  # no Stayman: an asking bid would need its own answering seat.
  - id: advance_2NT_over_weak_two
    description: "Advancing partner's natural 2NT overcall of their weak two"
    expand: { X: [D, H, S] }
    pattern: "2$X - 2NT - P - ?"
    rules:
      - id: a2nw_3NT_$X
        call: 3NT
        priority: 55
        requires: { hcp: [8, 40] }
        shows: "game opposite the 15-18 notrump overcall"
        establishes: { forcing: sign_off }
      - id: a2nw_pass_$X
        call: P
        priority: 20
        requires: {}
        shows: "not enough for game opposite 15-18"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  - id: preemptor_discipline
    description: "Preempt once: the preemptor does not act again voluntarily"
    pattern: "... - ?"
    rules:
      # An earlier attempt at this maxim (a 10-HCP floor on generic suit
      # rebids) silenced nine-count OVERCALLERS and lost a measured 10 IMPs;
      # the i_preempted condition keys on the actual preempt, so only the
      # hand that already told partner everything is silenced.  Priority 45:
      # above the generic toolkit (a preemptor gets no generic second bid),
      # below every authored continuation (feature-ask answers, RONF
      # rebids), which fire from specific contexts as before.  we_bid_last
      # false keeps it off partner's forcing continuations, which arrive
      # with our side holding the standing bid.
      - id: preemptor_pass
        call: P
        priority: 45
        when: { i_preempted: true, we_bid_last: false, we_hold_contract: false }
        requires: {}
        shows: "the preempt said it all: no voluntary second bid"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: general_slam_try
    description: "RKC 1430 when partner has shown a suit and we hold slam values"
    pattern: "... - ?"
    rules:
      - id: gst_rkc_C
        call: 4NT
        priority: 46
        when: { partner_suit: C, partner_last_suit: C, standing_bid_level: [2, 3, 4], we_hold_contract: false }
        requires:
          # lott_total_trumps is the real fit gate (sharp, eight combined) and
          # uc_raise_$M4 already counts a DOUBLETON opposite a shown six-card
          # suit as a fit.  The ask kept the three-card floor its own raise had
          # dropped, so a nineteen-count with two of partner's rebid suit had a
          # game raise fitting 1.00 and a keycard ask fitting 0.35.
          suits: { C: [2, 13] }
          evals: { total_points: [15, 40], controls: [4, 12], rule_of_26_sharp: [31, 99],
                    "lott_total_trumps(C)": [8, 26] }
          any_of:
            - evals: { "void(any)": [0, 0] }
            - evals: { "keycards(C)": [3, 5] }
        shows: "RKC Blackwood 1430 for C: slam values opposite partner's shown range"
        establishes: { forcing: one_round, agreed_suit: C, asking: keycards }
        alertable: true
        convention: rkc_1430
