  - id: responder_rebid_1H_1S_2C
    description: "Responder's rebid after 1H - 1S - 2C (opener is two-suited)"
    pattern: "1H - P - 1S - P - 2C - P - ?"
    rules:
      - id: rr1H1SC_2H
        call: 2H
        priority: 60
        requires: { suits: { H: [3, 13] }, evals: { total_points: [6, 10] } }
        shows: "preference back to opener's hearts: 3+ hearts, minimum"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: rr1H1SC_3H
        call: 3H
        priority: 62
        requires: { suits: { H: [4, 13] }, evals: { total_points: [11, 12] } }
        shows: "invitational heart raise: 4+ hearts"
        establishes: { forcing: invitational, agreed_suit: H }
      # capped at 18 (see the trump-setting round): 19+ belongs to the slam rules
      - id: rr1H1SC_4H
        call: 4H
        priority: 63
        requires: { suits: { H: [3, 13] }, evals: { total_points: [13, 18] } }
        shows: "game in hearts: 3+ hearts opposite a 5-card suit, game values"
        establishes: { forcing: sign_off, agreed_suit: H }
      - id: rr1H1SC_2S
        call: 2S
        priority: 55
        # FIVE, not six: 1H - 1S - 2m - 2S is preference to my own suit at the
        # two level and shows five in every standard partnership.  Demanding six
        # meant the five-card hands bid it anyway on a soft miss, and partner -
        # reading six - fed a sharp LOTT gate a trump that did not exist and
        # raised a 5-2 fit to game.
        requires: { suits: { S: [5, 13], H: [0, 2] }, evals: { total_points: [6, 10] } }
        shows: "5+ spades, no heart fit, to play"
        establishes: { forcing: sign_off }
      - id: rr1H1SC_2NT
        call: 2NT
        priority: 54
        requires: { hcp: [11, 12], suits: { H: [0, 2] } }
        shows: "invitational, no fit"
        establishes: { forcing: invitational }
      - id: rr1H1SC_3NT
        call: 3NT
        priority: 56
        requires: { hcp: [13, 17], suits: { H: [0, 2] } }
        shows: "to play"
        establishes: { forcing: sign_off }
      - id: rr1H1SC_pass
        call: P
        priority: 45
        requires: { suits: { C: [4, 13], H: [0, 2] }, evals: { total_points: [6, 9] } }
        shows: "passing the second suit with a fit and no extras"
        establishes: { forcing: sign_off }

  - id: responder_rebid_1H_1S_2D
    description: "Responder's rebid after 1H - 1S - 2D (opener is two-suited)"
    pattern: "1H - P - 1S - P - 2D - P - ?"
    rules:
      - id: rr1H1SD_2H
        call: 2H
        priority: 60
        requires: { suits: { H: [3, 13] }, evals: { total_points: [6, 10] } }
        shows: "preference back to opener's hearts: 3+ hearts, minimum"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: rr1H1SD_3H
        call: 3H
        priority: 62
        requires: { suits: { H: [4, 13] }, evals: { total_points: [11, 12] } }
        shows: "invitational heart raise: 4+ hearts"
        establishes: { forcing: invitational, agreed_suit: H }
      # capped at 18 (see the trump-setting round): 19+ belongs to the slam rules
      - id: rr1H1SD_4H
        call: 4H
        priority: 63
        requires: { suits: { H: [3, 13] }, evals: { total_points: [13, 18] } }
        shows: "game in hearts: 3+ hearts opposite a 5-card suit, game values"
        establishes: { forcing: sign_off, agreed_suit: H }
      - id: rr1H1SD_2S
        call: 2S
        priority: 55
        # FIVE, not six: 1H - 1S - 2m - 2S is preference to my own suit at the
        # two level and shows five in every standard partnership.  Demanding six
        # meant the five-card hands bid it anyway on a soft miss, and partner -
        # reading six - fed a sharp LOTT gate a trump that did not exist and
        # raised a 5-2 fit to game.
        requires: { suits: { S: [5, 13], H: [0, 2] }, evals: { total_points: [6, 10] } }
        shows: "5+ spades, no heart fit, to play"
        establishes: { forcing: sign_off }
      - id: rr1H1SD_2NT
        call: 2NT
        priority: 54
        requires: { hcp: [11, 12], suits: { H: [0, 2] } }
        shows: "invitational, no fit"
        establishes: { forcing: invitational }
      - id: rr1H1SD_3NT
        call: 3NT
        priority: 56
        requires: { hcp: [13, 17], suits: { H: [0, 2] } }
        shows: "to play"
        establishes: { forcing: sign_off }
      - id: rr1H1SD_pass
        call: P
        priority: 45
        requires: { suits: { D: [4, 13], H: [0, 2] }, evals: { total_points: [6, 9] } }
        shows: "passing the second suit with a fit and no extras"
        establishes: { forcing: sign_off }

