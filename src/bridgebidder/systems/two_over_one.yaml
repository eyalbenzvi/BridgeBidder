        shows: "rebid of my own doubled S: 6+ cards, 14+ points"
        establishes: { forcing: non_forcing }
      # Raising partner's doubled suit: trump length is what makes the
      # contract playable, so these are the LOTT raises, same as elsewhere.
      - id: xd_raise_C2
        call: 2C
        priority: 30
        when: { we_bid_last: true, we_hold_contract: false, partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [6, 9], "lott_total_trumps(C)": [7, 26] }
        shows: "raise of partner's doubled C: 3+ trumps, 6-9 support points"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: xd_jumpraise_C3
        call: 3C
        priority: 32
        # Both raise rules carried cheapest_in_suit, so over a double of
        # partner's ONE-level overcall only the 6-9 raise was ever a
        # candidate: an 11- or 15-point four-card raise had no call and the
        # permissive xd_pass swallowed it.  The jump raise is the missing band.
        when: { we_bid_last: true, we_hold_contract: false, partner_suit: C, standing_bid_level: [1] }
        requires:
          suits: { C: [4, 13] }
          evals: { total_points: [10, 40], "lott_total_trumps(C)": [9, 26] }
        shows: "jump raise of partner's doubled C: 4+ trumps, 10+ support points"
