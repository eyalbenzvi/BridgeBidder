  # ADVANCES OF PARTNER'S OVERCALL (simple raise / new suit / cue raise)
  # ===========================================================================

  # When they double advancer's cue-raise, the pair must never play the
  # doubled artificial call: the overcaller retreats to his suit as a
  # mandatory floor, and the cue-bidder pulls if it comes back around.
  # (Two boards played 2-of-a-cue doubled, -800 and -500, because the xd
  # context knew nothing of the agreed suit and the backstop passed.)
  # Advance ladders for every LIVE takeout double - the recurring trap:
  # a double authored without its advances gets passed out for -670 on a
  # doubleton (three separate boards across two reviews).  The ladder is
  # always: cheapest 4+ suit is near-mandatory on weakness, jumps invite,
  # NT natural with their suit stopped, and the penalty PASS needs a real
  # trump stack, never mere absence of a bid.
  # Opener's rebids after responder's negative double of their overcall -
  # the position had no rules, so the generics fought (a flat 12 bid a
  # vulnerable 2NT on a Qx stopper a level too high).
  - id: responder_over_2NT_rebid
    description: "Responder after 1M - 1NT - 2NT (18-19)"
    expand: { M: [H, S] }
    pattern: "1$M - P - 1NT - P - 2NT - P - ?"
    rules:
      - id: r2nr_3NT_$M
        call: 3NT
        priority: 55
        requires: { hcp: [6, 12] }
        shows: "game opposite the 18-19 rebid"
        establishes: { forcing: sign_off }
      - id: r2nr_pass_$M
        call: P
        priority: 50
        requires: { hcp: [0, 5] }
        shows: "nothing opposite 18-19"
        establishes: { forcing: sign_off }
      # the slam probe: 9+ with a running 6-card minor opposite 18-19 is
      # 27-31 with a source of tricks (a 6C slam was missed passing 2NT)
      - id: r2nr_3C_$M
        call: 3C
        priority: 56
        requires: { suits: { C: [6, 13] }, hcp: [9, 12], evals: { "two_of_top3(C)": [1, 1] } }
        shows: "natural slam probe: 6+ good clubs opposite 18-19"
        establishes: { forcing: one_round }
      - id: r2nr_3D_$M
        call: 3D
        priority: 56
        requires: { suits: { D: [6, 13] }, hcp: [9, 12], evals: { "two_of_top3(D)": [1, 1] } }
        shows: "natural slam probe: 6+ good diamonds opposite 18-19"
        establishes: { forcing: one_round }

  - id: opener_over_2NT_minor_probe
    description: "Opener answers the minor slam probe over his 2NT rebid"
    expand_pairs:
