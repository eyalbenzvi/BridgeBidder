  - id: general_competitive_high
    description: "General competitive agreements after their 3-level-or-higher bid"
    pattern: "... - bid>=3C - ?"
    when: { we_hold_contract: false }
    rules:
      # This asked for SHORTNESS in their suit, which is a takeout shape, and
      # then left the double in as a penalty.  Over 1000 duplicate boards
      # against BEN our doubles were beaten 27 times and made 26, a losing
      # bet worth about 200 IMPs.  A business double of a high contract needs
      # trump tricks: length in their suit, not a void opposite silence.
      # Trump length must be in the strain we are doubling.  "their" resolves to
      # the first suit they showed, so a hand with a singleton in the contract
      # suit was doubling a freely bid game on side-suit honours (b0007B, b0109B).
      - id: ch_penalty_X_C
        call: X
        priority: 38
        when: { standing_bid_strain: [C], side_has_acted: true }
        requires:
          evals: { quick_tricks: [3, 12] }
          any_of:
            - hcp: [15, 40]
              suits: { C: [3, 13] }
            - hcp: [18, 40]
              suits: { C: [2, 2] }
        shows: "penalty double of their high contract: defensive tricks and trump length"
        establishes: { forcing: non_forcing }
      - id: ch_penalty_X_D
        call: X
        priority: 38
        when: { standing_bid_strain: [D], side_has_acted: true }
        requires:
          evals: { quick_tricks: [3, 12] }
          any_of:
            - hcp: [15, 40]
              suits: { D: [3, 13] }
            - hcp: [18, 40]
              suits: { D: [2, 2] }
        shows: "penalty double of their high contract: defensive tricks and trump length"
        establishes: { forcing: non_forcing }
      - id: ch_penalty_X_H
        call: X
        priority: 38
        when: { standing_bid_strain: [H], side_has_acted: true }
        requires:
          evals: { quick_tricks: [3, 12] }
          any_of:
            - hcp: [15, 40]
              suits: { H: [3, 13] }
            - hcp: [18, 40]
              suits: { H: [2, 2] }
        shows: "penalty double of their high contract: defensive tricks and trump length"
        establishes: { forcing: non_forcing }
      - id: ch_penalty_X_S
        call: X
        priority: 38
        when: { standing_bid_strain: [S], side_has_acted: true }
        requires:
          evals: { quick_tricks: [3, 12] }
          any_of:
            - hcp: [15, 40]
              suits: { S: [3, 13] }
            - hcp: [18, 40]
              suits: { S: [2, 2] }
        shows: "penalty double of their high contract: defensive tricks and trump length"
        establishes: { forcing: non_forcing }

