  # ===========================================================================
  # SLAM TRY IN AN ORDINARY AUCTION
  #
  # The RKC ask lived behind two gates - a recorded trump agreement and a
  # game force - and in the BEN match neither held in the position that
  # actually matters.  With a fit and twenty points the generic raise simply
  # jumped to game and the auction died: on the 117 boards of that match
  # where a slam was available we stopped at the four level 61 times and
  # asked for keycards 15 times, while BEN bid 49 slams to our 11.
  #
  # So the ask is available here too, in the same position as the game raise
  # and ranked above it, on the values that justify hearing the answer: a
  # eight-card fit, seventeen points of my own, two aces or the equivalent,
  # and thirty-one counting what partner has actually shown.  The auction has to
  # be at the two level or higher first - 4NT over a one-level bid is a
  # guess, not a question.
  #
  # The nine-trump gate is doing the real work, and it was chosen the hard
  # way.  Point count alone cannot tell a slam try from a game bid here: the
  # hands in the corpus that SHOULD bid game were, if anything, stronger in
  # points than the ones with a slam on.  What separates them is the fit.
  # ===========================================================================

  - id: general_slam_try
    description: "RKC 1430 when partner has shown a suit and we hold slam values"
    pattern: "... - ?"
    rules:
      - id: gst_rkc_C
        call: 4NT
        priority: 46
        when: { partner_suit: C, standing_bid_level: [2, 3, 4], we_hold_contract: false }
        requires:
          suits: { C: [4, 13] }
          evals: { total_points: [17, 40], controls: [4, 12], rule_of_26: [31, 99],
                    "lott_total_trumps(C)": [8, 26] }
        shows: "RKC Blackwood 1430 for C: slam values opposite partner's shown range"
        establishes: { forcing: one_round, agreed_suit: C, asking: keycards }
        alertable: true
        convention: rkc_1430
      - id: gst_rkc_D
        call: 4NT
        priority: 46
        when: { partner_suit: D, standing_bid_level: [2, 3, 4], we_hold_contract: false }
        requires:
          suits: { D: [4, 13] }
          evals: { total_points: [17, 40], controls: [4, 12], rule_of_26: [31, 99],
                    "lott_total_trumps(D)": [8, 26] }
        shows: "RKC Blackwood 1430 for D: slam values opposite partner's shown range"
        establishes: { forcing: one_round, agreed_suit: D, asking: keycards }
        alertable: true
        convention: rkc_1430
      - id: gst_rkc_H
        call: 4NT
        priority: 46
        when: { partner_suit: H, standing_bid_level: [2, 3, 4], we_hold_contract: false }
        requires:
          suits: { H: [4, 13] }
          evals: { total_points: [17, 40], controls: [4, 12], rule_of_26: [31, 99],
                    "lott_total_trumps(H)": [8, 26] }
        shows: "RKC Blackwood 1430 for H: slam values opposite partner's shown range"
        establishes: { forcing: one_round, agreed_suit: H, asking: keycards }
        alertable: true
        convention: rkc_1430
      - id: gst_rkc_S
        call: 4NT
        priority: 46
        when: { partner_suit: S, standing_bid_level: [2, 3, 4], we_hold_contract: false }
        requires:
          suits: { S: [4, 13] }
          evals: { total_points: [17, 40], controls: [4, 12], rule_of_26: [31, 99],
                    "lott_total_trumps(S)": [8, 26] }
        shows: "RKC Blackwood 1430 for S: slam values opposite partner's shown range"
        establishes: { forcing: one_round, agreed_suit: S, asking: keycards }
        alertable: true
        convention: rkc_1430

  # ===========================================================================
  # CUE BIDS: THE FLOOR BETWEEN GAME AND BLACKWOOD
  #
  # The head-to-head match showed the engine's only route to slam was a blind
  # 4NT: with a suit agreed in a game force it either met the stiff RKC gate
  # or gave up and bid game, and there was nothing in between.  Real slam
  # auctions live in that gap.  A cue bid is a new suit below game once trumps
  # are agreed: it shows FIRST-round control there (ace or void) and slam
  # interest, and asks partner to cooperate.
  #
  # The negative inference does the heavy lifting, and it is the whole reason
  # this encodes so naturally: the cues are priority-ordered cheapest first,
  # so bidding 4D over 3S having skipped 4C *denies* first-round club control
  # - and returning to game denies whatever was still cheap enough to show.
  # Partner reads the denials from the machinery, the same as a human would.
  #
  # Gates: cues live only when the agreement stands at the three level (the
  # classic slam-try position - any higher and there is no room, any lower
  # and the calls have natural meanings), and only below game in the agreed
  # major, so a cue chain can never push past 4M: over 3S the cues are
  # 4C/4D/4H and the next player is back to signing off or asking.  (The
  # standing bid may be at the FOUR level too - that is what answering
  # partner's own four-level cue looks like - but never higher.)  A cue
  # shows 14+ points opposite the shown range; that feeds the partner model,
  # raises rule_of_26, and thereby unlocks the existing RKC gate for a
  # partner who could not have asked directly - the machinery composes.
  # ===========================================================================

  - id: cue_bidding_S
    description: "Control-showing cue bids with spades agreed in a game force"
    # "... - P - ?" rather than "... - ?": one token of specificity, so these
    # rules tie with the generic toolkit's contexts and win on file order -
    # otherwise "raise partner's club suit" shadows the 4C cue whenever the
    # cue suit happens to be one partner once bid naturally.
    pattern: "... - P - ?"
    when: { agreed_suit: S, game_forced: true }
    rules:
      - id: cue_S_C
        call: 4C
        priority: 44
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          evals: { "control_in(C)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round club control (ace or void), slam interest for spades"
        establishes: { forcing: one_round, agreed_suit: S }
        alertable: true
        convention: cue_bid
      - id: cue_S_D
        call: 4D
        priority: 43.5
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          evals: { "control_in(D)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round diamond control (ace or void), slam interest for spades"
        establishes: { forcing: one_round, agreed_suit: S }
        alertable: true
        convention: cue_bid
      - id: cue_S_H
        call: 4H
        priority: 43
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          evals: { "control_in(H)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round heart control (ace or void), slam interest for spades"
        establishes: { forcing: one_round, agreed_suit: S }
        alertable: true
        convention: cue_bid
      # partner's cue forces one round; with nothing left to show, game.
      # Choosing this over an available cue denies the skipped controls.
      - id: cue_S_signoff
        call: 4S
        priority: 34
        requires: {}
        shows: "no control worth showing: back to the agreed game"
        establishes: { forcing: non_forcing, agreed_suit: S }
        negative_inference_weight: soft

  - id: cue_bidding_H
    description: "Control-showing cue bids with hearts agreed in a game force"
    # "... - P - ?" rather than "... - ?": one token of specificity, so these
    # rules tie with the generic toolkit's contexts and win on file order -
    # otherwise "raise partner's club suit" shadows the 4C cue whenever the
    # cue suit happens to be one partner once bid naturally.
    pattern: "... - P - ?"
    when: { agreed_suit: H, game_forced: true }
    rules:
      - id: cue_H_S
        call: 3S
        priority: 44
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          evals: { "control_in(S)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round spade control (ace or void), slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      - id: cue_H_C
        call: 4C
        priority: 43.5
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          evals: { "control_in(C)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round club control (ace or void), slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      - id: cue_H_D
        call: 4D
        priority: 43
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          evals: { "control_in(D)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round diamond control (ace or void), slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      - id: cue_H_signoff
        call: 4H
        priority: 34
        requires: {}
        shows: "no control worth showing: back to the agreed game"
        establishes: { forcing: non_forcing, agreed_suit: H }
        negative_inference_weight: soft

  - id: quant_raise_of_3NT
    description: "Raising partner's natural 3NT on sheer combined strength"
    pattern: "... - 3NT - P - ?"
    rules:
      # Partner's 3NT is a limited, balanced-ish call, so the arithmetic is
      # honest: my points plus the minimum partner has shown.  Thirty-three
      # is the classic small-slam number.  Seventeen of the slam boards in
      # the head-to-head died in exactly this seat - 3NT bid and passed with
      # a slam cold on power.
      - id: qr3_6NT
        call: 6NT
        priority: 40
        requires:
          hcp: [16, 40]
          # controls too: 33 combined with two aces missing is off two tricks
          # at notrump, and the corpus produced exactly that 6NT
          evals: { rule_of_26: [33, 99], semi_balanced: [1, 1], controls: [5, 12] }
        shows: "raising partner's 3NT to slam: 33+ combined points"
        establishes: { forcing: sign_off }
      # 33 combined is invisible when it splits 17/16: neither hand can count
      # it alone, which is what the invite is for.  4NT directly over 3NT is
      # quantitative by agreement (never keycards), pass-able, and the 3NT
      # bidder accepts holding the top of the range already shown.
      - id: qr3_4NT_quant
        call: 4NT
        priority: 39
        requires:
          hcp: [15, 40]
          evals: { rule_of_26: [30, 99] }
          any_of:
            - evals: { semi_balanced: [1, 1] }
            - hcp: [17, 40]
        shows: "quantitative raise of 3NT: inviting slam, partner passes with a minimum"
        establishes: { forcing: non_forcing }
        alertable: true

  - id: quant_3NT_accept
    description: "The 3NT bidder over partner's quantitative 4NT"
    pattern: "... - 3NT - P - 4NT - P - ?"
    rules:
      - id: qa_6NT
        call: 6NT
        priority: 40
        requires: { hcp: [16, 40] }
        shows: "accepting the slam invite: top of the range shown"
        establishes: { forcing: sign_off }
      - id: qa_pass
        call: P
        priority: 30
        requires: {}
        shows: "declining the slam invite: minimum for the 3NT bid"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  # ===========================================================================
  # FOURTH SUIT FORCING
  #
  # Three suits are on the table and responder still has no clear bid: the
  # fourth suit is artificial, game-forcing, and says "pick for me" - most
  # often asking for a stopper there so 3NT can be bid from the right side.
  # This is the tool that makes "when 3NT is an option, bid it" reachable:
  # without it, the hands with one unstopped suit had no way to ask.
  # ===========================================================================

  - id: fourth_suit_forcing
    description: "Responder's fourth suit is artificial and game forcing"
    expand_pairs:
      - { O: 1C, R: 1H, B: 1S, BS: S, F: 2D, FS: D }
      - { O: 1C, R: 1D, B: 1S, BS: S, F: 2H, FS: H }
      - { O: 1D, R: 1H, B: 1S, BS: S, F: 2C, FS: C }
      - { O: 1D, R: 1S, B: 2C, BS: C, F: 2H, FS: H }
      - { O: 1H, R: 1S, B: 2C, BS: C, F: 2D, FS: D }
    pattern: "$O - P - $R - P - $B - P - ?"
    rules:
      # "no clear natural bid" is the premise, so it is gated in: no fit for
      # opener's second suit (raise it instead), no stopper in the fourth
      # suit (bid notrump yourself instead), no self-sufficient suit of your
      # own (rebid it instead)
      - id: fsf_$F
        call: $F
        priority: 65
        requires:
          suits: { $BS: [0, 3] }
          # 13+: the fourth suit FORCES TO GAME, so invitational hands (11-12)
          # must find a natural call instead
          evals: { total_points: [13, 40], "stoppers($FS)": [0, 0.5],
                   longest_suit_length: [0, 5] }
        shows: "fourth suit forcing: game values, no clear natural bid, seeking a $FS stopper for notrump"
        establishes: { forcing: game_forcing }
        alertable: true
        convention: fourth_suit_forcing

  - id: fourth_suit_reply
    description: "Opener's reply to fourth suit forcing"
    expand_pairs:
      - { O: 1C, R: 1H, RS: H, B: 1S, F: 2D, FS: D }
      - { O: 1C, R: 1D, RS: D, B: 1S, F: 2H, FS: H }
      - { O: 1D, R: 1H, RS: H, B: 1S, F: 2C, FS: C }
      - { O: 1D, R: 1S, RS: S, B: 2C, F: 2H, FS: H }
      - { O: 1H, R: 1S, RS: S, B: 2C, F: 2D, FS: D }
    pattern: "$O - P - $R - P - $B - P - $F - P - ?"
    rules:
      # the stopper answer comes first: that is what partner asked about
      - id: fsfr_2NT_$F
        call: 2NT
        priority: 68
        requires:
          evals: { "stoppers($FS)": [1, 9] }
        shows: "fourth suit answered: $FS stopped, notrump from this side"
        establishes: { forcing: game_forcing }
      - id: fsfr_raise_$F
        call: 3$RS
        priority: 66
        requires:
          suits: { $RS: [3, 13] }
          evals: { "stoppers($FS)": [0, 0.5] }
        shows: "no $FS stopper: showing delayed 3-card support for partner's $RS"
        establishes: { forcing: game_forcing, agreed_suit: $RS }

  # ===========================================================================
  # GENERIC GAME-FORCE LANDING SPOTS (least specific; consulted when nothing
  # anchored matches)
  # ===========================================================================

  - id: gf_landing_major
    description: "Generic: with a major agreed in a GF, bid/raise to game"
    expand: { A: [H, S] }
    pattern: "... - ?"
    when: { agreed_suit: $A, game_forced: true }
    rules:
      - id: gf_game_4$A
        call: 4$A
        priority: 35
        requires: { evals: { total_points: [0, 17] } }
        shows: "signing off in the agreed major game"
        establishes: { forcing: non_forcing, agreed_suit: $A }

  - id: gf_landing_minor
    description: "With a minor agreed in a GF: nine tricks beat eleven"
    expand: { m: [C, D] }
    # "... - P - ?" for the same reason as the cue contexts: the generic
    # toolkit's 3NT rule would otherwise cover the call at higher specificity
    # and this context's honest stopper gate would never be consulted
    pattern: "... - P - ?"
    when: { agreed_suit: $m, game_forced: true }
    rules:
      # The oldest maxim in the book: when 3NT is one of the logical options,
      # bid it.  Eleven tricks in a minor need roughly the same values as
      # nine in notrump, and score worse.  The gate is the honest version of
      # "is 3NT an option": every suit our side has not shown is stopped.
      - id: gf_minor_3NT
        call: 3NT
        priority: 37
        # only in the "partner raised the minor, pick a game" position: over
        # our own side's 3NT this rule must never fire (it was pulling
        # partner's 3NT to five of a minor - the exact opposite of the maxim)
        when: { standing_bid_strain: [$m] }
        requires:
          hcp: [0, 17]
          evals: { weakest_unshown_stopper: [0.9, 9] }
        shows: "choosing 3NT over the minor game: the unshown suits are stopped"
        establishes: { forcing: non_forcing }
      - id: gf_game_5$m
        call: 5$m
        priority: 33
        when: { standing_bid_strain: [$m] }
        requires: { evals: { total_points: [0, 17] } }
        shows: "signing off in the agreed minor game (3NT unavailable)"
        establishes: { forcing: non_forcing, agreed_suit: $m }

  - id: gf_landing_nt
    description: "Generic: in a GF with no agreed suit, 3NT is the default game"
    # "... - P - ?" so this covers 3NT ahead of the generic 13-17 notrump
    # rule: in a game force ANY strength raises partner's 2NT to game, and
    # the shadowing cost a real board (a 4-3 spade game on eleven points
    # because 3NT was gated 13+)
    pattern: "... - P - ?"
    when: { agreed_suit: false, game_forced: true }
    rules:
      - id: gf_long_suit_C
        call: 3C
        priority: 35
        when: { unbid_suit: C, cheapest_in_suit: true }
        requires: { any_of: [ { suits: { C: [7, 13] } }, { suits: { C: [6, 13] }, features: [ "two_of_top3(C)" ] }, { suits: { C: [5, 13] }, evals: { total_points: [10, 40] } } ] }
        shows: "a long C in the game force: the suit before any notrump"
        establishes: { forcing: one_round }
      - id: gf_long_suit_D
        call: 3D
        priority: 35
        when: { unbid_suit: D, cheapest_in_suit: true }
        requires: { any_of: [ { suits: { D: [7, 13] } }, { suits: { D: [6, 13] }, features: [ "two_of_top3(D)" ] }, { suits: { D: [5, 13] }, evals: { total_points: [10, 40] } } ] }
        shows: "a long D in the game force: the suit before any notrump"
        establishes: { forcing: one_round }
      - id: gf_long_suit_H
        call: 3H
        priority: 35
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires: { any_of: [ { suits: { H: [7, 13] } }, { suits: { H: [6, 13] }, features: [ "two_of_top3(H)" ] }, { suits: { H: [5, 13] }, evals: { total_points: [10, 40] } } ] }
        shows: "a long H in the game force: the suit before any notrump"
        establishes: { forcing: one_round }
      - id: gf_long_suit_S
        call: 3S
        priority: 35
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires: { any_of: [ { suits: { S: [7, 13] } }, { suits: { S: [6, 13] }, features: [ "two_of_top3(S)" ] }, { suits: { S: [5, 13] }, evals: { total_points: [10, 40] } } ] }
        shows: "a long S in the game force: the suit before any notrump"
        establishes: { forcing: one_round }
      - id: gf_3NT
        call: 3NT
        priority: 34
        # "no fit found" is a checkable claim: no known eight-card fit with
        # partner's suit (the lott gate is sharp - trumps are counted)
        requires:
          hcp: [0, 17]
          evals: { lott_total_trumps: [0, 7], longest_suit_length: [0, 7] }
          not: { any_of: [ { suits: { H: [6, 13] } }, { suits: { S: [6, 13] } } ] }
          features: [ "stopper(their)" ]
        shows: "no fit found: choosing 3NT"
        establishes: { forcing: non_forcing }

  # ===========================================================================
  # LATE ADDITIONS (kept at file end; pattern specificity governs matching)
  # ===========================================================================

  - id: resp_1C_1D
    description: "1D response to 1C (no 4-card major, Walsh-lite)"
    pattern: "1C - P - ?"
    rules:
      - id: r1C_1D
        call: 1D
        priority: 74
        requires:
          hcp: [6, 40]
          suits: { D: [4, 13] }
          any_of: [ { suits: { D: [5, 13] } }, { evals: { balanced: [0, 0] } } ]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "4+ diamonds (5+ or unbalanced), 6+ HCP, no 4-card major (Walsh style)"
        establishes: { forcing: one_round }

  - id: gf_landing_nt_2nt
    description: "Generic: natural forcing 2NT in a game force with no fit"
    pattern: "... - ?"
    when: { agreed_suit: false, game_forced: true }
    rules:
      - id: gf_2NT_natural
        call: 2NT
        priority: 33
        requires: { evals: { stoppers(their): [0.5, 99] } }
        shows: "natural, no fit yet (game force continues)"
        establishes: { forcing: game_forcing }

  - id: neg_double_3level_M
    description: "Negative doubles through 3S: their 3-level overcall of our 1M"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
      - { M: S, x: H }
    pattern: "1$M - 3$x - ?"
    rules:
      - id: nx3_negx
        call: X
        priority: 70
        requires: { hcp: [8, 40], suits: { $oM: [4, 13] }, not: { suits: { $M: [3, 13] } } }
        shows: "negative double through 3S: 4+ cards in the other major, 8+ HCP"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: nx3_raise
        call: 3$M
        priority: 68
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [6, 10] } }
        shows: "competitive raise"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: nx3_game_raise
        call: 4$M
        priority: 69
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [11, 40] } }
        shows: "game raise over their preemptive overcall"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: nx3_3NT
        call: 3NT
        priority: 60
        requires: { hcp: [13, 18], features: [ "stopper($x)" ], not: { suits: { $M: [3, 13] } } }
        shows: "to play, stopper in their suit"
        establishes: { forcing: sign_off }
      - id: nx3_pass
        call: P
        priority: 20
        requires: { hcp: [0, 7] }
        shows: "nothing to say over the preempt"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: neg_double_3level_m
    description: "Negative doubles through 3S: their weak jump over our 1m"
    expand_pairs:
      - { m: C, j: 2H, u: S }
      - { m: C, j: 2S, u: H }
      - { m: D, j: 2H, u: S }
      - { m: D, j: 2S, u: H }
      - { m: C, j: 3H, u: S }
      - { m: C, j: 3S, u: H }
      - { m: D, j: 3S, u: H }
    pattern: "1$m - $j - ?"
    rules:
      - id: nxj_X
        call: X
        priority: 70
        requires: { hcp: [8, 40], suits: { $u: [4, 13] } }
        shows: "negative double of the jump overcall: 4+ $u and 8+"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: nxj_pass
        call: P
        priority: 20
        requires: { any_of: [ { hcp: [0, 7] }, { hcp: [0, 10], suits: { $u: [0, 3] } } ] }
        shows: "nothing to say over the jump"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: responder_preference_after_1M_1NT_2m
    description: "Simple preference / invitation after 1M - 1NT - 2m"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
    pattern: "1$M - P - 1NT - P - 2$x - P - ?"
    rules:
      - id: pref_pass
        call: P
        priority: 52
        requires: { suits: { $x: [4, 13] }, hcp: [6, 9] }
        shows: "happy with the second suit"
        establishes: { forcing: sign_off }
      - id: pref_2$M
        call: 2$M
        priority: 55
        requires: { suits: { $M: [2, 3] }, hcp: [6, 9] }
        shows: "simple preference: doubleton or tripleton $M, no game interest"
        establishes: { forcing: sign_off }
      - id: pref_2NT
        call: 2NT
        priority: 54
        requires: { hcp: [10, 11], not: { suits: { $M: [3, 13] } } }
        shows: "invitational, 10-11 (a maximum for the 1NT response)"
        establishes: { forcing: invitational }
      - id: pref_3M_limit
        call: 3$M
        priority: 56
        requires: { suits: { $M: [3, 3] }, evals: { total_points: [10, 12] } }
        shows: "3-card limit raise routed through 1NT"
        establishes: { forcing: invitational, agreed_suit: $M }

  - id: opener_rebid_1S_2C_2D
    description: "1S - 2C: opener's 4+ diamond second suit (GF)"
    pattern: "1S - P - 2C - P - ?"
    rules:
      - id: ob_1S2C_2D
        call: 2D
        priority: 53
        requires: { suits: { D: [4, 13] }, not: { suits: { S: [6, 13] } } }
        shows: "second suit: 4+ diamonds (GF)"
        establishes: { forcing: game_forcing }

  # ===========================================================================
  # SANDWICH SEAT (they opened and responded; we act in 4th chair)
  # ===========================================================================

  - id: sandwich_seat
    description: "Both opponents have bid at the 1-level: sandwich actions"
    expand: { o: [C, D, H, S] }
    pattern: "1$o - P - (1D|1H|1S|1NT) - ?"
    rules:
      - id: sw_X
        call: X
        priority: 70
        requires:
          any_of:
            - hcp: [12, 16]
              suits: { $o: [0, 2] }
              evals: { longest_suit_length: [4, 13] }
            - hcp: [17, 40]
        shows: "takeout of their suits: shortness in opener's suit (or any 17+)"
        establishes: { forcing: one_round }
      - id: sw_1NT
        call: 1NT
        priority: 71
        requires: { hcp: [15, 18], evals: { "stoppers(their)": [1, 1], semi_balanced: [1, 1] } }
        shows: "sandwich 1NT: 15-18 balanced with both their suits stopped"
        establishes: { forcing: non_forcing }
      - id: sw_1D
        call: 1D
        priority: 68
        when: { unbid_suit: D }
        requires: { suits: { D: [5, 13] }, hcp: [8, 16], evals: { suit_quality(D): [1.5, 9] } }
        shows: "sandwich overcall: good 5+ diamonds, 8-16"
        establishes: { forcing: non_forcing }
      - id: sw_1S
        call: 1S
        priority: 68
        requires: { suits: { S: [5, 13] }, hcp: [8, 16], evals: { suit_quality(S): [1.5, 9] } }
        shows: "sandwich overcall: good 5+ spades, 8-16"
        establishes: { forcing: non_forcing }
      - id: sw_1H
        call: 1H
        priority: 68
        requires: { suits: { H: [5, 13] }, hcp: [8, 16], evals: { suit_quality(H): [1.5, 9] } }
        shows: "sandwich overcall: good 5+ hearts, 8-16"
        establishes: { forcing: non_forcing }
      - id: sw_2C
        call: 2C
        priority: 66
        when: { unbid_suit: C }
        requires: { any_of: [ { suits: { C: [5, 13] }, hcp: [11, 17], evals: { suit_quality(C): [2, 9] } }, { suits: { C: [6, 13] }, hcp: [9, 17], evals: { suit_quality(C): [2, 9] } }, { suits: { C: [7, 13] }, hcp: [9, 17] } ] }
        shows: "sandwich 2-level overcall: good 5+ clubs, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_2D
        call: 2D
        priority: 66
        when: { unbid_suit: D }
        requires: { any_of: [ { suits: { D: [5, 13] }, hcp: [11, 17], evals: { suit_quality(D): [2, 9] } }, { suits: { D: [6, 13] }, hcp: [9, 17], evals: { suit_quality(D): [2, 9] } }, { suits: { D: [7, 13] }, hcp: [9, 17] } ] }
        shows: "sandwich 2-level overcall: good 5+ diamonds, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_2H
        call: 2H
        priority: 66
        when: { unbid_suit: H }
        requires: { any_of: [ { suits: { H: [5, 13] }, hcp: [11, 17], evals: { suit_quality(H): [2, 9] } }, { suits: { H: [6, 13] }, hcp: [9, 17], evals: { suit_quality(H): [2, 9] } }, { suits: { H: [7, 13] }, hcp: [9, 17] } ] }
        shows: "sandwich 2-level overcall: good 5+ hearts, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_2S
        call: 2S
        priority: 66
        when: { unbid_suit: S }
        requires: { any_of: [ { suits: { S: [5, 13] }, hcp: [11, 17], evals: { suit_quality(S): [2, 9] } }, { suits: { S: [6, 13] }, hcp: [9, 17], evals: { suit_quality(S): [2, 9] } }, { suits: { S: [7, 13] }, hcp: [9, 17] } ] }
        shows: "sandwich 2-level overcall: good 5+ spades, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_pass
        call: P
        priority: 30
        requires: { hcp: [0, 13] }
        shows: "nothing suitable between two bidding opponents"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  # ===========================================================================
  # BALANCING SEAT (their 1-level opening, two passes to us)
  # ===========================================================================

  - id: balancing_seat
    description: "Reopening after 1x - P - P (bid with ~3 fewer points)"
    expand: { o: [C, D, H, S] }
    pattern: "1$o - P - P - ?"
    rules:
      - id: bal_X
        call: X
        priority: 70
        requires:
          # takeout shape: no long suit to bid instead (b0043A doubled on a
          # seven-card diamond suit), not a two-suiter when light (b0169B),
          # and never with four of their suit (b0209A: AKJx of hearts)
          any_of:
            - hcp: [8, 16]
              suits: { $o: [0, 2] }
              evals: { longest_suit_length: [0, 4] }
            - hcp: [15, 40]
              suits: { $o: [0, 3] }
              evals: { longest_suit_length: [0, 5] }
        shows: "balancing takeout double (as low as 8-9 with shape)"
        establishes: { forcing: one_round }
      - id: bal_1NT
        call: 1NT
        priority: 66
        requires: { hcp: [11, 14], evals: { semi_balanced: [1, 1] }, features: [ "stopper($o)" ] }
        shows: "balancing 1NT: 11-14 with a stopper"
        establishes: { forcing: non_forcing }
      - id: bal_2NT
        call: 2NT
        priority: 65
        requires: { hcp: [19, 21], balanced: true, features: [ "stopper($o)" ] }
        shows: "balancing 2NT: 19-21 balanced"
        establishes: { forcing: non_forcing }
      - id: bal_pass
        call: P
        priority: 30
        requires: { hcp: [0, 10] }
        shows: "passing it out / nothing suitable"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  - id: balancing_suits_C
    description: "Balancing suit bids over 1C - P - P"
    pattern: "1C - P - P - ?"
    rules:
      - id: bal_C_1D
        call: 1D
        priority: 68
        requires: { suits: { D: [5, 13] }, hcp: [7, 15] }
        shows: "balancing: 5+ D, 7-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_C_1H
        call: 1H
        priority: 68
        requires: { suits: { H: [5, 13] }, hcp: [7, 15] }
        shows: "balancing: 5+ H, 7-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_C_1S
        call: 1S
        priority: 68
        requires: { suits: { S: [5, 13] }, hcp: [7, 15] }
        shows: "balancing: 5+ S, 7-15 (light by a king)"
        establishes: { forcing: non_forcing }

  - id: balancing_suits_D
    description: "Balancing suit bids over 1D - P - P"
    pattern: "1D - P - P - ?"
    rules:
      - id: bal_D_1H
        call: 1H
        priority: 68
        requires: { suits: { H: [5, 13] }, hcp: [7, 15] }
        shows: "balancing: 5+ H, 7-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_D_1S
        call: 1S
        priority: 68
        requires: { suits: { S: [5, 13] }, hcp: [7, 15] }
        shows: "balancing: 5+ S, 7-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_D_2C
        call: 2C
        priority: 64
        requires: { suits: { C: [5, 13] }, hcp: [10, 15] }
        shows: "balancing: 5+ C, 10-15 (light by a king)"
        establishes: { forcing: non_forcing }

  - id: balancing_suits_H
    description: "Balancing suit bids over 1H - P - P"
    pattern: "1H - P - P - ?"
    rules:
      - id: bal_H_1S
        call: 1S
        priority: 68
        requires: { suits: { S: [5, 13] }, hcp: [7, 15] }
        shows: "balancing: 5+ S, 7-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_H_2C
        call: 2C
        priority: 64
        requires: { suits: { C: [5, 13] }, hcp: [10, 15] }
        shows: "balancing: 5+ C, 10-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_H_2D
        call: 2D
        priority: 64
        requires: { suits: { D: [5, 13] }, hcp: [10, 15] }
        shows: "balancing: 5+ D, 10-15 (light by a king)"
        establishes: { forcing: non_forcing }

  - id: balancing_suits_S
    description: "Balancing suit bids over 1S - P - P"
    pattern: "1S - P - P - ?"
    rules:
      - id: bal_S_2C
        call: 2C
        priority: 64
        requires: { suits: { C: [5, 13] }, hcp: [10, 15] }
        shows: "balancing: 5+ C, 10-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_S_2D
        call: 2D
        priority: 64
        requires: { suits: { D: [5, 13] }, hcp: [10, 15] }
        shows: "balancing: 5+ D, 10-15 (light by a king)"
        establishes: { forcing: non_forcing }
      - id: bal_S_2H
        call: 2H
        priority: 64
        requires: { suits: { H: [5, 13] }, hcp: [10, 15] }
        shows: "balancing: 5+ H, 10-15 (light by a king)"
        establishes: { forcing: non_forcing }

  # ===========================================================================
  # UNCONTESTED CONTINUATIONS harvested as gaps (round 2)
  # ===========================================================================

  - id: responder_after_jump_raise
    description: "Responder over opener's invitational jump raise 1m - 1M - 3M"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 3$M - P - ?"
    rules:
      - id: rjr_game
        call: 4$M
        priority: 55
        requires: { evals: { total_points: [8, 40] } }
        shows: "accepting the invitation (opener showed 16-18)"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: rjr_pass
        call: P
        priority: 50
        requires: { evals: { total_points: [0, 7] } }
        shows: "declining the invitation"
        establishes: { forcing: sign_off }

  - id: responder_after_2NT_jump
    description: "Responder over opener's 18-19 2NT jump rebid"
    expand_pairs: [ { m: C, M: H }, { m: C, M: S }, { m: D, M: H }, { m: D, M: S }, { m: H, M: S } ]
    pattern: "1$m - P - 1$M - P - 2NT - P - ?"
    rules:
      - id: r2ntj_3$M
        call: 3$M
        priority: 57
        requires: { hcp: [6, 13], suits: { $M: [5, 5] } }
        shows: "5 $M opposite 18-19: offering the major before 3NT"
        establishes: { forcing: one_round }
      - id: r2ntj_3NT
        call: 3NT
        priority: 55
        requires: { hcp: [6, 12], not: { suits: { $M: [5, 13] } } }
        shows: "game opposite 18-19, no 5-card major"
        establishes: { forcing: sign_off }
      # opposite a shown 18-19 the arithmetic is known exactly: 15+ makes 33
      # combined (slam), 13-14 makes 31-32 (invite it, opener accepts on 19).
      # The old cap of 13 left every strong responder with no rule at all -
      # 3NT was bid on 35 combined while BEN bid the making 6NT.
      - id: r2ntj_4NT_quant
        call: 4NT
        priority: 56
        requires: { hcp: [13, 14], evals: { semi_balanced: [1, 1] } }
        shows: "quantitative: 31-32 combined, opener bids slam with 19"
        establishes: { forcing: non_forcing }
        alertable: true
      - id: r2ntj_6NT
        call: 6NT
        priority: 57
        requires: { hcp: [15, 40], evals: { controls: [5, 12] } }
        shows: "33+ combined and the controls to match: bidding the slam"
        establishes: { forcing: sign_off }
      - id: r2ntj_4M
        call: 4$M
        priority: 56
        requires: { hcp: [6, 13], suits: { $M: [6, 13] } }
        shows: "game with a 6+ card suit opposite 18-19"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: r2ntj_pass
        call: P
        priority: 40
        requires: { hcp: [0, 5] }
        shows: "bust: even 18-19 opposite may not make 3NT"
        establishes: { forcing: sign_off }

  - id: opener_accepts_quant_over_2NT_jump
    description: "Opener over responder's quantitative 4NT (after the 18-19 2NT jump)"
    expand_pairs: [ { m: C, M: H }, { m: C, M: S }, { m: D, M: H }, { m: D, M: S }, { m: H, M: S } ]
    pattern: "1$m - P - 1$M - P - 2NT - P - 4NT - P - ?"
    rules:
      - id: q2ntj_6NT
        call: 6NT
        priority: 60
        requires: { hcp: [19, 40] }
        shows: "accepting with the top of 18-19"
        establishes: { forcing: sign_off }
      - id: q2ntj_pass
        call: P
        priority: 50
        requires: {}
        shows: "declining with 18"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  - id: responder_after_minor_rebid
    description: "Responder over opener's simple 2m rebid (6+ suit, 12-15)"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2$m - P - ?"
    rules:
      - id: rmr_pass
        call: P
        priority: 50
        requires: { hcp: [6, 10] }
        shows: "no game interest opposite a minimum rebid"
        establishes: { forcing: sign_off }
      - id: rmr_2M
        call: 2$M
        priority: 52
        requires: { hcp: [6, 10], suits: { $M: [6, 13] } }
        shows: "to play: 6+ $M"
        establishes: { forcing: sign_off }
      - id: rmr_2NT
        call: 2NT
        priority: 53
        requires: { hcp: [11, 12] }
        shows: "invitational, 11-12"
        establishes: { forcing: invitational }
      - id: rmr_3m
        call: 3$m
        priority: 54
        requires: { hcp: [10, 12], suits: { $m: [3, 13] } }
        shows: "invitational raise of the rebid suit"
        establishes: { forcing: invitational, agreed_suit: $m }
      - id: rmr_3M
        call: 3$M
        priority: 56
        requires: { hcp: [10, 12], suits: { $M: [6, 13] } }
        shows: "invitational with a six-card $M: the major, not notrump"
        establishes: { forcing: invitational }
      - id: rmr_4M
        call: 4$M
        priority: 57
        requires: { hcp: [6, 12], suits: { $M: [7, 13] }, features: [ "two_of_top3($M)" ] }
        shows: "a self-sufficient seven-card $M: game"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: rmr_3NT
        call: 3NT
        priority: 55
        requires: { hcp: [13, 18] }
        shows: "to play"
        establishes: { forcing: sign_off }

  - id: responder_after_1S_rebid
    description: "Responder over opener's 1S second suit (1m - 1H - 1S)"
    expand: { m: [C, D] }
    pattern: "1$m - P - 1H - P - 1S - P - ?"
    rules:
      - id: r1sr_pass
        call: P
        priority: 48
        requires: { hcp: [6, 9], suits: { S: [4, 13] } }
        shows: "weak with a spade fit: playing 1S"
        establishes: { forcing: sign_off }
      - id: r1sr_raise
        call: 2S
        priority: 52
        requires: { hcp: [6, 9], suits: { S: [4, 13] } }
        shows: "raise: 4 spades, 6-9"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: r1sr_1NT
        call: 1NT
        priority: 50
        requires: { hcp: [6, 10], not: { suits: { S: [4, 13] } } }
        shows: "6-10, no spade fit"
        establishes: { forcing: sign_off }
      - id: r1sr_2NT
        call: 2NT
        priority: 51
        requires: { hcp: [11, 12], not: { suits: { S: [4, 13] } } }
        shows: "invitational, 11-12"
        establishes: { forcing: invitational }
      - id: r1sr_3NT
        call: 3NT
        priority: 53
        requires: { hcp: [13, 18], not: { suits: { S: [4, 13] } } }
        shows: "to play"
        establishes: { forcing: sign_off }
      - id: r1sr_raise_inv
        call: 3S
        priority: 54
        requires: { evals: { total_points: [10, 12] }, suits: { S: [4, 13] } }
        shows: "invitational raise: 4 spades, 10-12"
        establishes: { forcing: invitational, agreed_suit: S }
      - id: r1sr_game
        call: 4S
        priority: 55
        requires: { evals: { total_points: [13, 40] }, suits: { S: [4, 13] } }
        shows: "game raise: 4 spades, 13+"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: r1sr_2H
        call: 2H
        priority: 49
        requires: { hcp: [6, 9], suits: { H: [6, 13] } }
        shows: "to play: 6+ hearts"
        establishes: { forcing: sign_off }

  - id: nt2_stayman_placement
    description: "Responder places the game after 2NT - 3C Stayman"
    pattern: "2NT - P - 3C - P - 3(D|H|S) - P - ?"
