  # ===========================================================================
  # THEY DOUBLED OUR CALL
  #
  # Every generic context above requires the standing call to be a bid or a
  # pass, so the whole "they doubled us" family - opener re-acting over a
  # balancing double, advancer over a penalty double of partner's overcall,
  # a runout from a doubled 1NT - had no agreements at all and fell through
  # to an undiscussed fallback.  These are the ordinary ones.
  #
  # `we_bid_last` keeps every rule pointed at OUR doubled contract; if the
  # standing bid were theirs the double would be partner's, which is a
  # different toolkit (advancing a takeout double).  `we_hold_contract` then
  # splits the two roles, and they are genuinely different auctions:
  #
  #   my own call doubled  - usually their balance of a partscore I opened.
  #     Partner has already limited themselves, so a second suit is
  #     constructive: I am steering us to the right strain, and four cards
  #     of any quality will do.  With a minimum, pass and play it there.
  #
  #   partner's call doubled - a penalty double aimed at partner.  Now a suit
  #     of mine is an escape: it needs real length because we are running to
  #     it, not choosing it, and the hand may be worthless.
  # ===========================================================================

  - id: general_their_double
    description: "General agreements after the opponents double our call"
    pattern: "... - X - ?"
    rules:
      # The redouble ranks BELOW the descriptive calls on purpose: with a
      # sixth trump or a suit to show, showing it beats announcing strength,
      # so XX is what is left when nothing else describes the hand.
      #
      # There is deliberately no companion rule for "partner's call was
      # doubled and I hold values".  It was authored on principle last round
      # and the next thousand deals convicted it: 31 disagreements, 27 of
      # them with BEN confident and 16 of those saying simply "pass".  A
      # redouble of a double aimed at partner is a specialised call, not a
      # general agreement, and the generic rulebook is better off silent.
      - id: xd_XX_extras
        call: XX
        priority: 23
        when: { we_bid_last: true, we_hold_contract: true }
        requires:
          evals: { total_points: [19, 40] }
        shows: "redouble: extra values, we are not being pushed out of this auction"
        establishes: { forcing: one_round }

      # Rebidding my own doubled suit is a length statement, not a strength
      # one: with six of them the double is far less dangerous than a
