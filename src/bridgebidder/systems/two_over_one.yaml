  # Responder's actions over their 1NT overcall of partner's major - the
  # position had NO context at all, so five-card support passed out 1NT
  # undoubled with game on our side.
  - id: resp_over_their_1NT
    description: "Responder after 1M - (1NT overcall)"
    expand: { M: [H, S] }
    pattern: "1$M - 1NT - ?"
    rules:
