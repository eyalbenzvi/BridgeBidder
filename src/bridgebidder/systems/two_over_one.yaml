  # ===========================================================================
  # RESPONSES TO 1C / 1D (uncontested)
  # ===========================================================================

  - id: resp_1m
    description: "Responses to a minor-suit opening, no interference"
    expand: { m: [C, D] }
    pattern: "1$m - P - ?"
    rules:
      - id: r1m_1H
        call: 1H
        priority: 76
        requires:
          all_of:
            - any_of:
                - suits: { H: [4, 13] }
                  evals: { "suit_diff(H,S)": [0, 13] }
                - suits: { H: [4, 4], S: [4, 4] }
            # a SIX-card major answers a minor opening on any values: passing
            # 1D with eight hearts and a diamond void is not a style choice
            - any_of:
                - hcp: [6, 40]
                - hcp: [3, 40]
                  suits: { H: [6, 13] }
        shows: "4+ hearts, 6+ HCP (up the line), or a six-card suit on 3+"
        establishes: { forcing: one_round }
      # Priority 77, above r1m_1H's 76: HIGHER OF EQUAL LENGTH is the system's
      # own opening rule and was never carried to the responses, so five-five
      # and six-six in the majors both answered 1H.  Both rules were soft-
      # missing their suit_diff gate by exactly one card (0.8 apiece) and 1H
      # won on priority alone - priority only separates candidates that both
      # fit >= 0.9, so the equal-length case has to FIT here, which is what the
      # second branch does.  4-4 (up the line, 1H) and every unequal holding
      # are untouched: they miss this rule's gates and r1m_1H still fits 1.00.
      # Reviewer A proposed this repair in round 7; it was never implemented
      # and no scenario was locked, so two corpora have now found it.
      - id: r1m_1S
        call: 1S
        priority: 77
        requires:
          suits: { S: [4, 13] }
          any_of:
            - evals: { "suit_diff(S,H)": [1, 13] }
              any_of:
                - hcp: [6, 40]
                - hcp: [3, 40]
                  suits: { S: [6, 13] }
                - hcp: [5, 40]
                  suits: { S: [5, 13] }
                  evals: { singleton_or_void: [1, 1] }
            # five-five or longer in the majors: bid the spades and rebid hearts
            - suits: { S: [5, 13], H: [5, 13] }
              evals: { "suit_diff(S,H)": [0, 0] }
              hcp: [4, 40]
        shows: "4+ spades longer than hearts, five-five in the majors, or a six-card suit on 3+"
        establishes: { forcing: one_round }
      - id: r1m_2over1
        call: 2C
        priority: 70
        requires:
          hcp: [12, 40]
          suits: { C: [4, 13] }
        shows: "2/1 game forcing: 4+ clubs, 12+ HCP"
        establishes: { forcing: game_forcing }
        when: { passed_hand: false }
      - id: r1m_1NT
        call: 1NT
        priority: 45
        requires:
          hcp: [6, 10]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "6-10 HCP, no 4-card major"
        establishes: { forcing: non_forcing }
      - id: r1m_raise3
        call: 3$m
        priority: 52
        requires:
          hcp: [10, 12]
          suits: { $m: [5, 13] }
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "limit raise: 5+ $m support, 10-12 HCP, no 4-card major"
        establishes: { forcing: invitational, agreed_suit: $m }
      - id: r1m_2NT
        call: 2NT
        priority: 54
        requires:
          hcp: [11, 12]
          balanced: true
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "invitational: 11-12 balanced, no 4-card major"
        establishes: { forcing: invitational }
      - id: r1m_3NT
        call: 3NT
        priority: 55
        requires:
          hcp: [13, 17]
          balanced: true
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "13-15 balanced, no 4-card major"
        establishes: { forcing: sign_off }
      - id: r1m_pass
        call: P
        priority: 15
        requires: { hcp: [0, 5] }
        shows: "0-5 HCP: too weak to respond"
        establishes: { forcing: sign_off }

  # 1D-specific extra: 2D is a diamond raise, 2C is the 2/1 (handled above for
  # the clubs case).  For 1D the 2/1 bid is 2C; expand covers 2C above only for
  # the 1C opening incorrectly, so override here.
  - id: resp_1D_raise
    description: "Simple raise of 1D (the 1C raise would collide with the 2C 2/1)"
    pattern: "1D - P - ?"
    rules:
      - id: r1D_raise2
