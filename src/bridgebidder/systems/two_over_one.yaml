  # ===========================================================================
  # SLAM TRY IN AN ORDINARY AUCTION
  #
  # The RKC ask lived behind two gates - a recorded trump agreement and a
  # game force - and in the BEN match neither held in the position that
  # actually matters.  With a fit and twenty points the generic raise simply
  # jumped to game and the auction died: on the 117 boards of that match
  # where a slam was available we stopped at the four level 61 times and
  # asked for keycards 15 times, while BEN bid 49 slams to our 11.
  #
  # So the ask is available here too, in the same position as the game raise
  # and ranked above it, on the values that justify hearing the answer: a
  # eight-card fit, seventeen points of my own, two aces or the equivalent,
  # and thirty-one counting what partner has actually shown.  The auction has to
  # be at the two level or higher first - 4NT over a one-level bid is a
  # guess, not a question.
  #
  # The nine-trump gate is doing the real work, and it was chosen the hard
  # way.  Point count alone cannot tell a slam try from a game bid here: the
  # hands in the corpus that SHOULD bid game were, if anything, stronger in
  # points than the ones with a slam on.  What separates them is the fit.
  #
  # When partner has shown more than one suit, WHICH suit 4NT agrees must be
  # decided by something partner can see - the reply and the final contract
  # both hang on it, and the asker's own holding is invisible across the
  # table.  An attempt to prefer the majors by priority cost a measured 53
  # IMPs in one thousand boards: a hand with one spade "agreed" partner's
  # spades because priority is hand-blind.  The honest, auction-visible rule
  # is partner's LAST suit bid - the live trump proposal - and it read every
  # one of those wrecked boards correctly.  Hence the partner_last_suit gate.
  # ===========================================================================

  # ===========================================================================
  # GENERIC PULL/SIT OVER PARTNER'S DOUBLE - the third review in a row hit
  # the same species: a textbook double (reopening, takeout, cooperative)
  # answered by an advancer with no matching rule, who "sat" the double on
  # 0-2 trumps for -670.  The authored advance ladders shadow this context
  # per-call where they exist; this is the floor beneath ALL of them.
  # Sitting is a positive decision (trump stack behind the bid); pulling to
  # a 4+ card suit is the default with weakness.
  # ===========================================================================

  # ===========================================================================
  # ROUND-4 MISSING AGREEMENTS: invitations and responses answered by
  # silence, and continuation floors for calls that had none.
  # ===========================================================================

  - id: opener_over_fourth_seat_balance
    description: "Opener when the opponents balance our passed-out one-level contract"
    expand: { x: [C, D, H, S] }
    pattern: "1$x - P - P - bid - ?"
    rules:
      - id: o4b_X_$x
        call: X
        priority: 56
        requires: { hcp: [15, 40], evals: { max_their_suit_length: [0, 3] } }
        shows: "extras: we are not selling out to their balance"
        establishes: { forcing: one_round }
      - id: o4b_1NT_$x
        call: 1NT
        priority: 55
        when: { cheapest_in_suit: true }
        requires: { hcp: [18, 19], evals: { weakest_their_stopper: [0.9, 9], semi_balanced: [1, 1] } }
        shows: "18-19 balanced with their suit stopped"
        establishes: { forcing: non_forcing }
      - id: o4b_rebid_$x
        call: 2$x
        priority: 54
        when: { my_suit: $x, cheapest_in_suit: true }
        requires: { suits: { $x: [6, 13] }, hcp: [13, 40] }
        shows: "rebidding my own 6-card suit over their balance"
        establishes: { forcing: non_forcing }

  - id: sacrifice_double_over_our_game
    description: "They sacrificed over our freely-bid game: double them"
    pattern: "... - bid - ?"
    rules:
      - id: ch_sac_X
        call: X
        priority: 44
        when: { their_last_bid_suit: true, we_bid_last: false, side_has_acted: true,
                standing_bid_level: [5, 6] }
        requires:
          evals: { quick_tricks: [2.5, 12], max_their_suit_length: [0, 2] }
        shows: "doubling their sacrifice over our game: quick tricks, no trump length"
        establishes: { forcing: non_forcing }

  - id: opener_over_2NT_response
    description: "Opener after the natural 2NT response to a minor (11-12)"
    expand: { m: [C, D] }
    pattern: "1$m - P - 2NT - P - ?"
    rules:
      - id: o2nresp_3NT_$m
        call: 3NT
        priority: 56
        requires: { hcp: [13, 17] }
        shows: "accepting the 11-12 invite"
        establishes: { forcing: sign_off }
      - id: o2nresp_pass_$m
        call: P
        priority: 55
        requires: { hcp: [0, 12] }
        shows: "declining the invite: minimum"
        establishes: { forcing: sign_off }
      - id: o2nresp_quant_$m
        call: 4NT
        priority: 57
        requires: { hcp: [18, 21], evals: { semi_balanced: [1, 1] } }
        shows: "quantitative: 18+ opposite the 11-12 response"
        establishes: { forcing: non_forcing }

  # Jordan 2NT promises FOUR-card support, so opener needs only his own
  # five to know of a nine-card fit - the generic competitive-2NT ladder
  # below demands six because there the 2NT is a natural invite that has
  # shown no support at all.  (A round-3 review asked for exactly this and
  # the edit silently missed: its search used concrete suit letters against
  # template-var rule ids, so a 15-count with AQ932 kept bidding 3NT over
  # partner's limit raise.)
  - id: opener_over_jordan_2NT
    description: "Opener's action over partner's Jordan 2NT (limit raise+ with 4 trumps)"
    expand: { M: [H, S] }
    pattern: "1$M - X - 2NT - P - ?"
    rules:
      - id: ojord_4$M
        call: 4$M
        priority: 64
        requires: { evals: { total_points: [15, 40] } }
        shows: "accepting the limit raise: game in our nine-card fit"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: ojord_3$M
        call: 3$M
        priority: 62
        requires: { evals: { total_points: [12, 14] } }
        shows: "minimum: signing off in three of our suit"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: ojord_slam_4NT
        call: 4NT
        priority: 65
        requires:
          evals: { total_points: [19, 40], controls: [4, 12], "void(any)": [0, 0] }
        shows: "RKC 1430: slam values opposite the limit raise"
        establishes: { forcing: one_round, agreed_suit: $M, asking: keycards }
        alertable: true
        convention: rkc_1430

  - id: opener_over_competitive_2NT
    description: "Opener after 1m - (overcall) - 2NT (natural, invitational)"
    expand: { m: [C, D] }
