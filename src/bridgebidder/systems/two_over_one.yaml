        establishes: { forcing: game_forcing }
        alertable: true

  - id: responder_after_jacoby_reply
    description: "Responder places the contract after the Jacoby reply"
    expand: { M: [H, S] }
    pattern: "1$M - P - 2NT - P - bid - P - ?"
    rules:
      # Duplication shutdown (the oldest slam maxim): K/Q/J opposite the
      # shortness partner just showed are wasted paper, so the hand is worth
      # far less than its point count - sign off in game whatever the range.
      # Aces are exempt (an ace works opposite anything); with working cards
      # instead the cue and keycard rules below stay live as before.
      - id: jac_wasted_signoff
        call: 4$M
        priority: 47
        requires:
          evals: { wasted_in_partner_shortness: [4, 40] }
          # What separates "dead paper, sign off" from "wasted honours but
          # still worth a move" is SHAPE, not point count: a flat nineteen
          # with KQx in partner's short suit is finished, while a shapely
          # twenty with a six-card source of tricks is not.  (A cap at 18
          # alone sent the flat hand asking for keycards - it broke the
          # locked scenario this rule was written for.)
          any_of:
            - evals: { semi_balanced: [1, 1] }
            - evals: { total_points: [0, 18] }
        shows: "wasted honors opposite the shown shortness: signing off in game"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: jac_place_4$M
        call: 4$M
        priority: 40
        requires: { evals: { total_points: [13, 16] } }
        shows: "minimum game-force: signing off in game"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: jac_rkc
        call: 4NT
        priority: 45
        requires:
          evals: { total_points: [17, 40], controls: [4, 12], rule_of_26: [31, 99],
                    "lott_total_trumps(agreed)": [8, 26] }
          any_of:
            - evals: { "void(any)": [0, 0], worthless_doubleton: [0, 0] }
            - evals: { "keycards(agreed)": [3, 5] }
        shows: "RKC 1430 for $M"
        establishes: { forcing: one_round, asking: keycards }
        alertable: true
        convention: rkc_1430

  # ===========================================================================
