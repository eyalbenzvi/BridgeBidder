  - id: general_balancing_high
    description: "General balancing agreements after their bid is passed round"
    pattern: "... - bid>=3C - P - P - ?"
    when: { we_hold_contract: false }
    rules:
      # The big hand's SECOND action.  side_has_acted:false on the rule
      # below is the anti-triple-double guard, but it also silenced 17-23
      # counts whose first double was answered by a runout or a raise: with
      # the values-still-marked shape the reopening double must exist, and
      # my_last_call_was_double:false is the honest anti-repeat guard (a
      # different hand, or a hand whose last call was a bid, may double).
      - id: balhigh_reopen_X2
        call: X
        priority: 41
        when: { their_last_bid_suit: true, side_has_acted: true, we_bid_last: false,
                my_last_call_was_double: true, we_hold_contract: false }
        requires:
          hcp: [19, 40]
          evals: { max_their_suit_length: [0, 2], longest_suit_length: [0, 5] }
        shows: "a SECOND double: 19+, still nothing to say but takeout"
        establishes: { forcing: one_round }
      - id: balhigh_reopen_X
        call: X
        priority: 41
        # `standing_bid_level: [3]`: you cannot take a FOUR-level contract out
        # for takeout - partner's answer would be at the five level - so above
        # the three level this rule was doubling with shortness and no defence.
        when: { their_last_bid_suit: true, side_has_acted: true, we_bid_last: false,
                my_last_call_was_double: false, we_hold_contract: false,
                standing_bid_level: [3] }
        # The light "extreme shortness reopens a level lighter" branch was on
        # the WRONG SIBLING: balancing a king lighter is a one- and two-level
        # agreement, and its low-level twin `ballow_reopen_X` never had it.
        # At the three level the double commits partner to the FOUR level and
        # partner - who has passed throughout - converts it, so every light one
        # became a penalty double made on takeout shape: doubling BECAUSE we
        # have no trump tricks.
        requires:
          hcp: [16, 40]
          evals: { max_their_suit_length: [0, 2], longest_suit_length: [0, 5] }
        shows: "reopening double: 16+, short in their suit, our side already in"
        establishes: { forcing: one_round }
      - id: balhigh_X
        call: X
        priority: 40
        # `side_has_acted: false` is the premise of the bid, not a detail: a
        # balancing double says "the values are marked, partner passed with
        # some of them".  Once our side has already acted - overcalled, or
        # doubled and been passed - none of that is true any more, and the
        # rule was firing a second and third time in the same auction.
        when: { their_last_bid_suit: true, side_has_acted: false }
        requires:
          hcp: [14, 40]
          evals: { standing_suit_length: [0, 2] }
        shows: "balancing double: values are marked opposite a passing partner"
        establishes: { forcing: one_round }
