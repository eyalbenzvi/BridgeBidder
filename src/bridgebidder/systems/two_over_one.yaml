  # ===========================================================================
  # DIRECT-SEAT COMPETITIVE: overcalls & takeout doubles of their 1-level opening
  # (one context per opening suit so jump vs simple overcalls stay distinct)
  # ===========================================================================

  - id: overcalls_of_1C
    description: "Overcalls of their 1C opening"
    pattern: "1C - ?"
    rules:
      - id: oc1C_1NT
        call: 1NT
        priority: 82
        requires: { hcp: [15, 18], balanced: true, features: [ "stopper(C)" ] }
        shows: "1NT overcall: 15-18 balanced with a club stopper"
        establishes: { forcing: non_forcing }
      - id: oc1C_X
        call: X
        priority: 72
        requires:
          evals: { longest_suit_length: [0, 5] }
          # A takeout double asks partner to pick a suit, so it must not be
          # hiding a five-card major of its own: partner will name the other
          # one.  With five, overcall it; the strong branch draws the line at
          # six, where the suit is worth showing on its own.
          any_of:
            - hcp: [11, 16]
              suits: { C: [0, 2], S: [3, 4], H: [3, 4], D: [3, 13] }
            - hcp: [17, 40]
              suits: { S: [0, 5], H: [0, 5] }
        shows: "takeout double: opening values, short clubs, support for the other suits, no five-card major (or any 17+)"
        establishes: { forcing: one_round }
      - id: oc1C_1D
        call: 1D
        priority: 70
        requires: { suits: { D: [5, 13] }, hcp: [8, 16], evals: { suit_quality(D): [1, 9] } }
        shows: "overcall: 5+ diamonds, 8-16"
        establishes: { forcing: non_forcing }
      - id: oc1C_1H
        call: 1H
        priority: 71
        requires: { any_of: [ { suits: { H: [5, 13] }, hcp: [8, 16], evals: { suit_quality(H): [1, 9], "suit_diff(H,S)": [1, 13] } }, { suits: { H: [6, 13] }, hcp: [7, 16] }, { suits: { H: [5, 13] }, hcp: [12, 16] } ] }
        shows: "overcall: 5+ hearts, 8-16"
        establishes: { forcing: non_forcing }
      - id: oc1C_1S
        call: 1S
        priority: 71
        requires: { any_of: [ { suits: { S: [5, 13] }, hcp: [8, 16], evals: { suit_quality(S): [1, 9] } }, { suits: { S: [6, 13] }, hcp: [7, 16] }, { suits: { S: [5, 13] }, hcp: [12, 16] } ] }
        shows: "overcall: 5+ spades, 8-16"
        establishes: { forcing: non_forcing }
      - id: oc1C_2D_jump
        call: 2D
        priority: 60
        requires: { suits: { D: [6, 6] }, hcp: [5, 10], features: [ "good_suit(D)" ] }
        shows: "weak jump overcall: 6 diamonds, 5-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_2H_jump
        call: 2H
        priority: 60
        requires: { suits: { H: [6, 6] }, hcp: [5, 10], features: [ "good_suit(H)" ] }
        shows: "weak jump overcall: 6 hearts, 5-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_2S_jump
        call: 2S
        priority: 60
        requires: { suits: { S: [6, 6] }, hcp: [5, 10], features: [ "good_suit(S)" ] }
        shows: "weak jump overcall: 6 spades, 5-10"
        establishes: { forcing: non_forcing }
      - id: oc1C_pass
        call: P
        priority: 25
        requires: { hcp: [0, 15] }
        shows: "nothing suitable over 1C"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

