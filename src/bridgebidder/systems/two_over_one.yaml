  # --- opener after Jordan 2NT in the contested auction (b0011A: a generic
  # 3C set clubs as trumps and the keycard answer was given for clubs)
  - id: opener_after_jordan
    description: "Opener after 1M - (X) - 2NT (Jordan, 4+ trumps, limit raise or better) - P"
    expand: { M: [H, S] }
    pattern: "1$M - X - 2NT - P - ?"
    rules:
      - id: oaj_sign_off
        call: 3$M
        priority: 60
        requires: { hcp: [10, 14] }
        shows: "minimum: partner passes with a limit raise, bids game with more"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: oaj_game
        call: 4$M
        priority: 61
        requires: { hcp: [15, 21] }
        shows: "accepting the limit raise: game"
        establishes: { forcing: sign_off, agreed_suit: $M }

  - id: responder_after_jordan_sign_off
    description: "Responder after 1M - (X) - 2NT - P - 3M - P"
    expand: { M: [H, S] }
    pattern: "1$M - X - 2NT - P - 3$M - P - ?"
    rules:
      - id: rajs_pass
        call: P
        priority: 60
        requires: { evals: { total_points: [10, 12] } }
        shows: "limit raise opposite a minimum: staying in 3"
        establishes: { forcing: sign_off }
      - id: rajs_game
        call: 4$M
        priority: 61
        requires: { evals: { total_points: [13, 40] } }
        shows: "game values opposite the minimum"
        establishes: { forcing: sign_off, agreed_suit: $M }

  # --- a reopening double of my own contract (b0035B, b0066A, b0096B): with
  # values and partner silent there is nothing to run from
  - id: after_reopening_double
    description: "My bid, two passes, RHO doubles in the pass-out seat"
    pattern: "... - P - P - X - ?"
    rules:
      # Restricted to a doubled NOTRUMP call of ours: with a suit contract the
      # harvested agreements (second suit, six-card rebid, redouble with
      # extras) were confirmed against BEN and stay in charge.
      - id: ard_sit
        call: P
        priority: 40
        when: { we_bid_last: true, we_hold_contract: true, standing_bid_strain: [NT] }
        requires: { hcp: [10, 40] }
        shows: "sitting for their reopening double of our notrump: values, partner has passed"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

