  # =========================================================================
  # GENERAL AGREEMENTS (round-5 harvest)
  #
  # The competitive and constructive toolkit every partnership plays without
  # discussion, expressed as DATA.  Suit role ("partner's suit", "an unbid
  # suit") and level ("the cheapest bid available in this suit") are auction
  # facts, so they are hard `when:` gates rather than soft hand features.
  # Priorities are low, so any specific context above always wins; these
  # exist so ordinary positions produce an explained systemic call instead of
  # an undiscussed fallback.
  # =========================================================================

  # MEASURED AND REVERTED (round 12).  "Contested" really is a property of the
  # auction rather than of RHO's last call: the pattern below means "RHO just
  # bid", so the moment RHO passes the position falls to
  # `general_uncontested_continuation`, whose pattern `... - P - ?` only means
  # "RHO passed".  Reviewer B measured that slice at 465 tables, mean -1.14
  # against a corpus mean of -0.80 - the largest single population in the
  # review, and the diagnosis is correct.  Routing it here anyway
  # (`also_patterns: ["... - bid<3C - P - ?"]` plus `is_competitive: true`)
  # measured **-59 paired and -106 held-out** and broke five locked scenarios:
  # a context that DEFINES a call takes over interpreting it, so every
  # behaviour authored in the uncontested continuation - the doubler's raise of
  # a three-level advance, the refusal to bid game opposite a preemptive raise
  # - silently disappeared.  The toolkit swap is not the repair; porting
  # individual rungs under `when: { is_competitive: true }` is, and that is
  # what `uc_raise_lott4_$M` does.
  - id: general_competitive_low
    description: "General competitive agreements after their 1- or 2-level bid"
    pattern: "... - bid<3C - ?"
    when: { we_hold_contract: false }
    rules:
      # double-then-raise shows 17+: without these a 19-count passed the
      # 0-8 advance of its own takeout double with game on
      - id: cl_doubler_raise_C
        call: 2C
        priority: 34
        when: { partner_suit: C, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { C: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support (the double promised less)"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: cl_doubler_raise3_C
        call: 3C
        priority: 33
        when: { partner_suit: C, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { C: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support"
        establishes: { forcing: non_forcing, agreed_suit: C }
      # double-then-raise shows 17+: without these a 19-count passed the
      # 0-8 advance of its own takeout double with game on
      - id: cl_doubler_raise_D
        call: 2D
        priority: 34
        when: { partner_suit: D, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { D: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support (the double promised less)"
        establishes: { forcing: non_forcing, agreed_suit: D }
      - id: cl_doubler_raise3_D
        call: 3D
        priority: 33
        when: { partner_suit: D, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { D: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support"
        establishes: { forcing: non_forcing, agreed_suit: D }
      # double-then-raise shows 17+: without these a 19-count passed the
      # 0-8 advance of its own takeout double with game on
      - id: cl_doubler_raise_H
        call: 2H
        priority: 34
        when: { partner_suit: H, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { H: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support (the double promised less)"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: cl_doubler_raise3_H
        call: 3H
        priority: 33
        when: { partner_suit: H, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { H: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support"
        establishes: { forcing: non_forcing, agreed_suit: H }
      # double-then-raise shows 17+: without these a 19-count passed the
      # 0-8 advance of its own takeout double with game on
      - id: cl_doubler_raise_S
        call: 2S
        priority: 34
        when: { partner_suit: S, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { S: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support (the double promised less)"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: cl_doubler_raise3_S
        call: 3S
        priority: 33
        when: { partner_suit: S, cheapest_in_suit: true, my_last_call_was_double: true, we_hold_contract: false }
        requires: { suits: { S: [4, 13] }, evals: { total_points: [17, 19] } }
        shows: "raise of the advance: 17-19 with 4-card support"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: cl_doubler_game_H
        call: 4H
