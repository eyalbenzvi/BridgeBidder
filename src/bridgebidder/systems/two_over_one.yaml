  - id: general_balancing_high
    description: "General balancing agreements after their bid is passed round"
    pattern: "... - bid>=3C - P - P - ?"
    when: { we_hold_contract: false }
    rules:
      - id: balhigh_X
        call: X
        priority: 40
        # `side_has_acted: false` is the premise of the bid, not a detail: a
        # balancing double says "the values are marked, partner passed with
        # some of them".  Once our side has already acted - overcalled, or
        # doubled and been passed - none of that is true any more, and the
        # rule was firing a second and third time in the same auction.
        when: { their_last_bid_suit: true, side_has_acted: false }
        requires:
          hcp: [14, 40]
          evals: { "suit_length(their)": [0, 2] }
        shows: "balancing double: values are marked opposite a passing partner"
        establishes: { forcing: one_round }
      - id: balhigh_raise_C2
        call: 2C
        priority: 30
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [5, 10], "lott_total_trumps(C)": [7, 26] }
        shows: "competitive raise of partner's C: 3+ trumps, 5-10 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: balhigh_raise_C3
        call: 3C
        priority: 31
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [10, 40], rule_of_26: [22, 99], "lott_total_trumps(C)": [8, 26] }
        shows: "competitive raise of partner's C: 3+ trumps, 10+ support points, 8+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: balhigh_raise_C4
        call: 4C
        priority: 27
        when: { partner_suit: C }
        requires:
          # Four of a minor is not game, so it takes a real fit to be worth
          # bidding at all: ten combined trumps, and the minor has to be my
          # longest suit or the major is the bid.
          suits: { C: [4, 13] }
          evals: { total_points: [11, 40], rule_of_26: [25, 99], "lott_total_trumps(C)": [10, 26],
                    "suit_diff(C, H)": [0, 13], "suit_diff(C, S)": [0, 13] }
        shows: "competitive raise of partner's C: 3+ trumps, 13+ support points opposite partner's shown range"
        establishes: { forcing: non_forcing, agreed_suit: C }
