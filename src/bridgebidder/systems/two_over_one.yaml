  - id: opener_rebid_1m_1NT
    description: "Opener's rebid after 1m - 1NT (6-10 semi-forcing response)"
    # Also had no context: five boards were passed out in 1NT with 17-18
    # opposite, because the generic toolkit's uc_pass was the only fit.
    expand: { m: [C, D] }
    pattern: "1$m - P - 1NT - P - ?"
    rules:
      - id: or1mn_pass_$m
        call: P
        priority: 50
        requires: { hcp: [12, 16] }
        shows: "minimum: 1NT is as good a spot as any"
        establishes: { forcing: sign_off }
      - id: or1mn_rebid_$m
        call: 2$m
        priority: 52
        requires: { hcp: [12, 15], suits: { $m: [6, 13] } }
        shows: "6+ $m, minimum"
        establishes: { forcing: sign_off }
      - id: or1mn_jump_$m
        call: 3$m
        priority: 54
        requires: { hcp: [16, 19], suits: { $m: [6, 13] } }
        shows: "6+ $m, 16-19: invitational"
        establishes: { forcing: invitational, agreed_suit: $m }
      - id: or1mn_2NT_$m
        call: 2NT
        priority: 56
        requires: { hcp: [18, 19], evals: { semi_balanced: [1, 1] } }
        shows: "18-19 balanced: invitational opposite the 6-10 response"
        establishes: { forcing: invitational }
      - id: or1mn_reverse_H_$m
        call: 2H
        priority: 58
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires: { hcp: [17, 40], suits: { H: [4, 13] } }
        shows: "reverse: 4+ hearts and 17+, forcing one round"
        establishes: { forcing: one_round }
      - id: or1mn_reverse_S_$m
        call: 2S
        priority: 58
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires: { hcp: [17, 40], suits: { S: [4, 13] } }
        shows: "reverse: 4+ spades and 17+, forcing one round"
        establishes: { forcing: one_round }

  - id: responder_after_1S_rebid
    description: "Responder over opener's 1S second suit (1m - 1H - 1S)"
    expand: { m: [C, D] }
    pattern: "1$m - P - 1H - P - 1S - P - ?"
    rules:
      - id: r1sr_pass
        call: P
        priority: 48
        requires: { hcp: [6, 9], suits: { S: [4, 13] } }
        shows: "weak with a spade fit: playing 1S"
        establishes: { forcing: sign_off }
      - id: r1sr_raise
        call: 2S
        priority: 52
        requires: { hcp: [6, 9], suits: { S: [4, 13] } }
        shows: "raise: 4 spades, 6-9"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: r1sr_1NT
        call: 1NT
        priority: 50
        requires: { hcp: [6, 10], not: { suits: { S: [4, 13] } } }
        shows: "6-10, no spade fit"
        establishes: { forcing: sign_off }
      - id: r1sr_2NT
        call: 2NT
        priority: 51
        requires: { hcp: [11, 12], not: { suits: { S: [4, 13] } } }
        shows: "invitational, 11-12"
        establishes: { forcing: invitational }
      - id: r1sr_3NT
        call: 3NT
        priority: 53
        requires: { hcp: [13, 18], not: { suits: { S: [4, 13] } } }
        shows: "to play"
        establishes: { forcing: sign_off }
      - id: r1sr_raise_inv
        call: 3S
        priority: 54
        requires: { evals: { total_points: [10, 12] }, suits: { S: [4, 13] } }
        shows: "invitational raise: 4 spades, 10-12"
        establishes: { forcing: invitational, agreed_suit: S }
      # capped at 18: nineteen-plus opposite an opening hand is slam
      # territory and belongs to the keycard rules, not a sign-off
      - id: r1sr_game
        call: 4S
        priority: 55
        requires: { evals: { total_points: [13, 18] }, suits: { S: [4, 13] } }
        shows: "game raise: 4 spades, 13-18"
        establishes: { forcing: sign_off, agreed_suit: S }
      # priority above the NT rebids: with six hearts the suit is the bid
      # (a singleton-spade six-bagger was rebidding 1NT, -300)
      - id: r1sr_2H
        call: 2H
        priority: 56
        requires: { hcp: [6, 9], suits: { H: [6, 13] } }
        shows: "to play: 6+ hearts"
        establishes: { forcing: sign_off }
      - id: r1sr_3H
        call: 3H
        priority: 57
        requires: { suits: { H: [6, 13] }, hcp: [10, 12] }
        shows: "6+ hearts, invitational"
        establishes: { forcing: invitational }
      - id: r1sr_4H
        call: 4H
        priority: 58
        # every other rung in this context stops at 18; this one alone ran to
        # 40, so a 20-count with six hearts signed off in game and the soft
        # model never looked at a slam try
        requires: { suits: { H: [6, 13] }, hcp: [13, 18] }
        shows: "6+ hearts, game values"
        establishes: { forcing: sign_off, agreed_suit: H }


  - id: nt2_stayman_placement
    description: "Responder places the game after 2NT - 3C Stayman"
    pattern: "2NT - P - 3C - P - 3(D|H|S) - P - ?"
    rules:
      - id: nt2_stm_4H
        call: 4H
        priority: 60
        when: { standing_bid_strain: [H] }
        requires: { suits: { H: [4, 13] } }
        shows: "raising to game with the heart fit"
        establishes: { forcing: sign_off, agreed_suit: H }
      - id: nt2_stm_4S
        call: 4S
        priority: 59
        when: { standing_bid_strain: [S] }
        requires: { suits: { S: [4, 13] } }
        shows: "raising to game with the spade fit"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: nt2_stm_3NT
        call: 3NT
        priority: 55
        requires: {}
        shows: "no fit with opener's major: 3NT"
        establishes: { forcing: sign_off }

  - id: responder_over_game_try
    description: "Responder over opener's game try 1M - 2M - 3M"
    expand: { M: [H, S] }
    pattern: "1$M - P - 2$M - P - 3$M - P - ?"
    rules:
      - id: rgt_accept
        call: 4$M
        priority: 55
        requires: { evals: { total_points: [8, 40] } }
        shows: "accepting the game try (maximum raise)"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: rgt_decline
        call: P
        priority: 50
        requires: { evals: { total_points: [0, 7] } }
        shows: "declining the game try (minimum raise)"
        establishes: { forcing: sign_off }

  - id: responder_after_jump_rebid
    description: "Responder over opener's invitational jump rebid 1m - 1M - 3m"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 3$m - P - ?"
    rules:
      # Opposite a narrow 16-18 the arithmetic is exact, the same way it is
      # opposite the 18-19 2NT jump: fourteen is worth a quantitative invite
      # (14 + 18 = 32) and sixteen bids the slam itself.  Before the split
      # a sixteen-count bid a dead 3NT with 32-34 combined on the table.
      # full band kept as the backstop: the quantitative rules outrank this
      # in their bands, and a strong hand whose SHAPE fails their gates
      # (a 4-4-4-1 fifteen-count, in the corpus) must still have a bid
      - id: rjrb_3NT
        call: 3NT
        priority: 55
        requires: { hcp: [10, 16] }
        shows: "game opposite the 16-18 jump rebid"
        establishes: { forcing: sign_off }
      - id: rjrb_6NT
        call: 6NT
        priority: 57
        requires: { hcp: [16, 21], evals: { semi_balanced: [1, 1], controls: [4, 12] }, not: { suits: { $M: [6, 13] } } }
        shows: "16+ opposite the 16-18 jump rebid: 32+ combined"
        establishes: { forcing: sign_off }
      - id: rjrb_4NT
        call: 4NT
        priority: 56
        requires: { hcp: [14, 15], evals: { semi_balanced: [1, 1] }, not: { suits: { $M: [6, 13] } } }
        shows: "quantitative: 14-15 opposite 16-18, inviting slam"
        establishes: { forcing: non_forcing }
        alertable: true
      - id: rjrb_3M
        call: 3$M
        priority: 54
        requires: { hcp: [10, 16], suits: { $M: [6, 13] } }
        shows: "6+ $M, forcing"
        establishes: { forcing: one_round }
      - id: rjrb_pass
        call: P
        priority: 50
        requires: { hcp: [6, 9] }
        shows: "no game opposite 16-18"
        establishes: { forcing: sign_off }

  # ===========================================================================
  # SLAM ARITHMETIC OPPOSITE OPENER'S STRONG REBIDS
  #
  # The same species of fix as "opposite the 18-19 2NT jump" from the 10k
  # round: whenever opener's rebid pins his strength into a narrow band,
  # responder can place or invite by simple addition - and every one of
  # these positions had NO rule above the game blast, so 32-combined hands
  # were parking in 3NT or 4M.  Each block is: direct slam on the values
  # that guarantee it, a quantitative invite one notch below, and an accept
  # rule keyed to the top of opener's shown range.
  # ===========================================================================

  - id: responder_after_jump_shift
    description: "Responder opposite opener's 18-21 jump shift (1D - 1M - 3C)"
    expand: { M: [H, S] }
    pattern: "1D - P - 1$M - P - 3C - P - ?"
    rules:
      - id: rjs_6NT_$M
        call: 6NT
        priority: 60
        requires: { hcp: [14, 21], evals: { semi_balanced: [1, 1], controls: [4, 12] }, not: { suits: { $M: [6, 13] } } }
        shows: "14+ opposite the 18-21 jump shift: 32+ combined"
        establishes: { forcing: sign_off }
      - id: rjs_4NT_$M
        call: 4NT
        priority: 58
        requires: { hcp: [12, 13], evals: { semi_balanced: [1, 1] }, not: { suits: { $M: [6, 13] } } }
        shows: "quantitative: 12-13 opposite 18-21, inviting slam"
        establishes: { forcing: non_forcing }
        alertable: true
      # full band, no shape gate: this is the backstop under the two rules
      # above, and a hand that fails their gates must still have a bid
      - id: rjs_3NT_$M
        call: 3NT
        priority: 55
        requires: { hcp: [6, 21] }
        shows: "placing the game opposite 18-21"
        establishes: { forcing: sign_off }

  # The answering seat for the 1H - 1S jump shift above.  A ladder and the
  # context that answers it are ONE fix: authored apart, opener's jump falls to
  # the generic toolkit.  Mirrors responder_after_jump_shift rung for rung, and
  # its 3NT carries the full band with no shape gate, so the new context cannot
  # create a hole in what it shadows.
  - id: responder_after_major_jump_shift
    description: "Responder opposite opener's 18-21 jump shift after 1H - 1S"
    expand: { m: [C, D] }
    pattern: "1H - P - 1S - P - 3$m - P - ?"
    rules:
      - id: rmjs_6NT_$m
        call: 6NT
        priority: 60
        requires: { hcp: [14, 21], evals: { semi_balanced: [1, 1], controls: [4, 12] }, not: { suits: { H: [3, 13] } } }
        shows: "14+ opposite the 18-21 jump shift: 32+ combined"
        establishes: { forcing: sign_off }
      - id: rmjs_4H_$m
        call: 4H
        priority: 58
        requires: { suits: { H: [3, 13] }, hcp: [6, 21] }
        shows: "three-card heart support opposite 18-21: the 5-3 game"
        establishes: { forcing: sign_off, agreed_suit: H }
      # Banded by strength, never by SHAPE: a 5-5 hand with a singleton had
      # only the catch-all 3NT and bid it holding a stiff diamond (down three,
      # 6S cold).  The 3NT rung keeps its full band underneath, so this can
      # only add a reading, never subtract one; opener's answer comes from the
      # generic toolkit's raise, which was checked on the motivating board.
      - id: rmjs_3S_$m
        call: 3S
        priority: 56
        requires: { suits: { S: [5, 13] }, evals: { singleton_or_void: [1, 2] } }
        shows: "five spades and a singleton: showing the suit instead of bidding notrump"
        establishes: { forcing: game_forcing }
      - id: rmjs_3NT_$m
        call: 3NT
        priority: 55
        requires: { hcp: [6, 21] }
        shows: "placing the game opposite 18-21"
        establishes: { forcing: sign_off }

  # 2C makes clubs a BID suit, so gf_new_3C's `unbid_suit: C` could never offer
  # a natural club rebid here: a 22-count with five clubs and four hearts had no
  # candidate above fit 0.35 and bid 3H on the four-bagger.  Only 3C is defined;
  # every other call stays with the GF landing contexts that already cover it.
  - id: opener_rebid_2C_2NT
    description: "Opener's rebid after 2C - 2NT (balanced positive)"
    pattern: "2C - P - 2NT - P - ?"
    rules:
      - id: r2cnt_3C_nat
        call: 3C
        priority: 56
        requires: { suits: { C: [5, 13] } }
        shows: "natural, 5+ clubs, game forcing"
        establishes: { forcing: game_forcing }

  # Responder invites with a natural 2NT in a minor-opening auction and opener
  # had no context at all, so the generic three-of-a-minor rebid fired -
  # non-forcing - and was passed out: seventeen points with seven clubs and a
  # diamond void played 3C with 6C cold.  Every generic uc_rebid_$m4 rung
  # carries `cheapest_in_suit`, and 3C IS the cheapest, so that ladder can
  # never climb.  Deliberately ONE rung: 5m is a call the generic toolkit never
  # offers at this node, so this context shadows nothing.  (The pass-versus-3m
  # question genuinely splits the corpus and is left alone.)
  - id: opener_over_invite_2NT_minor
    description: "Opener over responder's 2NT invite in a minor-opening auction"
    expand_pairs:
      - { m: C, M: H, R: 1S }
      - { m: C, M: H, R: 2C }
      - { m: C, M: S, R: 2C }
      - { m: D, M: H, R: 2D }
      - { m: D, M: S, R: 2D }
    pattern: "1$m - P - 1$M - P - $R - P - 2NT - P - ?"
    rules:
      - id: oim2n_5m_$M$R
        call: 5$m
        priority: 61
        requires:
          suits: { $m: [6, 13] }
          # Same floor as the 3NT accept beside it.  The context declines at
          # 10-13 and accepts at 14, so a ceiling of 16 here left 14-15 with a
          # six-card minor and a suit WIDE OPEN no choice but notrump: 1-4-1-7
          # with a stiff king bid 3NT for down two while 5C made eleven.
          hcp: [14, 21]
          # ... but NOT with a running suit.  Lowering the floor alone sent
          # AKQJ976 to five of a minor, and a suit that runs is nine tricks off
          # the top: 3NT is the game, and five of a minor is for the hand whose
          # suit still needs a card from partner.  Measured on the two hands
          # that separate here, suit_quality reads 3.5 against 2.0.
          evals: { weakest_unshown_stopper: [0, 0.5], "suit_quality($m)": [0, 2.5] }
        shows: "no notrump: 6+ $m, 14+, and a suit that still needs help: the minor game"
        establishes: { forcing: sign_off, agreed_suit: $m }
      # The context held that ONE rule, so every hand that was not "6+ minor,
      # 16-21, no stopper anywhere" fell through to the generic toolkit, which
      # rebids the minor at the three level and ends the auction.  An invitation
      # has to be answered: accept with 14+, or with a running minor whose
      # tricks are already counted (AKQJ976 opposite an 11-12 invite is nine
      # tricks and was bidding 3D), decline with a minimum.
      - id: oim2n_3NT_$M$R
        call: 3NT
        priority: 58
        requires:
          any_of:
            - hcp: [14, 21]
            - suits: { $m: [6, 13] }
              evals: { "suit_quality($m)": [3, 9] }
        shows: "accepting the 11-12 invite"
        establishes: { forcing: sign_off }
      - id: oim2n_pass_$M$R
        call: P
        priority: 50
        requires: { hcp: [10, 13] }
        shows: "declining the invite: minimum opener"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  - id: jump_shift_quant_accept
    description: "Opener answers the quantitative 4NT over his 18-21 jump shift"
    expand: { M: [H, S] }
    pattern: "1D - P - 1$M - P - 3C - P - 4NT - P - ?"
    rules:
      - id: rjsq_accept_$M
        call: 6NT
        priority: 60
        requires: { hcp: [20, 21] }
        shows: "maximum jump shift: accepting the slam invite"
        establishes: { forcing: sign_off }
      - id: rjsq_decline_$M
        call: P
        priority: 55
        requires: { hcp: [18, 19] }
        shows: "minimum jump shift: declining"
        establishes: { forcing: sign_off }

  # r1c1d_3D_$M is FORCING one round and had no answering seat at all, so
  # opener's best non-pass candidate fitted 0.28 - below the 0.3 "nothing fits
  # anywhere" threshold - and the documented escape hatch passed the force out.
  # A nineteen-count's forcing jump died in 3D with 6NT cold.
  - id: opener_over_1C1D_3D_jump
    description: "Opener over responder's forcing 3D jump rebid (1C - 1D - 1M - 3D)"
    expand: { M: [H, S] }
    pattern: "1C - P - 1D - P - 1$M - P - 3D - P - ?"
    rules:
      - id: o1c1d3d_rebid_$M
        call: "3$M"
        priority: 59
        requires: { suits: { $M: [5, 13] } }
        shows: "5+ $M opposite the forcing jump"
        establishes: { forcing: game_forcing }
      - id: o1c1d3d_4D_$M
        call: 4D
        priority: 58
        requires: { suits: { D: [3, 13] } }
        shows: "diamond support opposite the forcing jump: setting trumps"
        establishes: { forcing: game_forcing, agreed_suit: D }
      - id: o1c1d3d_3NT_$M
        call: 3NT
        priority: 56
        requires: {}
        shows: "no fit for the running diamonds and no second suit: 3NT"
        establishes: { forcing: sign_off }

  # A quantitative 4NT is only an invitation if somebody can ACCEPT it.  Three
  # of the file's quantitative raises already ship with their answering seat
  # (rjsq / rrntq / rjrbq); these two did not, so every invitation was declined
  # by construction - opener's only candidate was the code fallback pass.
  - id: quant_accept_after_minor_rebid
    description: "Opener answers the quantitative 4NT over his 12-15 minor rebid"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2$m - P - 4NT - P - ?"
    rules:
      - id: rmrq_accept
        call: 6NT
        priority: 60
        requires: { evals: { total_points: [15, 40] } }
        shows: "maximum for the 12-15 minor rebid: accepting the slam invite"
        establishes: { forcing: sign_off }
      - id: rmrq_decline
        call: P
        priority: 55
        requires: {}
        shows: "minimum for the minor rebid: declining"
        establishes: { forcing: sign_off }

  - id: quant_accept_after_2NT_transfer
    description: "Opener answers the quantitative 4NT after the completed 2NT transfer"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "2NT - P - 3$T - P - 3$M - P - 4NT - P - ?"
    rules:
      - id: nt2trq_accept_$M
        call: 6NT
        priority: 60
        requires: { hcp: [21, 40] }
        shows: "maximum 2NT opening: accepting the slam invite"
        establishes: { forcing: sign_off }
      - id: nt2trq_decline_$M
        call: P
        priority: 55
        requires: {}
        shows: "minimum 2NT opening: declining"
        establishes: { forcing: sign_off }

  - id: quant_accept_after_1NT_rebid
    description: "Opener answers the quantitative 4NT over his 12-14 1NT rebid"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 1NT - P - 4NT - P - ?"
    rules:
      - id: rrntq_accept
        call: 6NT
        priority: 60
        requires: { hcp: [14, 14] }
        shows: "maximum 1NT rebid: accepting the slam invite"
        establishes: { forcing: sign_off }
      - id: rrntq_decline
        call: P
        priority: 55
        requires: { hcp: [12, 13] }
        shows: "minimum 1NT rebid: declining"
        establishes: { forcing: sign_off }

  # Responder may still move over opener's 19+ double raise to game: the
  # raise is a sign-off only from opener's side.  Twelve facing nineteen is
  # thirty-one, which is exactly the keycard gate - without this rule the
  # auction was dead at 4M whatever responder held (the raise carries
  # we-hold-contract for every generic continuation).
  - id: responder_after_1m1M_game_raise
    description: "Responder over opener's 19+ game raise (1m - 1M - 4M)"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 4$M - P - ?"
    rules:
      - id: rj4_rkc
        call: 4NT
        priority: 60
        requires:
          evals: { total_points: [12, 40], controls: [4, 12], rule_of_26: [31, 99] }
          any_of:
            - evals: { "void(any)": [0, 0] }
            - evals: { "keycards($M)": [3, 5] }
        shows: "RKC 1430 for $M: slam values opposite the 19+ game raise"
        establishes: { forcing: one_round, asking: keycards, agreed_suit: $M }
        alertable: true
        convention: rkc_1430

  # ===========================================================================
  # REVERSE CONTINUATIONS (minimal): responder's 5+ major rebid is forcing,
  # and opener's raise of it sets the 5-3 fit.  The known gap from the slam
  # rounds: opposite a 17-21 reverse a responder with a real suit had no
  # forcing rebid, so 3NT swallowed hands with a cold heart slam.
  # ===========================================================================

  - id: responder_reverse_rebid_major
    description: "Responder rebids the 5+ major over opener's 2D reverse"
    expand: { M: [H, S] }
    pattern: "1C - P - 1$M - P - 2D - P - ?"
    rules:
      - id: rrev_2$M
        call: 2$M
        priority: 66
        requires: { suits: { $M: [5, 13] }, hcp: [8, 40] }
        shows: "5+ $M opposite the reverse (forcing one round)"
        establishes: { forcing: one_round }
      # over a 17+ reverse the 2NT answer is FORCING (a non-forcing generic
      # 2NT was passed out at 2NT+3 with 17 opposite a game-going hand)
      - id: rrev_2NT
        call: 2NT
        priority: 64
        requires: { hcp: [8, 11], evals: { semi_balanced: [1, 1] } }
        shows: "8-11 balanced opposite the reverse (forcing one round)"
        establishes: { forcing: one_round }
      - id: rrev_3NT
        call: 3NT
        priority: 63
        requires: { hcp: [12, 40], evals: { weakest_unshown_stopper: [0.9, 9] } }
        shows: "game values opposite the reverse"
        establishes: { forcing: non_forcing }

  - id: responder_reverse_1C1S2H
    description: "Responder over the 1C - 1S - 2H reverse"
    pattern: "1C - P - 1S - P - 2H - P - ?"
    rules:
      - id: rrevh_2S
        call: 2S
        priority: 66
        requires: { suits: { S: [5, 13] }, hcp: [8, 40] }
        shows: "5+ spades opposite the reverse (forcing one round)"
        establishes: { forcing: one_round }
      - id: rrevh_2NT
        call: 2NT
        priority: 64
        requires: { hcp: [8, 11], evals: { semi_balanced: [1, 1] } }
        shows: "8-11 balanced opposite the reverse (forcing one round)"
        establishes: { forcing: one_round }
      - id: rrevh_3NT
        call: 3NT
        priority: 63
        requires: { hcp: [12, 40], evals: { weakest_unshown_stopper: [0.9, 9] } }
        shows: "game values opposite the reverse"
        establishes: { forcing: non_forcing }
      - id: rrevh_3H
        call: 3H
        priority: 65
        requires: { suits: { H: [4, 13] }, hcp: [8, 40] }
        shows: "raising the reverse suit: 4+ hearts (game forcing)"
        establishes: { forcing: game_forcing, agreed_suit: H }

  - id: opener_over_reverse_2NT
    description: "Opener answers the forcing 2NT over his reverse"
    expand_pairs:
      - { M: H, R: 2D }
      - { M: S, R: 2D }
      - { M: S, R: 2H }
    pattern: "1C - P - 1$M - P - $R - P - 2NT - P - ?"
    rules:
      # he reversed (17+): opposite 8-11 the game is there; no semi_balanced
      # gate - that gate is exactly what silenced the 17-count before
      - id: orev2n_3NT_$M$R
        call: 3NT
        priority: 55
        requires: { hcp: [16, 21] }
        shows: "game opposite the 8-11 answer to the reverse"
        establishes: { forcing: non_forcing }
      - id: orev2n_3C_$M$R
        call: 3C
        priority: 54
        requires: { suits: { C: [6, 13] }, hcp: [17, 21] }
        shows: "6+ clubs, still forcing opposite 8-11"
        establishes: { forcing: one_round }

