      - id: v1NT_2H
        call: 2H
        priority: 61
        requires: { suits: { H: [5, 13] }, hcp: [8, 15], features: [ "good_suit(H)" ] }
        shows: "natural: 5+ hearts (usually 6), 8-15"
        establishes: { forcing: non_forcing }
      - id: v1NT_2S
        call: 2S
        priority: 61
