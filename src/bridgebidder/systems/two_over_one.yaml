  # MEASURED AND REVERTED (round 12).  "Contested" really is a property of the
  # auction rather than of RHO's last call: the pattern below means "RHO just
  # bid", so the moment RHO passes the position falls to
  # `general_uncontested_continuation`, whose pattern `... - P - ?` only means
  # "RHO passed".  Reviewer B measured that slice at 465 tables, mean -1.14
  # against a corpus mean of -0.80 - the largest single population in the
  # review, and the diagnosis is correct.  Routing it here anyway
  # (`also_patterns: ["... - bid>=3C - P - ?"]` plus `is_competitive: true`)
  # measured **-59 paired and -106 held-out** and broke five locked scenarios:
  # a context that DEFINES a call takes over interpreting it, so every
  # behaviour authored in the uncontested continuation - the doubler's raise of
  # a three-level advance, the refusal to bid game opposite a preemptive raise
  # - silently disappeared.  The toolkit swap is not the repair; porting
  # individual rungs under `when: { is_competitive: true }` is, and that is
  # what `uc_raise_lott4_$M` does.
  - id: general_competitive_high
    description: "General competitive agreements after their 3-level-or-higher bid"
    pattern: "... - bid>=3C - ?"
    when: { we_hold_contract: false }
    rules:
      # This asked for SHORTNESS in their suit, which is a takeout shape, and
      # then left the double in as a penalty.  Over 1000 duplicate boards
      # against BEN our doubles were beaten 27 times and made 26, a losing
      # bet worth about 200 IMPs.  A business double of a high contract needs
      # trump tricks: length in their suit, not a void opposite silence.
      - id: ch_penalty_X
        call: X
        priority: 38
        requires:
          hcp: [15, 40]
          evals: { quick_tricks: [3, 12], "standing_suit_length": [3, 13] }
        shows: "penalty double of their high contract: defensive tricks and trump length"
        establishes: { forcing: non_forcing }
      - id: ch_negative_X3
        call: X
        priority: 33
        when: { their_last_bid_suit: true, side_has_acted: true, i_have_acted: false, standing_bid_level: [3] }
        requires:
          hcp: [10, 40]
          evals: { "suit_length(their)": [0, 3], longest_suit_length: [0, 4] }
          any_of:
            - suits: { H: [4, 13] }
            - suits: { S: [4, 13] }
        shows: "negative double at the three level: 10+ HCP with a major they have not bid"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: ch_free_3H
        call: 3H
        priority: 30
        when: { unbid_suit: H, cheapest_in_suit: true, side_has_acted: true, i_have_acted: false }
        requires:
          suits: { H: [5, 13] }
          evals: { total_points: [10, 40], "suit_quality(H)": [1.5, 9] }
        shows: "free bid: 5+ good hearts over their jump, 10+"
        establishes: { forcing: non_forcing }
      - id: ch_free_3S
        call: 3S
        priority: 30
        when: { unbid_suit: S, cheapest_in_suit: true, side_has_acted: true, i_have_acted: false }
        requires:
          suits: { S: [5, 13] }
          evals: { total_points: [10, 40], "suit_quality(S)": [1.5, 9] }
        shows: "free bid: 5+ good spades over their jump, 10+"
        establishes: { forcing: non_forcing }
      - id: ch_raise_C2
        call: 2C
        priority: 30
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [6, 12], "lott_total_trumps(C)": [7, 26] }
        shows: "competitive raise of partner's C: 3+ trumps, 6-9 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: ch_raise_C3
        call: 3C
        priority: 31
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [10, 40], rule_of_26: [22, 99], "lott_total_trumps(C)": [8, 26] }
        shows: "competitive raise of partner's C: 3+ trumps, 10+ support points, 8+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: ch_raise_C4
        call: 4C
        priority: 27
        when: { partner_suit: C }
        requires:
          # Four of a minor is not game, so it takes a real fit to be worth
          # bidding at all: ten combined trumps, and the minor has to be my
          # longest suit or the major is the bid.
          suits: { C: [4, 13] }
          evals: { total_points: [11, 40], rule_of_26: [25, 99], "lott_total_trumps(C)": [10, 26],
                    "suit_diff(C, H)": [0, 13], "suit_diff(C, S)": [0, 13] }
        shows: "competitive raise of partner's C: 3+ trumps, 13+ support points opposite partner's shown range"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: ch_raise_D2
        call: 2D
        priority: 30
        when: { partner_suit: D, cheapest_in_suit: true }
        requires:
          suits: { D: [3, 13] }
          evals: { total_points: [6, 12], "lott_total_trumps(D)": [7, 26] }
        shows: "competitive raise of partner's D: 3+ trumps, 6-9 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: D }
      - id: ch_raise_D3
        call: 3D
