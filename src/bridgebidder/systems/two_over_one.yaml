  - id: general_pull_or_sit
    description: "Generic pull/sit when partner's double stands"
    pattern: "... - X - P - ?"
    when: { we_hold_contract: false }
    rules:
      - id: adx_sit
        call: P
        priority: 61
        when: { their_last_bid_suit: true }
        requires:
          evals: { standing_suit_length: [4, 13], "suit_quality(their)": [1.5, 9] }
        shows: "sitting the double: real trumps behind them"
        establishes: { forcing: sign_off }
      # The opener's answer to a NEGATIVE double of a two- or three-level
      # overcall lands in this context (opener_over_negative_double only
      # covers one-level overcalls), and the pull ladder is the wrong tool:
      # the double PROMISED the unbid major, so bid it.
      - id: adx_neg_major_H2
        call: 2H
        priority: 62
        when: { unbid_suit: H, cheapest_in_suit: true, their_last_bid_suit: true, i_have_acted: true }
        requires: { suits: { H: [4, 13] }, hcp: [12, 40] }
        shows: "answering partner's negative double in the major it promised"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: adx_neg_major_H3
        call: 3H
        priority: 62
        when: { unbid_suit: H, cheapest_in_suit: true, their_last_bid_suit: true, i_have_acted: true }
        requires: { suits: { H: [4, 13] }, hcp: [12, 40] }
        shows: "answering partner's negative double in the major it promised"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: adx_neg_major_S2
        call: 2S
        priority: 62
        when: { unbid_suit: S, cheapest_in_suit: true, their_last_bid_suit: true, i_have_acted: true }
        requires: { suits: { S: [4, 13] }, hcp: [12, 40] }
        shows: "answering partner's negative double in the major it promised"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: adx_neg_major_S3
        call: 3S
        priority: 62
        when: { unbid_suit: S, cheapest_in_suit: true, their_last_bid_suit: true, i_have_acted: true }
        requires: { suits: { S: [4, 13] }, hcp: [12, 40] }
        shows: "answering partner's negative double in the major it promised"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: adx_pass_min
        call: P
        priority: 52
        requires: { evals: { total_points: [0, 11] } }
        shows: "no suit worth pulling to and no trump stack: partner's double stands"
        establishes: { forcing: sign_off }
      - id: adx_nt
        call: 2NT
        priority: 56
        when: { cheapest_in_suit: true, their_last_bid_suit: true }
        requires:
          hcp: [9, 12]
          evals: { weakest_their_stopper: [0.9, 9], semi_balanced: [1, 1] }
        shows: "natural answer to the double: 9-12 with their suit stopped"
        establishes: { forcing: non_forcing }
      - id: adx_pull_my_S
        call: 2S
        priority: 60
        when: { my_suit: S, cheapest_in_suit: true, their_last_bid_suit: true }
        requires: { suits: { S: [5, 13] } }
        shows: "pulling partner's double back to my own suit"
        establishes: { forcing: non_forcing }
      - id: adx_pull_my_S3
        call: 3S
        priority: 60
        when: { my_suit: S, cheapest_in_suit: true, their_last_bid_suit: true }
        requires: { suits: { S: [6, 13] } }
        shows: "pulling partner's double back to my own suit"
        establishes: { forcing: non_forcing }
      - id: adx_pull_my_H
        call: 2H
        priority: 59
        when: { my_suit: H, cheapest_in_suit: true, their_last_bid_suit: true }
        requires: { suits: { H: [5, 13] } }
        shows: "pulling partner's double back to my own suit"
        establishes: { forcing: non_forcing }
      - id: adx_pull_my_H3
        call: 3H
        priority: 59
        when: { my_suit: H, cheapest_in_suit: true, their_last_bid_suit: true }
        requires: { suits: { H: [6, 13] } }
        shows: "pulling partner's double back to my own suit"
        establishes: { forcing: non_forcing }
      # The ladder had adx_pull_my_S and adx_pull_my_H and NO MINOR TWIN, and
