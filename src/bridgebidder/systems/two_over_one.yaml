  - id: opener_after_2C_positive
    description: "The 2C opener over a positive suit response"
    expand: { M: [H, S] }
    pattern: "2C - P - 2$M - P - ?"
    rules:
      # A positive response opposite a 2C opening is slam territory by
      # definition (22+ facing 8+), so the raise is THREE, not four: it
      # agrees trumps at the level where the cue-bid and keycard machinery
      # lives.  The generic four-level raise was firing here, partner read
      # it as fast arrival, and a 24-count played in game with twelve
      # tricks on top.
      - id: o2cp_raise_3$M
        call: 3$M
        priority: 72
        requires: { suits: { $M: [3, 13] } }
        shows: "raise of the positive response: 3+ trumps, slam interest by definition"
        establishes: { forcing: game_forcing, agreed_suit: $M }

