# =============================================================================
# Two-over-One Game Forcing — system knowledge base
#
# The bidding system is DATA.  Each context matches a family of auction
# positions (pattern is matched after stripping leading passes; "?" is the
# decision point, "..." matches any prefix).  Rules are candidate calls with
# hand constraints, priorities (higher = systemically preferred), shown
# meanings, forcing implications and conditions.
#
# Style decisions and config flags are documented in DECISIONS.md.
# =============================================================================

system:
  name: "Two-over-One Game Forcing"
  config:
    forcing_nt: semi            # semi | full  (semi: opener may pass 1NT with bal min)
    two_over_one_suit_length: 3 # minimum minor length for a 2/1 response
    nt_with_5M: true            # 1NT opening allowed with a 5-card major (5332)
  defense_notes: >
    Defense to their 1NT: natural (X = penalty 15+, 2-level bids natural 5+
    cards, constructive).  No Michaels/unusual NT; cue-bids of their suit are
    limit+ raises of partner only in the sequences defined below.

contexts:

  # ===========================================================================
  # OPENING BIDS (pattern "?" = nobody has acted yet; leading passes stripped,
  # opening_seat conditions distinguish 1st-4th chair)
  # ===========================================================================

  - id: openings
    description: "Opening bids, all seats"
    pattern: "?"
    rules:
      - id: open_2C
        call: 2C
        priority: 96
        requires:
          any_of:
            - hcp: [22, 40]
            - hcp: [18, 21]
              evals: { ltc: [0, 3.5] }
        shows: "strong artificial: 22+ HCP or equivalent playing strength"
        establishes: { forcing: game_forcing, game_force: false }
        alertable: true
        convention: strong_2C

      - id: open_2NT
        call: 2NT
        priority: 94
        requires: { hcp: [20, 21], balanced: true }
        shows: "20-21 balanced"
        establishes: { forcing: non_forcing }

      - id: open_1NT
        call: 1NT
        priority: 92
        requires: { hcp: [15, 17], balanced: true }
        shows: "15-17 balanced (may contain a 5-card major)"
        establishes: { forcing: non_forcing }
        when: { config: { nt_with_5M: true } }

      - id: open_1NT_no5M
        call: 1NT
        priority: 92
        requires:
          hcp: [15, 17]
          balanced: true
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "15-17 balanced, no 5-card major"
        establishes: { forcing: non_forcing }
        when: { config: { nt_with_5M: false } }

      - id: open_1S
        call: 1S
        priority: 81
        requires:
          suits: { S: [5, 13] }
          hcp: [12, 21]
          evals: { "suit_diff(S,H)": [0, 13] }
        shows: "5+ spades, 12-21 HCP"
        establishes: { forcing: non_forcing }

      - id: open_1H
        call: 1H
        priority: 80
        requires:
          suits: { H: [5, 13] }
          hcp: [12, 21]
          evals: { "suit_diff(H,S)": [1, 13] }
        shows: "5+ hearts, 12-21 HCP"
        establishes: { forcing: non_forcing }

      # rule-of-20 light openings, 1st/2nd seat only
      - id: open_1S_rule20
        call: 1S
        priority: 79
        requires:
          suits: { S: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_20: [20, 33], "suit_diff(S,H)": [0, 13] }
          any_of: [ { evals: { suit_quality(S): [1.5, 9] } }, { evals: { longest_suit_length: [5, 13] }, any_of: [ { suits: { H: [5, 13] } }, { suits: { D: [5, 13] } }, { suits: { C: [5, 13] } } ] } ]
        shows: "5+ spades, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      - id: open_1H_rule20
        call: 1H
        priority: 78
        requires:
          suits: { H: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_20: [20, 33], "suit_diff(H,S)": [1, 13], suit_quality(H): [1.5, 9] }
        shows: "5+ hearts, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      # 4th seat: rule of 15
      - id: open_1S_rule15
        call: 1S
        priority: 77
        requires:
          suits: { S: [5, 13] }
          hcp: [10, 11]
          evals: { rule_of_15: [15, 30], "suit_diff(S,H)": [0, 13] }
        shows: "5+ spades, 4th-seat opening satisfying the rule of 15"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [4] }

      - id: open_1D
        call: 1D
        priority: 74
        requires:
          hcp: [12, 21]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
          any_of:
            - suits: { D: [4, 13] }
              evals: { "suit_diff(D,C)": [0, 13] }
            - suits: { D: [3, 3], C: [0, 2] }
        shows: "opening, 3+ diamonds (better minor), no 5-card major, 12-21 HCP"
        establishes: { forcing: non_forcing }

      - id: open_1C
        call: 1C
        priority: 73
        requires:
          hcp: [12, 21]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
          any_of:
            - suits: { C: [4, 13] }
              evals: { "suit_diff(C,D)": [1, 13] }
            - suits: { C: [3, 3], D: [0, 3] }
        shows: "opening, 3+ clubs (better minor), no 5-card major, 12-21 HCP"
        establishes: { forcing: non_forcing }

      - id: open_1m_rule20
        call: 1D
        priority: 72
        requires:
          hcp: [10, 11]
          suits: { D: [5, 13] }
          evals: { rule_of_20: [20, 33], "suit_diff(D,C)": [0, 13] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "5+ diamonds, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      - id: open_1C_rule20
        call: 1C
        priority: 71
        requires:
          hcp: [10, 11]
          suits: { C: [5, 13] }
          evals: { rule_of_20: [20, 33], "suit_diff(C,D)": [1, 13] }
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "5+ clubs, light opening satisfying the rule of 20"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2] }

      # weak twos: 6-card suit, 5-10 HCP, suit quality tightens when vulnerable
      - id: open_weak_2S_nv
        call: 2S
        priority: 66
        requires:
          suits: { S: [6, 6], H: [0, 3] }
          hcp: [5, 10]
          evals: { "suit_quality(S)": [1, 9] }
        shows: "weak two: 6 spades, 5-10 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_weak_2S_vul
        call: 2S
        priority: 66
        requires:
          suits: { S: [6, 6], H: [0, 3] }
          hcp: [7, 10]
          evals: { "suit_quality(S)": [1.5, 9] }
        shows: "weak two: 6 decent spades, 7-10 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_weak_2H_nv
        call: 2H
        priority: 65
        requires:
          suits: { H: [6, 6], S: [0, 3] }
          hcp: [5, 10]
          evals: { "suit_quality(H)": [1, 9] }
        shows: "weak two: 6 hearts, 5-10 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_weak_2H_vul
        call: 2H
        priority: 65
        requires:
          suits: { H: [6, 6], S: [0, 3] }
          hcp: [7, 10]
          evals: { "suit_quality(H)": [1.5, 9] }
        shows: "weak two: 6 decent hearts, 7-10 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_weak_2D_nv
        call: 2D
        priority: 64
        requires:
          suits: { D: [6, 6], H: [0, 3], S: [0, 3] }
          hcp: [5, 10]
          evals: { "suit_quality(D)": [1, 9] }
        shows: "weak two: 6 diamonds, 5-10 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_weak_2D_vul
        call: 2D
        priority: 64
        requires:
          suits: { D: [6, 6], H: [0, 3], S: [0, 3] }
          hcp: [7, 10]
          evals: { "suit_quality(D)": [1.5, 9] }
        shows: "weak two: 6 decent diamonds, 7-10 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }

      # 3-level preempts: 7-card suit, seats 1-3
      # A seven-card suit is the preempt; `good_suit` (two of the top three)
      # was refusing to preempt on KJ9xxxx and QJTxxxx, which is most of
      # them.  Quality is a matter of degree and of vulnerability instead:
      # any seven-bagger with an honour or two non-vulnerable, a decent one
      # when a bad result costs 200 a trick.
      - id: open_3C_nv
        call: 3C
        priority: 60
        requires:
          suits: { C: [7, 13] }
          hcp: [3, 9]
          evals: { "suit_quality(C)": [1, 9] }
        shows: "preempt: 7+ clubs, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3C_vul
        call: 3C
        priority: 60
        requires:
          suits: { C: [7, 13] }
          hcp: [5, 9]
          evals: { "suit_quality(C)": [1.5, 9] }
        shows: "preempt: 7+ decent clubs, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_3D_nv
        call: 3D
        priority: 60
        requires:
          suits: { D: [7, 13] }
          hcp: [3, 9]
          evals: { "suit_quality(D)": [1, 9] }
        shows: "preempt: 7+ diamonds, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3D_vul
        call: 3D
        priority: 60
        requires:
          suits: { D: [7, 13] }
          hcp: [5, 9]
          evals: { "suit_quality(D)": [1.5, 9] }
        shows: "preempt: 7+ decent diamonds, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_3H_nv
        call: 3H
        priority: 60
        requires:
          suits: { H: [7, 13] }
          hcp: [3, 9]
          evals: { "suit_quality(H)": [1, 9] }
        shows: "preempt: 7+ hearts, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3H_vul
        call: 3H
        priority: 60
        requires:
          suits: { H: [7, 13] }
          hcp: [5, 9]
          evals: { "suit_quality(H)": [1.5, 9] }
        shows: "preempt: 7+ decent hearts, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }
      - id: open_3S_nv
        call: 3S
        priority: 60
        requires:
          suits: { S: [7, 13] }
          hcp: [3, 9]
          evals: { "suit_quality(S)": [1, 9] }
        shows: "preempt: 7+ spades, 3-9 HCP"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: false, opening_seat: [1, 2, 3] }
      - id: open_3S_vul
        call: 3S
        priority: 60
        requires:
          suits: { S: [7, 13] }
          hcp: [5, 9]
          evals: { "suit_quality(S)": [1.5, 9] }
        shows: "preempt: 7+ decent spades, 5-9 HCP (vulnerable)"
        establishes: { forcing: non_forcing }
        when: { we_vulnerable: true, opening_seat: [1, 2, 3] }

      # Eight of them is a four-level preempt, not a three-level one: the
      # extra trump is a trick, and the hand is worthless on defence.
      - id: open_4H
        call: 4H
        priority: 61
        requires:
          suits: { H: [8, 13] }
          hcp: [3, 10]
        shows: "preempt: 8+ hearts, 3-10 HCP"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2, 3] }
      - id: open_4S
        call: 4S
        priority: 61
        requires:
          suits: { S: [8, 13] }
          hcp: [3, 10]
        shows: "preempt: 8+ spades, 3-10 HCP"
        establishes: { forcing: non_forcing }
        when: { opening_seat: [1, 2, 3] }

      - id: open_pass_4th
        call: P
        priority: 22
        requires: { hcp: [0, 12], evals: { rule_of_15: [0, 14] } }
        shows: "4th seat: not worth opening (rule of 15 fails)"
        establishes: { forcing: sign_off }
        when: { opening_seat: [4] }
        negative_inference_weight: soft

      - id: open_pass
        call: P
        priority: 20
        requires: { hcp: [0, 11] }
        shows: "fewer than opening values"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  # ===========================================================================
  # 1NT OPENING STRUCTURE (Stayman, Jacoby transfers, invitational sequences)
  # ===========================================================================

  - id: resp_1NT
    description: "Responses to a 1NT opening"
    pattern: "1NT - P - ?"
    rules:
      - id: nt_stayman
        call: 2C
        priority: 85
        requires:
          hcp: [8, 40]
          any_of: [ { suits: { H: [4, 4] } }, { suits: { S: [4, 4] } } ]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } } ] }
        shows: "Stayman: at least one 4-card major, invitational+ values"
        establishes: { forcing: one_round }
        convention: stayman
        announce: null

      - id: nt_transfer_H
        call: 2D
        priority: 88
        requires: { suits: { H: [5, 13] } }
        shows: "Jacoby transfer to hearts (5+ hearts, any strength)"
        establishes: { forcing: one_round }
        convention: jacoby_transfer
        announce: "transfer"

      - id: nt_transfer_S
        call: 2H
        priority: 87
        requires: { suits: { S: [5, 13] }, evals: { "suit_diff(S,H)": [0, 13] } }
        shows: "Jacoby transfer to spades (5+ spades, any strength)"
        establishes: { forcing: one_round }
        convention: jacoby_transfer
        announce: "transfer"

      - id: nt_2NT_inv
        call: 2NT
        priority: 60
        requires:
          hcp: [8, 9]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "invitational, 8-9 HCP, no 4-card major"
        establishes: { forcing: invitational }

      - id: nt_3NT
        call: 3NT
        priority: 62
        requires:
          hcp: [10, 15]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "to play, 10-15 HCP, no 4-card major"
        establishes: { forcing: sign_off }

      - id: nt_4NT_quant
        call: 4NT
        priority: 64
        requires:
          hcp: [16, 17]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "quantitative slam invitation, 16-17 HCP (not Blackwood)"
        establishes: { forcing: invitational }
        alertable: true

      - id: nt_6NT
        call: 6NT
        priority: 63
        requires:
          hcp: [18, 20]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "to play: 18-20 HCP balanced opposite 15-17"
        establishes: { forcing: sign_off }

      - id: nt_pass
        call: P
        priority: 25
        requires:
          hcp: [0, 7]
          not: { any_of: [ { suits: { H: [5, 13] } }, { suits: { S: [5, 13] } }, { suits: { D: [6, 13] } } ] }
        shows: "weak hand, no 5-card major"
        establishes: { forcing: sign_off }

  - id: nt_stayman_rebid
    description: "Opener's rebid over Stayman"
    pattern: "1NT - P - 2C - P - ?"
    rules:
      - id: stayman_2H
        call: 2H
        priority: 70
        requires: { suits: { H: [4, 5] } }
        shows: "4+ hearts (may also hold 4 spades)"
        establishes: { forcing: non_forcing }
      - id: stayman_2S
        call: 2S
        priority: 60
        requires: { suits: { S: [4, 5] } }
        shows: "4+ spades, denies 4 hearts"
        establishes: { forcing: non_forcing }
      - id: stayman_2D
        call: 2D
        priority: 50
        requires:
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "no 4-card major"
        establishes: { forcing: non_forcing }

  - id: stayman_resp_after_2D
    description: "Responder's rebid after Stayman 2D denial"
    pattern: "1NT - P - 2C - P - 2D - P - ?"
    rules:
      - id: stm_2D_2NT
        call: 2NT
        priority: 60
        requires: { hcp: [8, 9] }
        shows: "invitational, 8-9 HCP (had a 4-card major)"
        establishes: { forcing: invitational }
      - id: stm_2D_3NT
        call: 3NT
        priority: 62
        requires: { hcp: [10, 15] }
        shows: "to play, game values (had a 4-card major)"
        establishes: { forcing: sign_off }

  - id: stayman_resp_after_2M
    description: "Responder's rebid after Stayman finds/misses a fit"
    expand: { M: [H, S] }
    pattern: "1NT - P - 2C - P - 2$M - P - ?"
    rules:
      - id: stm_raise_3$M
        call: 3$M
        priority: 70
        requires: { suits: { $M: [4, 4] }, hcp: [8, 9] }
        shows: "invitational raise with a 4-card fit"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: stm_raise_4$M
        call: 4$M
        priority: 72
        requires: { suits: { $M: [4, 4] }, hcp: [10, 15] }
        shows: "game raise with a 4-card fit"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: stm_2NT_nofit
        call: 2NT
        priority: 55
        requires: { hcp: [8, 9], suits: { $M: [0, 3] } }
        shows: "invitational, no fit for the major"
        establishes: { forcing: invitational }
      - id: stm_3NT_nofit
        call: 3NT
        priority: 57
        requires: { hcp: [10, 15], suits: { $M: [0, 3] } }
        shows: "to play, no fit for the major (opener may correct with the other major)"
        establishes: { forcing: sign_off }

  - id: nt_transfer_accept_H
    description: "Opener completes the hearts transfer"
    pattern: "1NT - P - 2D - (P|X) - ?"
    rules:
      - id: tr_super_3H
        call: 3H
        priority: 60
        requires: { suits: { H: [4, 5] }, hcp: [17, 17] }
        shows: "super-accept: 4 hearts, maximum"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: tr_accept_2H
        call: 2H
        priority: 55
        requires: {}
        shows: "completing the transfer (forced)"
        establishes: { forcing: non_forcing }

  - id: nt_transfer_accept_S
    description: "Opener completes the spades transfer"
    pattern: "1NT - P - 2H - (P|X) - ?"
    rules:
      - id: tr_super_3S
        call: 3S
        priority: 60
        requires: { suits: { S: [4, 5] }, hcp: [17, 17] }
        shows: "super-accept: 4 spades, maximum"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: tr_accept_2S
        call: 2S
        priority: 55
        requires: {}
        shows: "completing the transfer (forced)"
        establishes: { forcing: non_forcing }

  - id: nt_after_transfer
    description: "Responder's rebid after a completed transfer"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "1NT - P - 2$T - P - 2$M - P - ?"
    rules:
      - id: tr_pass_weak
        call: P
        priority: 55
        requires: { hcp: [0, 7], suits: { $M: [5, 13] } }
        shows: "weak with 5+ $M: sign-off"
        establishes: { forcing: sign_off }
      - id: tr_2NT_inv
        call: 2NT
        priority: 56
        requires: { hcp: [8, 9], suits: { $M: [5, 5] } }
        shows: "invitational, exactly 5 $M (opener passes/corrects)"
        establishes: { forcing: invitational }
      - id: tr_3M_inv
        call: 3$M
        priority: 57
        requires: { hcp: [8, 9], suits: { $M: [6, 13] } }
        shows: "invitational with 6+ $M"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: tr_3NT_choice
        call: 3NT
        priority: 58
        requires: { hcp: [10, 15], suits: { $M: [5, 5] }, evals: { singleton_or_void: [0, 0] } }
        shows: "game values, exactly 5 $M: choice of games (opener corrects to 4$M with 3+)"
        establishes: { forcing: sign_off }
      - id: tr_4$M
        call: 4$M
        priority: 59
        requires: { hcp: [10, 15], suits: { $M: [6, 13] } }
        shows: "game with 6+ $M"
        establishes: { forcing: sign_off, agreed_suit: $M }

  - id: nt_transfer_3NT_choice
    description: "Opener's correction over the choice-of-games 3NT"
    expand_pairs: [ { M: H, T: D }, { M: S, T: H } ]
    pattern: "1NT - P - 2$T - P - 2$M - P - 3NT - P - ?"
    rules:
      - id: choice_4$M
        call: 4$M
        priority: 60
        requires: { suits: { $M: [3, 5] } }
        shows: "3+ card fit: playing game in the major"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: choice_pass
        call: P
        priority: 55
        requires: { suits: { $M: [0, 2] } }
        shows: "doubleton in responder's major: 3NT stands"
        establishes: { forcing: sign_off }

  - id: nt_2NT_opener_decides
    description: "Opener over the 8-9 invite"
    pattern: "1NT - P - 2NT - P - ?"
    rules:
      - id: inv_accept_3NT
        call: 3NT
        priority: 60
        requires: { hcp: [16, 17] }
