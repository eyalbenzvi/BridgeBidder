  # =========================================================================
  # GENERAL AGREEMENTS (round-5 harvest)
  #
  # The competitive and constructive toolkit every partnership plays without
  # discussion, expressed as DATA.  Suit role ("partner's suit", "an unbid
  # suit") and level ("the cheapest bid available in this suit") are auction
  # facts, so they are hard `when:` gates rather than soft hand features.
  # Priorities are low, so any specific context above always wins; these
  # exist so ordinary positions produce an explained systemic call instead of
  # an undiscussed fallback.
  # =========================================================================

  - id: general_competitive_low
    description: "General competitive agreements after their 1- or 2-level bid"
    pattern: "... - bid<3C - ?"
    when: { we_hold_contract: false }
    rules:
      - id: cl_takeout_X_C
        call: X
        priority: 36
        when: { their_last_bid_suit: true, side_has_acted: false, standing_bid_strain: [C] }
        requires:
          hcp: [12, 40]
          suits: { C: [0, 2] }
        shows: "takeout-flavoured double: opening values, short in the suit doubled"
        establishes: { forcing: one_round }
      - id: cl_takeout_X_D
        call: X
        priority: 36
        when: { their_last_bid_suit: true, side_has_acted: false, standing_bid_strain: [D] }
        requires:
          hcp: [12, 40]
          suits: { D: [0, 2] }
        shows: "takeout-flavoured double: opening values, short in the suit doubled"
        establishes: { forcing: one_round }
      - id: cl_takeout_X_H
        call: X
        priority: 36
        when: { their_last_bid_suit: true, side_has_acted: false, standing_bid_strain: [H] }
        requires:
          hcp: [12, 40]
          suits: { H: [0, 2] }
        shows: "takeout-flavoured double: opening values, short in the suit doubled"
        establishes: { forcing: one_round }
      - id: cl_takeout_X_S
        call: X
        priority: 36
        when: { their_last_bid_suit: true, side_has_acted: false, standing_bid_strain: [S] }
        requires:
          hcp: [12, 40]
          suits: { S: [0, 2] }
        shows: "takeout-flavoured double: opening values, short in the suit doubled"
        establishes: { forcing: one_round }
      - id: cl_negative_X1
        call: X
        priority: 33
        when: { their_last_bid_suit: true, side_has_acted: true, i_have_acted: false, standing_bid_level: [1] }
        requires:
          hcp: [6, 40]
          evals: { "suit_length(their)": [0, 3], longest_suit_length: [0, 4] }
          any_of:
            - suits: { H: [4, 13] }
            - suits: { S: [4, 13] }
        shows: "negative double: 6+ HCP with a major they have not bid"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: cl_negative_X2
        call: X
        priority: 33
        when: { their_last_bid_suit: true, side_has_acted: true, i_have_acted: false, standing_bid_level: [2] }
        requires:
          hcp: [8, 40]
          evals: { "suit_length(their)": [0, 3], longest_suit_length: [0, 4], "suit_length(partner)": [0, 3] }
          any_of:
            - suits: { H: [4, 13] }
            - suits: { S: [4, 13] }
        shows: "negative double at the two level: 8+ HCP with a major they have not bid"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: cl_raise_C2
        call: 2C
        priority: 30
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [5, 10], "lott_total_trumps(C)": [7, 26] }
        shows: "competitive raise of partner's C: 3+ trumps, 5-10 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: cl_raise_C3
        call: 3C
        priority: 31
        when: { partner_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [3, 13] }
          evals: { total_points: [10, 40], rule_of_26: [22, 99], "lott_total_trumps(C)": [8, 26] }
        shows: "competitive raise of partner's C: 3+ trumps, 10+ support points, 8+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: cl_raise_C4
        call: 4C
        priority: 27
        when: { partner_suit: C }
        requires:
          # Four of a minor is not game, so it takes a real fit to be worth
          # bidding at all: ten combined trumps, and the minor has to be my
          # longest suit or the major is the bid.
          suits: { C: [4, 13] }
          evals: { total_points: [11, 40], rule_of_26: [25, 99], "lott_total_trumps(C)": [10, 26],
                    "suit_diff(C, H)": [0, 13], "suit_diff(C, S)": [0, 13] }
        shows: "competitive raise of partner's C: 3+ trumps, 13+ support points opposite partner's shown range"
        establishes: { forcing: non_forcing, agreed_suit: C }
      - id: cl_raise_D2
        call: 2D
        priority: 30
        when: { partner_suit: D, cheapest_in_suit: true }
        requires:
          suits: { D: [3, 13] }
          evals: { total_points: [5, 10], "lott_total_trumps(D)": [7, 26] }
        shows: "competitive raise of partner's D: 3+ trumps, 5-10 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: D }
      - id: cl_raise_D3
        call: 3D
        priority: 31
        when: { partner_suit: D, cheapest_in_suit: true }
        requires:
          suits: { D: [3, 13] }
          evals: { total_points: [10, 40], rule_of_26: [22, 99], "lott_total_trumps(D)": [8, 26] }
        shows: "competitive raise of partner's D: 3+ trumps, 10+ support points, 8+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: D }
      - id: cl_raise_D4
        call: 4D
        priority: 27
        when: { partner_suit: D }
        requires:
          # Four of a minor is not game, so it takes a real fit to be worth
          # bidding at all: ten combined trumps, and the minor has to be my
          # longest suit or the major is the bid.
          suits: { D: [4, 13] }
          evals: { total_points: [11, 40], rule_of_26: [25, 99], "lott_total_trumps(D)": [10, 26],
                    "suit_diff(D, H)": [0, 13], "suit_diff(D, S)": [0, 13] }
        shows: "competitive raise of partner's D: 3+ trumps, 13+ support points opposite partner's shown range"
        establishes: { forcing: non_forcing, agreed_suit: D }
      - id: cl_raise_H2
        call: 2H
        priority: 30
        when: { partner_suit: H, cheapest_in_suit: true }
        requires:
          suits: { H: [3, 13] }
          evals: { total_points: [5, 10], "lott_total_trumps(H)": [7, 26] }
        shows: "competitive raise of partner's H: 3+ trumps, 5-10 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: cl_raise_H3
        call: 3H
        priority: 31
        when: { partner_suit: H, cheapest_in_suit: true }
        requires:
          suits: { H: [3, 13] }
          evals: { total_points: [10, 40], rule_of_26: [22, 99], "lott_total_trumps(H)": [8, 26] }
        shows: "competitive raise of partner's H: 3+ trumps, 10+ support points, 8+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: cl_raise_H4
        call: 4H
        priority: 32
        when: { partner_suit: H }
        requires:
          any_of: [ { suits: { H: [3, 13] }, evals: { total_points: [11, 40], rule_of_26: [25, 99], "lott_total_trumps(H)": [8, 26] } }, { suits: { H: [5, 13] }, hcp: [3, 9], evals: { "lott_total_trumps(H)": [10, 26] } } ]
        shows: "competitive raise of partner's H: 13+ support points and a real trump fit opposite partner's shown range"
        establishes: { forcing: non_forcing, agreed_suit: H }
      - id: cl_raise_S2
        call: 2S
        priority: 30
        when: { partner_suit: S, cheapest_in_suit: true }
        requires:
          suits: { S: [3, 13] }
          evals: { total_points: [5, 10], "lott_total_trumps(S)": [7, 26] }
        shows: "competitive raise of partner's S: 3+ trumps, 5-10 support points, 7+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: cl_raise_S3
        call: 3S
        priority: 31
        when: { partner_suit: S, cheapest_in_suit: true }
        requires:
          suits: { S: [3, 13] }
          evals: { total_points: [10, 40], rule_of_26: [22, 99], "lott_total_trumps(S)": [8, 26] }
        shows: "competitive raise of partner's S: 3+ trumps, 10+ support points, 8+ combined trumps"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: cl_raise_S4
        call: 4S
        priority: 32
        when: { partner_suit: S }
        requires:
          any_of: [ { suits: { S: [3, 13] }, evals: { total_points: [11, 40], rule_of_26: [25, 99], "lott_total_trumps(S)": [8, 26] } }, { suits: { S: [5, 13] }, hcp: [3, 9], evals: { "lott_total_trumps(S)": [10, 26] } } ]
        shows: "competitive raise of partner's S: 13+ support points and a real trump fit opposite partner's shown range"
        establishes: { forcing: non_forcing, agreed_suit: S }
      - id: cl_new_C1
