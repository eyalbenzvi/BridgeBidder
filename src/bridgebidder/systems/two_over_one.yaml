  - id: resp_preempt_C
    description: "Responses to partner's 3C preempt"
    pattern: "3C - P - ?"
    rules:
      - id: rp3_C_D
        call: 3D
        priority: 62
        requires:
          suits: { D: [5, 13], C: [0, 2] }
          hcp: [15, 40]
        shows: "new suit opposite the preempt: 5+ D, 15+, forcing"
        establishes: { forcing: one_round }
      - id: rp3_C_H
        call: 3H
        priority: 62
        requires:
          suits: { H: [5, 13], C: [0, 2] }
          hcp: [15, 40]
        shows: "new suit opposite the preempt: 5+ H, 15+, forcing"
        establishes: { forcing: one_round }
      - id: rp3_C_S
        call: 3S
        priority: 62
        requires:
          suits: { S: [5, 13], C: [0, 2] }
          hcp: [15, 40]
        shows: "new suit opposite the preempt: 5+ S, 15+, forcing"
        establishes: { forcing: one_round }
      # CEILING: the ladder topped out at the game raise, so a twenty-count with
      # a nine-card fit opposite a SEVEN-card suit had no rung above 4C and every
      # slam opposite a preempt was signed off by construction.  Gated on the
      # COUNTED fit and on holding four of the five keycards myself - opposite a
      # hand that has shown 4-9 HCP, three is not enough for the reply to keep
      # you out of a slam off an ace.
      - id: rp3_C_rkc
        call: 4NT
        priority: 66
        requires:
          suits: { C: [2, 13] }
          evals: { total_points: [19, 40], "lott_total_trumps(C)": [9, 26],
                   "keycards(C)": [4, 5] }
        shows: "keycard ask opposite the preempt: a nine-card fit and four of the five keycards"
        establishes: { forcing: one_round, agreed_suit: C, asking: keycards }
        alertable: true
        convention: rkc_1430
      # The rule demanded a stopper in PARTNER'S suit - the one suit that needs
      # none, since it is the source of tricks - and said nothing about the
      # three suits the opponents are about to lead.  3NT opposite a preempt is
      # nine tricks on a long minor plus stoppers; without them the defence
      # simply cashes, and one went down SIX.  weakest_unshown_stopper is
      # registered sharp (unlike weakest_their_stopper, whose bare sigma change
      # round 8 measured at -9 and reverted), so this gate really gates.  The
      # 4H/4S siblings keep their gate as written: a stopper argument is about
      # notrump, not about a major-suit game.
      - id: rp3_C_game
        call: 3NT
        priority: 64
        requires:
          evals: { total_points: [15, 40], weakest_unshown_stopper: [0.9, 9] }
          features: [ "stopper(partner)" ]
        shows: "bidding game opposite the preempt: the outside suits are stopped"
        establishes: { forcing: sign_off }
      # The sign-off gains the matching branch, so a 15-count with a hole is
      # not left with nothing that fits - the seat would otherwise be empty and
      # the fallback would invent a call (round 6's lesson).
      - id: rp3_C_pass
        call: P
        priority: 40
        requires:
          any_of:
            - evals: { total_points: [0, 14] }
            - evals: { weakest_unshown_stopper: [0, 0.5] }
        shows: "no game opposite a preempt"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

