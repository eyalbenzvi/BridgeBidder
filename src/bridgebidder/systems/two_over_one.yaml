  - id: opener_after_negative_double_rho_bids
    description: "Opener after the negative double when RHO bids again"
    expand_pairs: [ { m: C, v: H, M: S }, { m: D, v: H, M: S }, { m: C, v: S, M: H }, { m: D, v: S, M: H } ]
    pattern: "1$m - 1$v - X - bid - ?"
