  # ===========================================================================
  # DEFENSE TO THEIR WEAK TWOS
  # ===========================================================================

  # The defence to their THREE-level preempt was authored with natural suit
  # overcalls (v3_*); its sibling, the defence to a weak TWO, has only a
  # double, 2NT and a pass - and vw2_pass (0-14) sits at priority 30, ABOVE
  # the generic toolkit's overcall at 26.  So an eleven-count with KQJ95
  # passed 2D out.  These contexts sit BEFORE defense_vs_weak2 and define only
  # the suit calls, so the double, the 2NT and the pass keep their readings.
  # Gates copied from the measured three-level defence, with the two-level
  # rung taking a good FIVE instead of a six.  Advances are the generic
  # competitive raise and new-suit ladders, which already cover a natural
  # overcall - none of these calls is artificial.
  - id: defense_vs_weak2D_overcalls
    description: "Direct seat over their 2D: natural two-level overcalls"
    pattern: "2D - ?"
    rules:
      - id: vw2D_over_2H
        call: 2H
        priority: 64
        when: { unbid_suit: H }
        requires:
          suits: { H: [5, 13] }
          # capped at 16: with 17+ the system's own route is to double first
          # and bid the suit afterwards, which is what vw2_X's strong branch
          # is for.  Overcalling two of a major on a 17-count underbids it.
          hcp: [11, 16]
          evals: { "suit_quality(H)": [2, 9] }
        shows: "natural overcall of the weak two: good 5+ H, 11-16"
        establishes: { forcing: non_forcing }
      # A context that DEFINES a call takes over interpreting it, so this one
      # must carry the reading it shadows verbatim or it subtracts behaviour:
      # without this rung the generic cl_new_H2 (5+ cards, 10+ points) stopped
      # fitting here, a 17-count's 2S fell from 0.76 to 0.33, and the engine
      # started reporting a genuine X-versus-2S judgment as "clear".
      - id: vw2_shadow_DH
        call: 2H
        priority: 26
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires:
          suits: { H: [5, 13] }
          evals: { total_points: [10, 40], "suit_quality(H)": [1.5, 9] }
        shows: "natural H at the cheapest level: 5+ cards, 10+ points"
        establishes: { forcing: non_forcing }
      # A context that DEFINES a call takes over interpreting it, so this one
      # must carry the reading it shadows verbatim or it subtracts behaviour:
      # without this rung the generic cl_new_S2 (5+ cards, 10+ points) stopped
      # fitting here, a 17-count's 2S fell from 0.76 to 0.33, and the engine
      # started reporting a genuine X-versus-2S judgment as "clear".
      - id: vw2_shadow_DS
        call: 2S
        priority: 26
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires:
          suits: { S: [5, 13] }
          evals: { total_points: [10, 40], "suit_quality(S)": [1.5, 9] }
        shows: "natural S at the cheapest level: 5+ cards, 10+ points"
        establishes: { forcing: non_forcing }
      - id: vw2D_over_2S
        call: 2S
        priority: 64
        when: { unbid_suit: S }
        requires:
          suits: { S: [5, 13] }
          # capped at 16: with 17+ the system's own route is to double first
          # and bid the suit afterwards, which is what vw2_X's strong branch
          # is for.  Overcalling two of a major on a 17-count underbids it.
          hcp: [11, 16]
          evals: { "suit_quality(S)": [2, 9] }
        shows: "natural overcall of the weak two: good 5+ S, 11-16"
        establishes: { forcing: non_forcing }

  - id: defense_vs_weak2H_overcalls
    description: "Direct seat over their 2H: the two-level spade overcall"
    pattern: "2H - ?"
    rules:
      # A context that DEFINES a call takes over interpreting it, so this one
      # must carry the reading it shadows verbatim or it subtracts behaviour:
      # without this rung the generic cl_new_S2 (5+ cards, 10+ points) stopped
      # fitting here, a 17-count's 2S fell from 0.76 to 0.33, and the engine
      # started reporting a genuine X-versus-2S judgment as "clear".
      - id: vw2_shadow_HS
        call: 2S
        priority: 26
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires:
          suits: { S: [5, 13] }
          evals: { total_points: [10, 40], "suit_quality(S)": [1.5, 9] }
        shows: "natural S at the cheapest level: 5+ cards, 10+ points"
        establishes: { forcing: non_forcing }
      - id: vw2H_over_2S
        call: 2S
        priority: 64
        when: { unbid_suit: S }
        requires:
          suits: { S: [5, 13] }
          # capped at 16: with 17+ the system's own route is to double first
          # and bid the suit afterwards, which is what vw2_X's strong branch
          # is for.  Overcalling two of a major on a 17-count underbids it.
          hcp: [11, 16]
          evals: { "suit_quality(S)": [2, 9] }
        shows: "natural overcall of the weak two: good 5+ S, 11-16"
        establishes: { forcing: non_forcing }

  - id: defense_vs_weak2_overcalls3
    description: "Direct seat over their weak two: three-level suit overcalls"
    expand_pairs:
      - { W: D, X: C }
      - { W: H, X: C }
      - { W: H, X: D }
      - { W: S, X: C }
      - { W: S, X: D }
      - { W: S, X: H }
    pattern: "2$W - ?"
    rules:
      # the same superset guard for the three-level rung
      - id: vw2_shadow3_$X
        call: 3$X
        priority: 26
        when: { unbid_suit: $X, cheapest_in_suit: true }
        requires:
          suits: { $X: [5, 13] }
          evals: { total_points: [14, 40], "suit_quality($X)": [1.5, 9] }
        shows: "natural $X at the cheapest level: 5+ cards, 14+ points"
        establishes: { forcing: non_forcing }
      - id: vw2_over3_$X
        call: 3$X
        priority: 64
        when: { unbid_suit: $X }
        requires:
          suits: { $X: [6, 13] }
          hcp: [11, 40]
          evals: { "suit_quality($X)": [1.5, 9], quick_tricks: [2, 12] }
        shows: "overcalling the weak two at the three level: good 6+ $X, 11+"
        establishes: { forcing: non_forcing }

  - id: defense_vs_weak2
    description: "Direct seat over their weak two"
    expand: { W: [D, H, S] }
    pattern: "2$W - ?"
    rules:
      - id: vw2_X
        call: X
        priority: 70
        requires:
          any_of:
            # a takeout double asks partner to pick; with a six-card suit of
            # my own there is nothing to pick, so overcall it instead.  The
            # strong branch still doubles first and bids the suit after.
            - hcp: [13, 16]
              suits: { $W: [0, 2] }
              evals: { longest_suit_length: [0, 5] }
            - hcp: [17, 40]
        shows: "takeout double of the weak two"
        establishes: { forcing: one_round }
      - id: vw2_2NT
        call: 2NT
        priority: 72
        requires: { hcp: [15, 18], balanced: true, features: [ "stopper($W)" ] }
        shows: "15-18 balanced with a stopper"
        establishes: { forcing: non_forcing }
      - id: vw2_pass
        call: P
        priority: 30
        requires: { hcp: [0, 14] }
        shows: "nothing to say over the preempt"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  # ===========================================================================
  # SLAM MACHINERY: RKC Blackwood 1430 + quantitative 4NT
  # ===========================================================================

  # Blackwood prerequisites: no void on ANY direct 4NT ask - the answer
  # cannot say WHICH ace partner holds, and an ace facing the void is a
  # wasted card.  The worthless-doubleton veto (xx/Jx: two fast losers no
  # keycard reply can diagnose) applies only HERE and to the Jacoby ask,
  # where the auction is game-forced with a suit agreed and the cue-bid
  # floor exists as the better tool; in the general slam-try positions no
  # cue floor exists, and the veto measurably deleted slams there.
  - id: rkc_ask
    description: "4NT is RKC 1430 once a suit is agreed in a game force"
    pattern: "... - ?"
    when: { agreed_suit: true, game_forced: true }
    rules:
      - id: rkc_4NT
        call: 4NT
        priority: 45
        requires:
          # ONE floor for one convention.  Its sibling gst_rkc_$X - the same
          # 1430 ask, reached when no suit has been formally agreed - has read
          # total_points 15+ for several measured rounds, and this one read 17.
          # Which floor applied depended only on which CONTEXT claimed the
          # auction, so AGREEING a suit could make the ask harder: a 15-count
          # with a nine-card fit asked keycards right up until partner's rebid
          # set trumps, and then signed off in five of a minor instead.
          evals: { total_points: [15, 40], controls: [4, 12], rule_of_26: [31, 99],
                    "lott_total_trumps(agreed)": [8, 26] }
          # the veto pair is waived for a hand holding 3+ keycards itself:
          # such a hand does not need to identify which cards partner holds,
          # so no void or small doubleton can make the answer ambiguous
          any_of:
            - evals: { "void(any)": [0, 0], worthless_doubleton: [0, 0] }
            - evals: { "keycards(agreed)": [3, 5] }
        shows: "RKC Blackwood 1430 for the agreed suit"
        establishes: { forcing: one_round, asking: keycards }
        alertable: true
        convention: rkc_1430

  # When the reply IS the sign-off spot (5H with hearts agreed, 5S with
  # spades agreed) it must be passable: the one-round-forcing reply plus the
  # forcing-pass filter left the asker with ZERO legal candidates and the
  # backstop invented a five-level nonsense bid on a real board.
  - id: rkc_response_agreed_H
    description: "RKC replies with hearts agreed: 5H is passable"
    pattern: "... - 4NT - P - ?"
    when: { asking: keycards, agreed_suit: H }
    rules:
      - id: rkc_5H_agreed
        call: 5H
        priority: 58
        requires:
          evals: { "keycards(agreed)": [2, 2], "trump_queen(agreed)": [0, 0] }
        shows: "2 keycards without the trump queen (passable: this is the sign-off spot)"
        establishes: { forcing: non_forcing }
        alertable: true
        convention: rkc_1430

  - id: rkc_response_agreed_S
    description: "RKC replies with spades agreed: 5S is passable"
    pattern: "... - 4NT - P - ?"
    when: { asking: keycards, agreed_suit: S }
    rules:
      - id: rkc_5S_agreed
        call: 5S
        priority: 57
        requires:
          evals: { "keycards(agreed)": [2, 2], "trump_queen(agreed)": [1, 1] }
        shows: "2 keycards with the trump queen (passable: this is the sign-off spot)"
        establishes: { forcing: non_forcing }
        alertable: true
        convention: rkc_1430

  - id: rkc_response
    description: "Responses to RKC 1430"
    pattern: "... - 4NT - P - ?"
    when: { asking: keycards }
    rules:
      - id: rkc_5C
        call: 5C
        priority: 60
        requires:
          any_of:
            - evals: { "keycards(agreed)": [1, 1] }
            - evals: { "keycards(agreed)": [4, 4] }
        shows: "1 or 4 keycards (1430)"
        establishes: { forcing: one_round }
        alertable: true
        convention: rkc_1430
      - id: rkc_5D
        call: 5D
        priority: 59
        requires:
          any_of:
            - evals: { "keycards(agreed)": [0, 0] }
            - evals: { "keycards(agreed)": [3, 3] }
        shows: "0 or 3 keycards (1430)"
        establishes: { forcing: one_round }
        alertable: true
        convention: rkc_1430
      - id: rkc_5H
        call: 5H
        priority: 58
        requires:
          evals: { "keycards(agreed)": [2, 2], "trump_queen(agreed)": [0, 0] }
        shows: "2 keycards without the trump queen"
        establishes: { forcing: one_round }
        alertable: true
        convention: rkc_1430
      - id: rkc_5S
        call: 5S
        priority: 57
        requires:
          evals: { "keycards(agreed)": [2, 2], "trump_queen(agreed)": [1, 1] }
        shows: "2 keycards with the trump queen"
        establishes: { forcing: one_round }
        alertable: true
        convention: rkc_1430

  - id: rkc_continue_after_5C
    description: "Asker's continuation after the 5C (1/4) reply"
    expand: { A: [H, S] }
    pattern: "... - 4NT - P - 5C - P - ?"
    when: { agreed_suit: $A }
    rules:
      - id: rkc5C_slam
        call: 6$A
        priority: 60
        requires:
          any_of:
            # FOUR keycards in my own hand: 5C shows ONE OR FOUR, and four
            # opposite four would be seven, so partner's reply can only be one
            # - every keycard is present.  The 5C reply says nothing whatever
            # about the trump queen (unlike 5H, which denies it), so nothing is
            # known to be missing: the queen may well be opposite, and at worst
            # it is a finesse.  The clause below does not apply here.
            - evals: { "keycards(agreed)": [4, 5] }
            # THREE in hand: partner holds exactly one, so a keycard IS
            # unaccounted for and the trump QUEEN must not be missing as well
            # unless the fit is long enough to drop it.  A short fit missing
            # the queen is a trump loser, not a finesse.
            - all_of:
                - evals: { "keycards(agreed)": [3, 3] }
                - any_of:
                    - evals: { "trump_queen(agreed)": [1, 1] }
                    - evals: { "lott_total_trumps(agreed)": [9, 26] }
        shows: "all/most keycards present: bidding the small slam"
        establishes: { forcing: sign_off, agreed_suit: $A }
      # The signoff must be a COMPLETE fallback, not the mirror of the slam
      # gate: once the slam rule can decline on the trump QUEEN the hand still
      # holds three keycards, so a keycard-gated signoff leaves the seat with
      # nothing fitting and the engine invents a call out of thin air.  This is
      # the same repair rkc5H_signoff already carries.
      - id: rkc5C_signoff
        call: 5$A
        priority: 55
        requires: {}
        shows: "a keycard or the trump queen missing: signing off"
        establishes: { forcing: sign_off, agreed_suit: $A }

  - id: rkc_continue_after_5D
    description: "Asker's continuation after the 5D (0/3) reply"
    expand: { A: [H, S] }
    pattern: "... - 4NT - P - 5D - P - ?"
    when: { agreed_suit: $A }
    rules:
      # The 0-or-3 reply is disambiguated by COUNTING, not by a strength
      # proxy.  Only five keycards exist: holding three or more myself,
      # partner's "0 or 3" can only be 0 - two are missing, sign off,
      # whatever my point count says (the old hcp-18 gate would have bid a
      # slam missing two aces off an 18-count).  Holding four, the missing
      # count is at most one: bid it.  Holding exactly two, the reply is
      # genuinely ambiguous and partner's shown strength decides: opposite
      # a sound raise or extras (28 combined here counting my own hand),
      # zero keycards is not credible and the total is five; opposite a
      # bare game force it may truly be zero, so stay low.  The corpus had
      # both mistakes: making slams signed off opposite 3 (a Jacoby auction
      # with 33 combined), and the hcp gate one point from bidding a slam
      # missing two.
      - id: rkc5D_slam
        call: 6$A
        priority: 60
        requires:
          any_of:
            # TWO in hand opposite shown values: 5D shows ZERO OR THREE, and
            # opposite a partner who has shown values zero is not credible, so
            # the reply is three - every keycard is present and only the queen
            # is unknown.  Nothing is unaccounted for, so the clause below does
            # not apply.
            - hcp: [12, 40]
              evals: { "keycards(agreed)": [2, 2], rule_of_26: [28, 99] }
            # The branches that count to FOUR keycards, not five: exactly one
            # is genuinely unaccounted for, so the trump QUEEN must not be
            # missing as well unless the fit is long enough to drop it.
            - all_of:
                - any_of:
                    # four in hand: partner's 0-or-3 is 0 and one is missing
                    - evals: { "keycards(agreed)": [4, 5] }
                    # ONE in hand opposite a partner who has SHOWN a big hand:
                    # zero is not credible, so the reply is three - four of the
                    # five are present and exactly one is missing.
                    - hcp: [12, 40]
                      evals: { "keycards(agreed)": [1, 1], rule_of_26: [31, 99] }
                - any_of:
                    - evals: { "trump_queen(agreed)": [1, 1] }
                    - evals: { "lott_total_trumps(agreed)": [9, 26] }
        shows: "the count says at most one keycard is missing: bidding the slam"
        establishes: { forcing: sign_off, agreed_suit: $A }
      - id: rkc5D_signoff
        call: 5$A
        priority: 55
        requires: {}
        shows: "signing off opposite a likely 0"
        establishes: { forcing: sign_off, agreed_suit: $A }

  - id: rkc_continue_after_5H
    description: "Asker's continuation after the 5H (2 no Q) reply"
    expand: { A: [H, S] }
    pattern: "... - 4NT - P - 5H - P - ?"
    when: { agreed_suit: $A }
    rules:
      - id: rkc5H_slam
        call: 6$A
        priority: 60
        # the reply IS an exact count (2 without the queen): with 2+2 and
        # ten trumps, or 2+2 with the queen in hand, six is the book bid -
        # requiring 3+ in hand turned exact arithmetic into pessimism.
        # But the reply also DENIED the trump queen, and counting keycards
        # cannot conjure it: opposite 3+ in hand every keycard is present
        # and the queen is the whole slam, so it must be in my hand or the
        # fit long enough to drop it.  A seven-card fit missing the queen
        # is a trump loser, not a finesse.
        requires:
          all_of:
            - any_of:
                - evals: { "keycards(agreed)": [3, 5] }
                - evals: { "keycards(agreed)": [2, 2], "lott_total_trumps(agreed)": [10, 26] }
                - evals: { "keycards(agreed)": [2, 2], "trump_queen(agreed)": [1, 1] }
            - any_of:
                - evals: { "trump_queen(agreed)": [1, 1] }
                - evals: { "lott_total_trumps(agreed)": [9, 26] }
        shows: "all five keycards held: bidding the small slam"
        establishes: { forcing: sign_off, agreed_suit: $A }
      - id: rkc5H_signoff
        call: 5$A
        priority: 55
        # the signoff must be a complete fallback, not the mirror image of
        # the slam gate: when the slam rule declines on the QUEEN the hand
        # still holds three keycards, and a keycard-gated signoff left the
        # seat with no fitting candidate at all - so the declined slam won
        # the soft-miss lottery anyway.  Priority keeps it under the slam.
        requires: {}
        shows: "not enough for slam opposite two keycards without the queen: signing off"
        establishes: { forcing: sign_off, agreed_suit: $A }
      # with hearts agreed the 5H sign-off is already on the table: pass it
      - id: rkc5H_pass_signoff
        call: P
        priority: 54
        requires: {}
        shows: "a keycard missing: passing the reply, which is our suit"
        establishes: { forcing: sign_off }

  - id: rkc_continue_after_5S
    description: "Asker's continuation after the 5S (2 with Q) reply"
    pattern: "... - 4NT - P - 5S - P - ?"
    when: { agreed_suit: S }
    rules:
      - id: rkc5S_slam_S
        call: 6S
        priority: 60
        requires: { evals: { "keycards(agreed)": [2, 5] } }
        shows: "all five keycards + the queen: bidding the small slam"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: rkc5S_pass_signoff
        call: P
        priority: 40
        requires: { evals: { "keycards(agreed)": [0, 2] } }
        shows: "a keycard missing: passing the 5S reply"
        establishes: { forcing: sign_off }

  - id: rkc_continue_after_5S_heartsagreed
    description: "Asker's continuation after 5S when hearts are agreed"
    pattern: "... - 4NT - P - 5S - P - ?"
    when: { agreed_suit: H }
    rules:
      - id: rkc5S_slam_H
        call: 6H
        priority: 60
        requires: { evals: { "keycards(agreed)": [2, 5] } }
        shows: "all five keycards + the queen: bidding the small slam"
        establishes: { forcing: sign_off, agreed_suit: H }
      - id: rkc5S_signoff_6H_missing
        call: 6H
        priority: 41
        requires: { evals: { "keycards(agreed)": [0, 2] } }
        shows: "forced to the six level; a keycard may be missing"
        establishes: { forcing: sign_off, agreed_suit: H }

  # ===========================================================================
  # RKC WITH A MINOR AGREED
  #
  # The continuations were authored for an agreed major only, so with a minor
  # agreed the engine asked for keycards and then had no rule for the answer:
  # the fallback machinery placed the contract, and it placed it in nonsense
  # (5S with clubs agreed, on one board of the BEN match).  Missed and
  # butchered slams were the single largest item in that match, worth about
  # a third of the whole deficit.
  #
  # The resting place depends on the minor and on how high the reply already
  # is: five of the agreed minor when that is still available, a pass when
  # the reply IS five of it, and otherwise 5NT - the eleven tricks are worth
  # more than a six-level contract known to be missing two keycards.
  # ===========================================================================

  - id: rkc_minor_after_5C_C
    description: "Asker's continuation after the 5C reply with C agreed"
    pattern: "... - 4NT - P - 5C - P - ?"
    when: { agreed_suit: C }
    rules:
      - id: rkc5C_slam_C
        call: 6C
        priority: 60
        requires: { evals: { "keycards(agreed)": [3, 5] } }
        shows: "all/most keycards present: bidding the small slam"
        establishes: { forcing: sign_off, agreed_suit: C }
      - id: rkc5C_signoff_C
        call: P
        priority: 55
        requires: {}
        shows: "keycards missing: passing the reply, which is our suit"
        establishes: { forcing: sign_off }

  - id: rkc_minor_after_5C_D
    description: "Asker's continuation after the 5C reply with D agreed"
    pattern: "... - 4NT - P - 5C - P - ?"
    when: { agreed_suit: D }
    rules:
      - id: rkc5C_slam_D
        call: 6D
        priority: 60
        requires: { evals: { "keycards(agreed)": [3, 5] } }
        shows: "all/most keycards present: bidding the small slam"
        establishes: { forcing: sign_off, agreed_suit: D }
      - id: rkc5C_signoff_D
        call: 5D
        priority: 55
        requires: {}
        shows: "keycards missing: stopping below slam"
        establishes: { forcing: sign_off }

  - id: rkc_minor_after_5D_C
    description: "Asker's continuation after the 5D reply with C agreed"
    pattern: "... - 4NT - P - 5D - P - ?"
    when: { agreed_suit: C }
    rules:
      - id: rkc5D_slam_C
        call: 6C
        priority: 60
        requires:
          any_of:
            # four in hand: partner's 0-or-3 is 0 and at most one is missing
            - evals: { "keycards(agreed)": [4, 5] }
            # two in hand: opposite shown values the reply can only be 3
            - hcp: [12, 40]
              evals: { "keycards(agreed)": [2, 2], rule_of_26: [28, 99] }
        shows: "the count says at most one keycard is missing: bidding the slam"
        establishes: { forcing: sign_off, agreed_suit: C }
      # The escape ordering is the whole game here: with two keycards
      # missing the least-worst exit is 6C in the known fit (bounded -50 or
      # -100), and 5NT is playable only by a notrump-shaped hand - a
      # two-suiter's 5NT went for -500 on a board where 6C was one down.
      - id: rkc5D_signoff_nt_C
        call: 5NT
        priority: 56
        requires: { evals: { singleton_or_void: [0, 0], worthless_doubleton: [0, 0] } }
        shows: "keycards missing: 5NT, notrump-shaped"
        establishes: { forcing: sign_off }
      - id: rkc5D_signoff_C
        call: 6C
        priority: 55
        requires: {}
        shows: "keycards missing but no playable 5-level spot: six of the fit"
        establishes: { forcing: sign_off, agreed_suit: C }

