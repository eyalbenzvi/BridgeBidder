  - id: slam_try_over_game_raise
    description: "Partner raised my major to game: the keycard ask must still exist"
    expand: { M: [H, S] }
    pattern: "... - 4$M - P - ?"
    rules:
      - id: gr_rkc_$M
        call: 4NT
        priority: 46
        when: { partner_last_suit: $M, my_suit: $M }
        requires:
          suits: { $M: [5, 13] }
          evals: { total_points: [17, 40], controls: [5, 12], rule_of_26_sharp: [30, 99] }
          any_of:
            - evals: { "void(any)": [0, 0] }
            - evals: { "keycards($M)": [3, 5] }
        shows: "RKC 1430 for $M: slam values opposite partner's raise to game"
        establishes: { forcing: one_round, agreed_suit: $M, asking: keycards }
        alertable: true
        convention: rkc_1430
      # This context is MORE SPECIFIC than the general keycard context, so it
      # interprets 4NT here on its own - and a narrower gate than the general
      # one does not "add a slam try", it DELETES the asks that already
      # worked.  The held-out corpus lost three cold slams that way.  This
      # rung carries the general gates verbatim so the new context can only
      # ever be a superset of what it shadows.
      - id: gr_rkc_general_$M
        call: 4NT
        priority: 45
        requires:
          evals: { total_points: [17, 40], controls: [4, 12], rule_of_26: [31, 99],
                   "lott_total_trumps(agreed)": [8, 26] }
          any_of:
            - evals: { "void(any)": [0, 0], worthless_doubleton: [0, 0] }
            - evals: { "keycards(agreed)": [3, 5] }
        shows: "RKC Blackwood 1430 for the agreed suit"
        establishes: { forcing: one_round, asking: keycards }
        alertable: true
        convention: rkc_1430

  # ===========================================================================
  # CUE BIDS: THE FLOOR BETWEEN GAME AND BLACKWOOD
  #
  # The head-to-head match showed the engine's only route to slam was a blind
  # 4NT: with a suit agreed in a game force it either met the stiff RKC gate
  # or gave up and bid game, and there was nothing in between.  Real slam
  # auctions live in that gap.  A cue bid is a new suit below game once trumps
  # are agreed: it shows FIRST-round control there (ace or void) and slam
  # interest, and asks partner to cooperate.
  #
  # The negative inference does the heavy lifting, and it is the whole reason
  # this encodes so naturally: the cues are priority-ordered cheapest first,
  # so bidding 4D over 3S having skipped 4C *denies* first-round club control
  # - and returning to game denies whatever was still cheap enough to show.
  # Partner reads the denials from the machinery, the same as a human would.
  #
  # Gates: cues live only when the agreement stands at the three level (the
  # classic slam-try position - any higher and there is no room, any lower
  # and the calls have natural meanings), and only below game in the agreed
  # major, so a cue chain can never push past 4M: over 3S the cues are
  # 4C/4D/4H and the next player is back to signing off or asking.  (The
  # standing bid may be at the FOUR level too - that is what answering
  # partner's own four-level cue looks like - but never higher.)  A cue
  # shows 14+ points opposite the shown range; that feeds the partner model,
  # raises rule_of_26, and thereby unlocks the existing RKC gate for a
  # partner who could not have asked directly - the machinery composes.
  # ===========================================================================

  - id: cue_bidding_S
    description: "Control-showing cue bids with spades agreed in a game force"
    # "... - P - ?" rather than "... - ?": one token of specificity, so these
    # rules tie with the generic toolkit's contexts and win on file order -
    # otherwise "raise partner's club suit" shadows the 4C cue whenever the
    # cue suit happens to be one partner once bid naturally.
    pattern: "... - P - ?"
    when: { agreed_suit: S, game_forced: true }
    rules:
      - id: cue_S_C
        call: 4C
        priority: 44
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { S: [2, 13] }
          evals: { "control_in(C)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round club control (ace or void), slam interest for spades"
        establishes: { forcing: one_round, agreed_suit: S }
        alertable: true
        convention: cue_bid
      - id: cue_S_D
        call: 4D
        priority: 43.5
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { S: [2, 13] }
          evals: { "control_in(D)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round diamond control (ace or void), slam interest for spades"
        establishes: { forcing: one_round, agreed_suit: S }
        alertable: true
        convention: cue_bid
      - id: cue_S_H
        call: 4H
        priority: 43
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { S: [2, 13] }
          evals: { "control_in(H)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round heart control (ace or void), slam interest for spades"
        establishes: { forcing: one_round, agreed_suit: S }
        alertable: true
        convention: cue_bid
      # partner's cue forces one round; with nothing left to show, game.
      # Choosing this over an available cue denies the skipped controls.
      - id: cue_S_signoff
        call: 4S
        priority: 34
        requires: {}
        shows: "no control worth showing: back to the agreed game"
        establishes: { forcing: non_forcing, agreed_suit: S }
        negative_inference_weight: soft

  - id: cue_bidding_H
    description: "Control-showing cue bids with hearts agreed in a game force"
    # "... - P - ?" rather than "... - ?": one token of specificity, so these
    # rules tie with the generic toolkit's contexts and win on file order -
    # otherwise "raise partner's club suit" shadows the 4C cue whenever the
    # cue suit happens to be one partner once bid naturally.
    pattern: "... - P - ?"
    when: { agreed_suit: H, game_forced: true }
    rules:
      - id: cue_H_S
        call: 3S
        priority: 44
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { H: [2, 13] }
          evals: { "control_in(S)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round spade control (ace or void), slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      - id: cue_H_C
        call: 4C
        priority: 43.5
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { H: [2, 13] }
          evals: { "control_in(C)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round club control (ace or void), slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      - id: cue_H_D
        call: 4D
        priority: 43
        when: { standing_bid_level: [3, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { H: [2, 13] }
          evals: { "control_in(D)": [2, 2], total_points: [14, 40], rule_of_26: [28, 99] }
        shows: "cue bid: first-round diamond control (ace or void), slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      # The ladder stopped at 4D: with hearts agreed the highest cue is 4S, and
      # without it a hand holding a spade VOID opposite partner's 4D cue had
      # nothing to say and signed off in game.  This breaks the file's stated
      # "a cue chain can never push past 4M" invariant deliberately: a cue above
      # game is standard and is a slam commitment, which is why it is gated at
      # 30 combined rather than the 28 the below-game cues use.  The answering
      # seat already exists - slam_try_over_game_raise's gr_rkc_general_$M reads
      # keycards(agreed), and this rule's agreed_suit: H makes that resolve to
      # HEARTS, not to spades.
      - id: cue_H_S4
        call: 4S
        priority: 42
        when: { standing_bid_level: [4, 4], cheapest_in_suit: true, we_hold_contract: false }
        requires:
          suits: { H: [2, 13] }
          evals: { "control_in(S)": [2, 2], total_points: [14, 40], rule_of_26: [30, 99] }
        shows: "cue bid past game: first-round spade control, slam interest for hearts"
        establishes: { forcing: one_round, agreed_suit: H }
        alertable: true
        convention: cue_bid
      - id: cue_H_signoff
        call: 4H
        priority: 34
        requires: {}
        shows: "no control worth showing: back to the agreed game"
        establishes: { forcing: non_forcing, agreed_suit: H }
        negative_inference_weight: soft

  - id: quant_raise_of_3NT
    description: "Raising partner's natural 3NT on sheer combined strength"
    pattern: "... - 3NT - P - ?"
    rules:
      # Partner's 3NT is a limited, balanced-ish call, so the arithmetic is
      # honest: my points plus the minimum partner has shown.  Thirty-three
      # is the classic small-slam number.  Seventeen of the slam boards in
      # the head-to-head died in exactly this seat - 3NT bid and passed with
      # a slam cold on power.
      # seven of a major pulls even a freely-bid 3NT: with a hand this
      # shape the suit game is the percentage spot, not nine tricks
      - id: qr3_4H_freak
        call: 4H
        priority: 41
        when: { my_suit: H }
        requires: { suits: { H: [7, 13] }, evals: { total_points: [0, 14] } }
        shows: "pulling 3NT to the seven-card major"
        establishes: { forcing: sign_off, agreed_suit: H }
      - id: qr3_4S_freak
        call: 4S
        priority: 41
        when: { my_suit: S }
        requires: { suits: { S: [7, 13] }, evals: { total_points: [0, 14] } }
        shows: "pulling 3NT to the seven-card major"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: qr3_6NT
        call: 6NT
        priority: 40
        requires:
          hcp: [16, 40]
          # controls too: 33 combined with two aces missing is off two tricks
          # at notrump, and the corpus produced exactly that 6NT
          # NOT gated on shape: the held-out corpus lost five making 6NTs to a
          # semi_balanced requirement, because 33 combined points with a long
          # running suit is the BEST 6NT, not a disqualified one
          evals: { rule_of_26_sharp: [33, 99], controls: [5, 12] }
        shows: "raising partner's 3NT to slam: 33+ combined points"
        establishes: { forcing: sign_off }
      # 33 combined is invisible when it splits 17/16: neither hand can count
      # it alone, which is what the invite is for.  4NT directly over 3NT is
      # quantitative by agreement (never keycards), pass-able, and the 3NT
      # bidder accepts holding the top of the range already shown.
      - id: qr3_4NT_quant
        call: 4NT
        priority: 39
        requires:
          hcp: [15, 40]
          # Thirty combined is a GAME, not a slam invitation.  At 30 the invite
          # fired five times in 2000 tables and was declined five times (the
          # accept rung has never fired), and 4NT and 3NT score identically on
          # ten, eleven and twelve tricks - so the only thing the invite could
          # do was turn a making 3NT into a failing 4NT, which is what it did.
          # The floor is 31, not 32: measured across all five firings, 31 is the
          # value that excludes the only losing invite (30) while keeping the
          # winner (31) and the canonical 17-opposite-16 case the convention was
          # authored for, which the locked scenario reads at exactly 31.
          evals: { rule_of_26_sharp: [31, 99] }
        shows: "quantitative raise of 3NT: inviting slam, partner passes with a minimum"
        establishes: { forcing: non_forcing }
        alertable: true

  - id: quant_3NT_accept
    description: "The 3NT bidder over partner's quantitative 4NT"
    pattern: "... - 3NT - P - 4NT - P - ?"
    rules:
      - id: qa_6NT
        call: 6NT
        priority: 40
        requires: { hcp: [16, 40] }
        shows: "accepting the slam invite: top of the range shown"
        establishes: { forcing: sign_off }
      - id: qa_pass
        call: P
        priority: 30
        requires: {}
        shows: "declining the slam invite: minimum for the 3NT bid"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  # ===========================================================================
  # FOURTH SUIT FORCING
  #
  # Three suits are on the table and responder still has no clear bid: the
  # fourth suit is artificial, game-forcing, and says "pick for me" - most
  # often asking for a stopper there so 3NT can be bid from the right side.
  # This is the tool that makes "when 3NT is an option, bid it" reachable:
  # without it, the hands with one unstopped suit had no way to ask.
  # ===========================================================================

  - id: fourth_suit_forcing
    description: "Responder's fourth suit is artificial and game forcing"
    expand_pairs:
      - { O: 1C, R: 1H, B: 1S, BS: S, F: 2D, FS: D }
      - { O: 1C, R: 1D, B: 1S, BS: S, F: 2H, FS: H }
      - { O: 1D, R: 1H, B: 1S, BS: S, F: 2C, FS: C }
      - { O: 1D, R: 1S, B: 2C, BS: C, F: 2H, FS: H }
      - { O: 1H, R: 1S, B: 2C, BS: C, F: 2D, FS: D }
    pattern: "$O - P - $R - P - $B - P - ?"
    rules:
      # "no clear natural bid" is the premise, so it is gated in: no fit for
      # opener's second suit (raise it instead), no stopper in the fourth
      # suit (bid notrump yourself instead), no self-sufficient suit of your
      # own (rebid it instead)
      - id: fsf_$F
        call: $F
        priority: 65
        requires:
          # 13+: the fourth suit FORCES TO GAME, so invitational hands (11-12)
          # must find a natural call instead
          evals: { "stoppers($FS)": [0, 0.5] }
          any_of:
            # the ordinary case: no fit for opener's second suit, no
            # self-sufficient suit of my own
            - suits: { $BS: [0, 3] }
              evals: { total_points: [13, 18], longest_suit_length: [0, 5] }
            # 19+ is too strong to be shut out by shape.  The alternative was
            # not a better natural bid - it was a signed-off game two levels
            # below the hand, because every natural rung in these contexts
            # caps at 18.  Force first, describe afterwards.
            - evals: { total_points: [19, 40] }
        shows: "fourth suit forcing: game values, no clear natural bid, seeking a $FS stopper for notrump"
        establishes: { forcing: game_forcing }
        alertable: true
        convention: fourth_suit_forcing

  - id: fourth_suit_reply
    description: "Opener's reply to fourth suit forcing"
    expand_pairs:
      - { O: 1C, R: 1H, RS: H, B: 1S, F: 2D, FS: D }
      - { O: 1C, R: 1D, RS: D, B: 1S, F: 2H, FS: H }
      - { O: 1D, R: 1H, RS: H, B: 1S, F: 2C, FS: C }
      - { O: 1D, R: 1S, RS: S, B: 2C, F: 2H, FS: H }
      - { O: 1H, R: 1S, RS: S, B: 2C, F: 2D, FS: D }
    pattern: "$O - P - $R - P - $B - P - $F - P - ?"
    rules:
      # the stopper answer comes first: that is what partner asked about
      - id: fsfr_2NT_$F
        call: 2NT
        priority: 68
        requires:
          evals: { "stoppers($FS)": [1, 9] }
        shows: "fourth suit answered: $FS stopped, notrump from this side"
        establishes: { forcing: game_forcing }
      - id: fsfr_raise_$F
        call: 3$RS
        priority: 66
        requires:
          suits: { $RS: [3, 13] }
          evals: { "stoppers($FS)": [0, 0.5] }
        shows: "no $FS stopper: showing delayed 3-card support for partner's $RS"
        establishes: { forcing: game_forcing, agreed_suit: $RS }

  # ===========================================================================
  # GENERIC GAME-FORCE LANDING SPOTS (least specific; consulted when nothing
  # anchored matches)
  # ===========================================================================

  - id: gf_landing_major
    description: "Generic: with a major agreed in a GF, bid/raise to game"
    expand: { A: [H, S] }
    pattern: "... - ?"
    when: { agreed_suit: $A, game_forced: true }
    rules:
      - id: gf_game_4$A
        call: 4$A
        priority: 35
        requires: { evals: { total_points: [0, 17] } }
        shows: "signing off in the agreed major game"
        establishes: { forcing: non_forcing, agreed_suit: $A }

  - id: gf_landing_minor
    description: "With a minor agreed in a GF: nine tricks beat eleven"
    expand: { m: [C, D] }
    # "... - P - ?" for the same reason as the cue contexts: the generic
    # toolkit's 3NT rule would otherwise cover the call at higher specificity
    # and this context's honest stopper gate would never be consulted
    pattern: "... - P - ?"
    when: { agreed_suit: $m, game_forced: true }
    rules:
      # The oldest maxim in the book: when 3NT is one of the logical options,
      # bid it.  Eleven tricks in a minor need roughly the same values as
      # nine in notrump, and score worse.  The gate is the honest version of
      # "is 3NT an option": every suit our side has not shown is stopped.
      # The maxim's own caveat, one line below it in every textbook: nine
      # tricks beat eleven, but they do not beat TEN in an eight-card major
      # fit.  This context carried only the 3NT and 5m halves of the documented
      # design ("3NT without a fit, 4M with one"), and 3NT at priority 37
      # outranked the generic toolkit's 4M raise at 32 - so a three-card raise
      # of partner's shown five-card major was overruled by notrump.
      - id: gf_maj4H_$m
        call: 4H
        priority: 38
        when: { standing_bid_strain: [$m] }
        requires:
          evals: { "lott_total_trumps(H)": [8, 26], total_points: [13, 40] }
        shows: "eight combined hearts and the values for game: the major fit beats notrump"
        establishes: { forcing: sign_off, agreed_suit: H }
      - id: gf_maj4S_$m
        call: 4S
        priority: 38
        when: { standing_bid_strain: [$m] }
        requires:
          evals: { "lott_total_trumps(S)": [8, 26], total_points: [13, 40] }
        shows: "eight combined spades and the values for game: the major fit beats notrump"
        establishes: { forcing: sign_off, agreed_suit: S }
      - id: gf_minor_3NT
        call: 3NT
        priority: 37
        # only in the "partner raised the minor, pick a game" position: over
        # our own side's 3NT this rule must never fire (it was pulling
        # partner's 3NT to five of a minor - the exact opposite of the maxim)
        when: { standing_bid_strain: [$m] }
        requires:
          hcp: [0, 17]
          evals: { weakest_unshown_stopper: [0.9, 9] }
        shows: "choosing 3NT over the minor game: the unshown suits are stopped"
        establishes: { forcing: non_forcing }
      - id: gf_game_5$m
        call: 5$m
        priority: 30
        when: { standing_bid_strain: [$m] }
        requires: { evals: { total_points: [0, 17] } }
        shows: "signing off in the agreed minor game (3NT unavailable)"
        establishes: { forcing: non_forcing, agreed_suit: $m }

  - id: gf_landing_new_suit
    description: "In a GF with no agreed suit, a real five-card suit is shown before 3NT"
    # The floor beneath gf_3NT.  In a game force partner supplies the values,
    # so the generic toolkit's point floors on a new suit (10 / 14) are
    # nonsense here: responder to 2C with a bust and five hearts had NO
    # candidate above fit 0.07 and blasted 3NT with a wide-open hand.
    expand: { X: [C, D, H, S] }
    pattern: "... - P - ?"
    when: { agreed_suit: false, game_forced: true }
    rules:
      - id: gf_new_2$X
        call: 2$X
        priority: 36
        when: { unbid_suit: $X, cheapest_in_suit: true }
        requires: { suits: { $X: [5, 13] } }
        shows: "five-card suit shown in the game force (no point floor: partner has the values)"
        establishes: { forcing: game_forcing }
      - id: gf_new_3$X
        call: 3$X
        priority: 36
        when: { unbid_suit: $X, cheapest_in_suit: true }
        requires: { suits: { $X: [5, 13] } }
        shows: "five-card suit shown in the game force (no point floor: partner has the values)"
        establishes: { forcing: game_forcing }

  - id: gf_landing_preference_major
    description: "In a GF with no agreed suit, three-card support for partner's major beats 3NT"
    expand: { M: [H, S] }
    pattern: "... - P - ?"
    when: { agreed_suit: false, game_forced: true }
    rules:
      - id: gf_pref_3$M
        call: 3$M
        priority: 37
        when: { partner_last_suit: $M, cheapest_in_suit: true }
        requires: { suits: { $M: [3, 13] } }
        shows: "preference to partner's major in the game force"
        establishes: { forcing: game_forcing, agreed_suit: $M }

  - id: gf_landing_nt
    description: "Generic: in a GF with no agreed suit, 3NT is the default game"
    # "... - P - ?" so this covers 3NT ahead of the generic 13-17 notrump
    # rule: in a game force ANY strength raises partner's 2NT to game, and
    # the shadowing cost a real board (a 4-3 spade game on eleven points
    # because 3NT was gated 13+)
    pattern: "... - P - ?"
    when: { agreed_suit: false, game_forced: true }
    rules:
      - id: gf_3NT
        call: 3NT
        priority: 34
        # "no fit found" is a checkable claim: no known eight-card fit with
        # partner's suit (the lott gate is sharp - trumps are counted)
        requires:
          hcp: [0, 17]
          # honesty gates (this rule at priority 34 was beating fit-1.0
          # natural rebids with 6-card suits and unstopped side suits):
          # every unshown suit stopped, and no 6-card suit worth bidding
          evals: { lott_total_trumps: [0, 7], weakest_unshown_stopper: [0.9, 9] }
          not: { evals: { longest_suit_length: [6, 13] } }
        shows: "no fit found and the unshown suits stopped: choosing 3NT"
        establishes: { forcing: non_forcing }

  # ===========================================================================
  # LATE ADDITIONS (kept at file end; pattern specificity governs matching)
  # ===========================================================================

  - id: resp_1C_1D
    description: "1D response to 1C (no 4-card major, Walsh-lite)"
    pattern: "1C - P - ?"
    rules:
      - id: r1C_1D
        call: 1D
        priority: 74
        requires:
          hcp: [6, 40]
          suits: { D: [4, 13] }
          any_of: [ { suits: { D: [5, 13] } }, { evals: { balanced: [0, 0] } } ]
          not: { any_of: [ { suits: { H: [4, 13] } }, { suits: { S: [4, 13] } } ] }
        shows: "4+ diamonds (5+ or unbalanced), 6+ HCP, no 4-card major (Walsh style)"
        establishes: { forcing: one_round }

  - id: gf_landing_nt_2nt
    description: "Generic: natural forcing 2NT in a game force with no fit"
    pattern: "... - ?"
    when: { agreed_suit: false, game_forced: true }
    rules:
      - id: gf_2NT_natural
        call: 2NT
        priority: 33
        # This is the ONLY game-force landing rule whose pattern matches after
        # their double (the rest are "... - P - ?"), so after a double the whole
        # GF toolkit collapses onto it - and it had no shape gate at all: a 5-5
        # opener bid a natural 2NT holding a club void.  The system's own maxim
        # already says no notrump with a void; this was the one place it was
        # not enforced.
        requires:
          evals: { stoppers(their): [0.5, 99] }
          not: { evals: { void: [1, 1] } }
        shows: "natural, no fit yet (game force continues)"
        establishes: { forcing: game_forcing }

  - id: neg_double_3level_M
    description: "Negative doubles through 3S: their 3-level overcall of our 1M"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
      - { M: S, x: H }
    pattern: "1$M - 3$x - ?"
    rules:
      - id: nx3_negx
        call: X
        priority: 70
        requires: { hcp: [8, 40], suits: { $oM: [4, 13] }, not: { suits: { $M: [3, 13] } } }
        shows: "negative double through 3S: 4+ cards in the other major, 8+ HCP"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: nx3_raise
        call: 3$M
        priority: 68
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [6, 10] } }
        shows: "competitive raise"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      # the slam floor: with 16+ support the cue of their suit agrees the
      # major and forces game, leaving the existing cue/RKC machinery live
      # (a 19-support hand was capped at the sign-off 4M with 6S cold)
      - id: nx3_cue
        call: 4$x
        priority: 71
        requires: { suits: { $M: [4, 13] }, evals: { total_points: [16, 40] } }
        shows: "cue of their suit: slam-try raise of $M, game forcing"
        establishes: { forcing: game_forcing, agreed_suit: $M }
        alertable: true
        convention: cue_raise
      - id: nx3_game_raise
        call: 4$M
        priority: 69
        requires: { suits: { $M: [3, 13] }, evals: { total_points: [11, 40] }, not: { evals: { total_points: [16, 40] } } }
        shows: "game raise over their preemptive overcall"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: nx3_3NT
        call: 3NT
        priority: 60
        requires: { hcp: [13, 18], features: [ "stopper($x)" ], not: { suits: { $M: [3, 13] } } }
        shows: "to play, stopper in their suit"
        establishes: { forcing: sign_off }
      - id: nx3_pass
        call: P
        priority: 20
        requires: { hcp: [0, 7] }
        shows: "nothing to say over the preempt"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: neg_double_3level_m
    description: "Negative doubles through 3S: their weak jump over our 1m"
    expand_pairs:
      - { m: C, j: 2H }
      - { m: C, j: 2S }
      - { m: D, j: 2H }
      - { m: D, j: 2S }
      - { m: C, j: 3H }
      - { m: C, j: 3S }
      - { m: D, j: 3S }
    pattern: "1$m - $j - ?"
    rules:
      - id: nxj_X
        call: X
        priority: 70
        requires: { hcp: [8, 40] }
        shows: "negative double of the jump overcall: support for unbid suits"
        establishes: { forcing: one_round }
        convention: negative_double
      - id: nxj_pass
        call: P
        priority: 20
        requires: { hcp: [0, 7] }
        shows: "nothing to say over the jump"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: responder_preference_after_1M_1NT_2m
    description: "Simple preference / invitation after 1M - 1NT - 2m"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
    pattern: "1$M - P - 1NT - P - 2$x - P - ?"
    rules:
      - id: pref_pass
        call: P
        priority: 52
        requires: { suits: { $x: [4, 13] }, hcp: [6, 9] }
        shows: "happy with the second suit"
        establishes: { forcing: sign_off }
      - id: pref_2$M
        call: 2$M
        priority: 55
        requires: { suits: { $M: [2, 3] }, hcp: [6, 9] }
        shows: "simple preference: doubleton or tripleton $M, no game interest"
        establishes: { forcing: sign_off }
      - id: pref_2NT
        call: 2NT
        priority: 54
        requires: { hcp: [10, 11], not: { suits: { $M: [3, 13] } } }
        shows: "invitational, 10-11 (a maximum for the 1NT response)"
        establishes: { forcing: invitational }
      - id: pref_3M_limit
        call: 3$M
        priority: 56
        requires: { suits: { $M: [3, 3] }, evals: { total_points: [10, 12] } }
        shows: "3-card limit raise routed through 1NT"
        establishes: { forcing: invitational, agreed_suit: $M }

  # Opener's answer to the invitational 2NT above.  This position had no
  # rules at all, so the generic 13-19 3NT "accepted" with any opening -
  # a 12-count facing 10 played hopeless games all corpus long.  Opposite
  # the shown 10-11: pass 12-13, game 14+, and a 6+ card major re-offers
  # itself at the matching level (2NT denied 3-card support).
  - id: opener_over_pref_2NT
    description: "Opener over responder's invitational 2NT after 1M - 1NT - 2m"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
    pattern: "1$M - P - 1NT - P - 2$x - P - 2NT - P - ?"
    rules:
      - id: opn_pass
        call: P
        priority: 60
        requires: { hcp: [12, 13], not: { suits: { $M: [6, 13] } } }
        shows: "declining the invite: minimum opener"
        establishes: { forcing: sign_off }
      - id: opn_3NT
        call: 3NT
        priority: 58
        requires: { hcp: [14, 18], not: { suits: { $M: [6, 13] } } }
        shows: "accepting the invite: 14+"
        establishes: { forcing: sign_off }
      - id: opn_3$M
        call: 3$M
        priority: 59
        requires: { suits: { $M: [6, 13] }, hcp: [12, 13] }
        shows: "6+ $M, minimum: re-offering the suit below game"
        establishes: { forcing: sign_off }
      - id: opn_4$M
        call: 4$M
        priority: 57
        requires: { suits: { $M: [6, 13] }, hcp: [14, 18] }
        shows: "6+ $M, accepting: game in the long suit"
        establishes: { forcing: sign_off, agreed_suit: $M }

  # Opener's answer to the natural 2NT invite after a two-suited rebid
  # (1H - 1S - 2m - 2NT): the position had no rules, so a 17-count PASSED
  # the invite (the generic 3NT is blocked by semi_balanced for a 1-5-4-3).
  - id: opener_over_invite_2NT_after_2suits
    description: "Opener over responder's 2NT invite after 1H - 1S - 2m"
    expand: { x: [C, D] }
    pattern: "1H - P - 1S - P - 2$x - P - 2NT - P - ?"
    rules:
      - id: oi2n_pass_$x
        call: P
        priority: 60
        requires: { hcp: [12, 13] }
        shows: "declining the invite: minimum opener"
        establishes: { forcing: sign_off }
      - id: oi2n_3NT_$x
        call: 3NT
        priority: 58
        requires: { hcp: [14, 18] }
        shows: "accepting the invite: 14+"
        establishes: { forcing: sign_off }
      - id: oi2n_3H_$x
        call: 3H
        priority: 59
        requires: { suits: { H: [6, 13] }, hcp: [12, 13] }
        shows: "6+ hearts, minimum: re-offering the suit below game"
        establishes: { forcing: sign_off }
      - id: oi2n_4H_$x
        call: 4H
        priority: 57
        requires: { suits: { H: [6, 13] }, hcp: [14, 18] }
        shows: "6+ hearts, accepting: game in the long suit"
        establishes: { forcing: sign_off, agreed_suit: H }

  # Opener's answer when responder invites by raising the SECOND suit
  # (1M - 1NT - 2x - 3x): accept to the suit game on 15+, else pass -
  # a 17-count with a stiff was passing a cold game here because the
  # generic gate could only count partner's SHOWN three trumps.
  - id: opener_over_second_suit_raise
    description: "Opener over the invitational raise of his second suit"
    expand_pairs:
      - { M: H, x: C }
      - { M: H, x: D }
      - { M: S, x: C }
      - { M: S, x: D }
      - { M: S, x: H }
    pattern: "1$M - P - 1NT - P - 2$x - P - 3$x - P - ?"
    rules:
      - id: ossr_pass_$M$x
        call: P
        priority: 60
        requires: { evals: { total_points: [12, 14] } }
        shows: "declining the invite: minimum"
        establishes: { forcing: sign_off }
      - id: ossr_game_$M$x
        call: 4$x
        priority: 58
        requires: { evals: { total_points: [15, 40] } }
        shows: "accepting the invite to game in the second suit"
        establishes: { forcing: non_forcing, agreed_suit: $x }

  - id: opener_rebid_1S_2C_2D
    description: "1S - 2C: opener's 4+ diamond second suit (GF)"
    pattern: "1S - P - 2C - P - ?"
    rules:
      - id: ob_1S2C_2D
        call: 2D
        priority: 53
        requires: { suits: { D: [4, 13] }, not: { suits: { S: [6, 13] } } }
        shows: "second suit: 4+ diamonds (GF)"
        establishes: { forcing: game_forcing }

  # ===========================================================================
  # SANDWICH SEAT (they opened and responded; we act in 4th chair)
  # ===========================================================================

  - id: sandwich_seat
    description: "Both opponents have bid at the 1-level: sandwich actions"
    expand: { o: [C, D, H, S] }
    pattern: "1$o - P - (1D|1H|1S|1NT) - ?"
    rules:
      - id: sw_X
        call: X
        priority: 70
        requires:
          not: { evals: { longest_suit_length: [6, 13] } }
          any_of:
            - hcp: [12, 16]
              suits: { $o: [0, 2] }
              evals: { longest_suit_length: [4, 13] }
            - hcp: [17, 40]
        shows: "takeout of their suits: shortness in opener's suit (or any 17+)"
        establishes: { forcing: one_round }
      - id: sw_1S
        call: 1S
        when: { unbid_suit: S }
        priority: 68
        requires: { suits: { S: [5, 13] }, hcp: [8, 16], evals: { suit_quality(S): [1.5, 9] } }
        shows: "sandwich overcall: good 5+ spades, 8-16"
        establishes: { forcing: non_forcing }
      - id: sw_1H
        call: 1H
        when: { unbid_suit: H }
        priority: 68
        requires: { suits: { H: [5, 13] }, hcp: [8, 16], evals: { suit_quality(H): [1.5, 9] } }
        shows: "sandwich overcall: good 5+ hearts, 8-16"
        establishes: { forcing: non_forcing }
      - id: sw_2C
        call: 2C
        when: { unbid_suit: C }
        priority: 66
        requires: { suits: { C: [5, 13] }, hcp: [11, 17], evals: { suit_quality(C): [2, 9] } }
        shows: "sandwich 2-level overcall: good 5+ clubs, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_2D
        call: 2D
        when: { unbid_suit: D }
        priority: 66
        requires: { suits: { D: [5, 13] }, hcp: [11, 17], evals: { suit_quality(D): [2, 9] } }
        shows: "sandwich 2-level overcall: good 5+ diamonds, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_2H
        call: 2H
        when: { unbid_suit: H }
        priority: 66
        requires: { suits: { H: [5, 13] }, hcp: [11, 17], evals: { suit_quality(H): [2, 9] } }
        shows: "sandwich 2-level overcall: good 5+ hearts, 11-17"
        establishes: { forcing: non_forcing }
      - id: sw_2S
        call: 2S
        when: { unbid_suit: S }
        priority: 66
        requires: { suits: { S: [5, 13] }, hcp: [11, 17], evals: { suit_quality(S): [2, 9] } }
        shows: "sandwich 2-level overcall: good 5+ spades, 11-17"
        establishes: { forcing: non_forcing }
      # CEILING: the sandwich ladder stops at the TWO level (good 5+ cards and
      # 11-17), so a seven-card suit on a weak hand had nothing to bid and
      # passed - KQT9432 of spades passed over 1D - P - 1H where BEN bids 3S at
      # 0.96.  The preemptive jump is the sandwich seat's most useful call and
      # it was the one call the context did not have.  Gates mirror the
      # opening preempts.
      # SIBLING GAP: the direct seat has a weak jump overcall (6 cards, 5-10,
      # good suit) and the sandwich seat never got one - its two-level rung is
      # the STRONG 11-17 overcall - so a seven-count with six good spades had
      # nothing between a one-level bid it did not qualify for and a pass, and
      # passed where BEN bids 2S at confidence 0.99.
      # `cheapest_in_suit: false` is what makes it a JUMP: in this seat the
      # opponents have bid two suits, so a two-level call is only sometimes one.
      - id: sw_2C_jump
        call: 2C
        when: { unbid_suit: C, cheapest_in_suit: false }
        priority: 69
        requires:
          suits: { C: [6, 13] }
          hcp: [5, 10]
          features: [ "good_suit(C)" ]
        shows: "sandwich weak jump overcall: 6+ c, 5-10"
        establishes: { forcing: non_forcing }
