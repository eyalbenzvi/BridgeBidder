      # Repeating my own suit was missing from the generic toolkit
      # entirely: with six of them and nothing else to say, the bid is the
      # suit again.  ("Don't preempt twice" was tried here as a 10-HCP floor
      # and REVERTED: it silenced nine-count overcallers competing at the two
      # level, a measured 10-IMP loss - the maxim is about free rebids by a
      # preempt opener, which this gate cannot distinguish.)  The level follows the values, and - the first version
      # of this rule had to learn it the hard way - the values are counted
      # opposite what partner has actually shown, or the rule cheerfully
      # rebids to game over a preemptive raise.
      - id: ballow_rebid_C2
        call: 2C
        priority: 29
        when: { my_suit: C, cheapest_in_suit: true }
        requires:
          suits: { C: [6, 13] }
          # six cards IS the credential in a reopening seat: a quality floor
          # was pushing honorless six-baggers into 1NT without a stopper
          evals: { total_points: [11, 40] }
        shows: "rebid of my own C: 6+ cards, values for the level opposite partner's shown range"
        establishes: { forcing: non_forcing }
