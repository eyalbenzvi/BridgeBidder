  - id: opener_over_negative_double
    description: "Opener rebids after 1m - (1M overcall) - X(negative)"
    expand_pairs:
      - { m: C, M: H, oM: S, nt: 1NT }
      - { m: D, M: H, oM: S, nt: 1NT }
      - { m: C, M: S, oM: H, nt: 1NT }
      - { m: D, M: S, oM: H, nt: 1NT }
    pattern: "1$m - 1$M - X - P - ?"
    rules:
      - id: onx_major_$m$M
        call: "2$oM"
        priority: 60
        when: { cheapest_in_suit: true }
        requires: { suits: { $oM: [4, 13] }, hcp: [12, 16] }
        shows: "supporting the major the double implied: 4 cards, minimum"
        establishes: { forcing: non_forcing, agreed_suit: $oM }
      - id: onx_major1_$m$M
        call: "1$oM"
        priority: 61
        when: { cheapest_in_suit: true }
        requires: { suits: { $oM: [4, 13] }, hcp: [12, 16] }
        shows: "bidding the major the double implied: 4 cards, minimum"
        establishes: { forcing: non_forcing }
      - id: onx_nt_$m$M
        call: "$nt"
        priority: 58
        requires: { hcp: [12, 14], evals: { weakest_their_stopper: [0.9, 9], semi_balanced: [1, 1] } }
        shows: "12-14 balanced with their suit stopped"
        establishes: { forcing: non_forcing }
      - id: onx_rebid_$m$M
        call: "2$m"
        priority: 57
        requires: { suits: { $m: [5, 13] }, hcp: [12, 15] }
        shows: "5+ $m, minimum"
        establishes: { forcing: non_forcing }
      # CEILING: every rung above is capped at minimum strength, so a 17-19
      # opener over partner's negative double had no rule at all and the
      # generic natural 3NT took the hand (down three on a six-card club suit
      # with no spade stopper).  Two jump rungs ADDED above the minimum band -
      # the 12-16 rungs keep their full range underneath, so nothing is
      # subtracted.
      - id: onx_jump_$m$M
        call: "3$m"
        priority: 59
        requires: { suits: { $m: [5, 13] }, hcp: [16, 19] }
        shows: "jump rebid: 5+ $m with 16-19, invitational"
        establishes: { forcing: invitational }
      - id: onx_jumpnt_$m$M
        call: 2NT
        priority: 58.5
        requires: { hcp: [18, 19], evals: { weakest_their_stopper: [0.9, 9], semi_balanced: [1, 1] } }
        shows: "jump: 18-19 balanced with their suit stopped"
        establishes: { forcing: invitational }

  # Opener supports the negative double's implied major over their raise:
  # the double PROMISED the other major, so with four of them and values
  # the raise is automatic (a stiff-heart 4S maker passed out their 4H).
  - id: opener_neg_double_over_raise
