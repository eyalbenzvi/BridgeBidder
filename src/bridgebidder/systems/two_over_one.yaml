        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  - id: responder_after_minor_rebid
    description: "Responder over opener's simple 2m rebid (6+ suit, 12-15)"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - P - 1$M - P - 2$m - P - ?"
    rules:
      # never pass a 10-count or singleton support: a fit-1.0 natural 2D
      # sat unplayed under this floor while 3NT made at the other table
      - id: rmr_pass
        call: P
        priority: 50
        requires: { hcp: [6, 9], suits: { $m: [2, 13] } }
        shows: "no game interest opposite a minimum rebid"
        establishes: { forcing: sign_off }
      - id: rmr_newsuit_D
        call: 2D
        priority: 56
        when: { unbid_suit: D }
        # a new suit at the two level is forcing, so it has no ceiling: the
        # 12 cap sent every 13-19 count with five diamonds into 3NT instead,
        # one point of soft miss at a time
        requires: { suits: { D: [5, 13] }, hcp: [9, 19] }
        shows: "new suit over the minor rebid: 5+ diamonds, forcing"
        establishes: { forcing: one_round }
      # Banded by strength, never by SHAPE: the only rebid of responder's own
      # major demanded SIX cards, so 5-4-4-0 with a VOID in opener's rebid
      # minor had no call at all - nothing in this context fitted above 0.41
      # and the soft-miss lottery invited in notrump on nine points.  Five and
      # a singleton-or-void in the minor is the textbook escape.  The HCP floor
      # is unchanged, so partner's shown strength for 2$M does not move.
      - id: rmr_2M
        call: 2$M
        priority: 52
        requires:
          any_of:
            - hcp: [6, 10]
              suits: { $M: [6, 13] }
            - hcp: [6, 10]
              suits: { $M: [5, 13], $m: [0, 1] }
        shows: "to play: 6+ $M, or five with no fit for the rebid minor"
        establishes: { forcing: sign_off }
      - id: rmr_2NT
        call: 2NT
        priority: 53
        requires: { hcp: [11, 12] }
        shows: "invitational, 11-12"
        establishes: { forcing: invitational }
      - id: rmr_3m
        call: 3$m
        priority: 54
        requires: { hcp: [10, 12], suits: { $m: [3, 13] } }
        shows: "invitational raise of the rebid suit"
        establishes: { forcing: invitational, agreed_suit: $m }
      - id: rmr_3NT
        call: 3NT
        priority: 55
        requires: { hcp: [13, 18] }
        shows: "to play"
        establishes: { forcing: sign_off }
      # responder's OWN six-card major: the ladder banded by strength and
      # forgot to band by shape, so a six-bagger had no rebid here
      - id: rmr_3$M
        call: 3$M
        priority: 57
        requires: { suits: { $M: [6, 13] }, hcp: [10, 12] }
        shows: "6+ $M, invitational"
        establishes: { forcing: invitational }
      - id: rmr_4$M
        call: 4$M
        priority: 58
        requires: { suits: { $M: [6, 13] }, hcp: [13, 40] }
        shows: "6+ $M, game values"
        establishes: { forcing: sign_off, agreed_suit: $M }
      # The ladder topped out at 3NT/18.  Nineteen opposite a 12-15 rebid is
      # 31+ combined and belongs in a slam conversation, but the only rung
      # above the cap was a sign-off, so the soft model handed the whole
      # class of hands to 3NT one point short.  Two rungs, both reachable:
      # quantitative when balanced, a game-forcing raise when there is a fit
      # (which is what makes the keycard ask reachable at all).
      - id: rmr_4NT
        call: 4NT
        priority: 56
        requires: { hcp: [17, 19], evals: { semi_balanced: [1, 1] } }
        shows: "quantitative: 17-19 opposite the 12-15 minor rebid, inviting slam"
        establishes: { forcing: invitational }
        alertable: true
      - id: rmr_gf3_$m
        call: 3$m
        priority: 57
        requires: { suits: { $m: [4, 13] }, evals: { total_points: [19, 40] } }
        shows: "19+ with a real fit for the rebid minor: game force, slam interest"
        establishes: { forcing: game_forcing, agreed_suit: $m }


  # The sibling of `1D - 1S - 2C`, authored without it: with the 1H response
  # this seat had NO context, and in the generic toolkit two rungs interlock
  # badly - uc_rebid_H2 is vetoed above 25 combined points, and the rung above
  # it demands the cheapest bid in the suit, which 3H is not while 2H is still
  # available.  So a hand TOO STRONG for the capped two-level rebid had no
  # rebid at all: responder passed 2C holding seven hearts and eleven points.
