        negative_inference_weight: soft

  - id: opener_after_negative_double_of_jump
    description: "Opener after 1m - (2M weak jump) - X (negative) - P"
    expand_pairs: [ { m: C, v: H, M: S }, { m: D, v: H, M: S }, { m: C, v: S, M: H }, { m: D, v: S, M: H } ]
    pattern: "1$m - 2$v - X - P - ?"
    rules:
