  # ===========================================================================
  # SUPPORT DOUBLES / REDOUBLES (opener, after responder's 1-level suit
  # response and RHO's interference below 2 of responder's suit)
  # ===========================================================================

  - id: support_double
    description: "Support double: X = exactly 3-card support for responder's major"
    # The agreement is triggered by responder's one-level suit response being
    # overcalled or doubled - whether or not LHO overcalled first.  Before
    # this pattern admitted LHO's one-level overcall, 1C - (1D) - 1H - (X)
    # fell through to the generic doubled-contract rules, which read East's
    # double as penalty and had opener "sit" with three-card support (seed
    # 501 board 786: 2D by W -1 instead of our making 2H).
    expand_pairs:
      - { m: C, M: H }
      - { m: C, M: S }
      - { m: D, M: H }
      - { m: D, M: S }
      - { m: H, M: S }
      - { m: C, M: D }
    pattern: "1$m - (P|bid<1$M) - 1$M - bid<2$M - ?"
    rules:
      - id: sd_double
        call: X
        priority: 85
        requires: { suits: { $M: [3, 3] }, hcp: [12, 21] }
        shows: "support double: exactly 3-card $M support, any strength"
        establishes: { forcing: one_round }
        alertable: true
        convention: support_double
      - id: sd_raise
        call: 2$M
        priority: 80
        requires: { suits: { $M: [4, 13] }, evals: { total_points: [12, 16] } }
        shows: "raise: 4+ $M support (support double would show exactly 3)"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: sd_rebid_3$m
        call: 3$m
        priority: 54
        requires: { suits: { $m: [6, 13] }, hcp: [15, 18] }
        shows: "jump rebid: 6+ $m, 15-18, fewer than 3 $M"
        establishes: { forcing: invitational }
      - id: sd_rebid_2$m
        call: 2$m
        priority: 55
        requires: { suits: { $m: [6, 13] }, hcp: [12, 15] }
        shows: "6+ $m, minimum, fewer than 3 $M"
        establishes: { forcing: non_forcing }
      - id: sd_1NT
        call: 1NT
        priority: 54
        requires: { hcp: [12, 14], balanced: true, features: [ "stopper(their)" ] }
        shows: "12-14 balanced with a stopper, fewer than 3 $M"
        establishes: { forcing: non_forcing }
      - id: sd_2NT
        call: 2NT
        priority: 53
        requires: { hcp: [15, 18], evals: { semi_balanced: [1, 1], longest_suit_length: [0, 5] }, features: [ "stopper(their)" ], not: { suits: { $M: [3, 13] } } }
        shows: "15-18 balanced with a stopper, fewer than 3 $M"
        establishes: { forcing: non_forcing }
      - id: sd_pass
        call: P
        priority: 30
        requires: { hcp: [12, 14], suits: { $M: [0, 2] } }
        shows: "minimum without 3-card support or a convenient rebid"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: support_redouble
    description: "Support redouble after RHO's takeout double"
    expand_pairs: [ { m: C, M: H }, { m: C, M: S }, { m: D, M: H }, { m: D, M: S }, { m: H, M: S }, { m: C, M: D } ]
    pattern: "1$m - (P|bid<1$M) - 1$M - X - ?"
    rules:
      - id: srd_redouble
        call: XX
        priority: 85
        requires: { suits: { $M: [3, 3] }, hcp: [12, 21] }
        shows: "support redouble: exactly 3-card $M support"
        establishes: { forcing: one_round }
        alertable: true
        convention: support_redouble
      - id: srd_raise
        call: 2$M
        priority: 80
        requires: { suits: { $M: [4, 13] }, evals: { total_points: [12, 15] } }
        shows: "raise: 4+ $M support"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: srd_pass
        call: P
        priority: 30
        requires: { hcp: [12, 14], suits: { $M: [0, 2] } }
        shows: "minimum, fewer than 3 $M"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  # Once the support redouble has told responder about the 3-card fit, the
  # continuations are ordinary fit auctions.  Without these two contexts the
  # generic toolkit took over (seed 501 board 786): responder "raised" clubs
  # on a fallback instead of rebidding the known eight-card major fit, and
  # opener answered partner's minimum 2M with a natural 2NT on a 12-count.
  - id: after_support_redouble_responder
    description: "Responder's rebid once opener's support redouble has shown 3-card support"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - (P|bid<1$M) - 1$M - X - XX - * - ?"
    rules:
      - id: asr_game_$M
        call: 4$M
        priority: 70
        requires: { suits: { $M: [5, 13] }, evals: { total_points: [13, 40] } }
        shows: "5+ $M opposite the shown 3-card support: game values"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: asr_invite_$M
        call: 3$M
        priority: 68
        requires: { suits: { $M: [5, 13] }, evals: { total_points: [10, 12] } }
        shows: "5+ $M opposite the shown 3-card support: invitational"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: asr_rebid_$M
        call: 2$M
        priority: 66
        requires: { suits: { $M: [5, 13] }, evals: { total_points: [6, 9] } }
        shows: "5+ $M opposite the shown 3-card support: minimum, an eight-card fit"
        establishes: { forcing: non_forcing, agreed_suit: $M }

  - id: after_support_redouble_opener
    description: "Opener after the support redouble and partner's simple rebid of the major"
    expand: { m: [C, D], M: [H, S] }
    pattern: "1$m - (P|bid<1$M) - 1$M - X - XX - * - 2$M - * - ?"
    rules:
      - id: aso_game_$M
        call: 4$M
        priority: 59
        requires: { hcp: [18, 21] }
        shows: "game opposite 5+ $M and a minimum rebid"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: aso_invite_$M
        call: 3$M
        priority: 58
        requires: { hcp: [15, 17] }
        shows: "invitational raise with extras opposite 5+ $M"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: aso_pass_min
        call: P
        priority: 60
        requires: { hcp: [12, 14] }
        shows: "minimum opposite a minimum rebid: the eight-card fit is at its level"
        establishes: { forcing: sign_off }
        negative_inference_weight: soft

  # ===========================================================================
  # BLIND-REVIEW ROUND (seed 9001): the contexts the generic toolkit was
  # standing in for.  Each block names the boards that exposed it.
  # ===========================================================================

  # --- advancer after our overcall is doubled (a negative double, not penalty)
  # b0010B, b0167B, b0228A, b0243A, b0306A: the generic "their double" rules
  # read the double as penalty and had advancer sit, run, or raise on
  # responder's 6-9 scale.
  - id: advance_1level_overcall_doubled
    description: "Advancer after our 1-level overcall is doubled"
    expand_pairs: [ { o: C, v: D }, { o: C, v: H }, { o: C, v: S }, { o: D, v: H }, { o: D, v: S }, { o: H, v: S } ]
    pattern: "1$o - 1$v - X - ?"
    rules:
      - id: aod_raise2_$v
        call: 2$v
        priority: 60
        requires: { suits: { $v: [3, 13] }, evals: { total_points: [5, 10] } }
        shows: "raise of partner's overcall: 3+ trumps, 5-10"
        establishes: { forcing: non_forcing, agreed_suit: $v }
      - id: aod_raise3_$v
        call: 3$v
        priority: 62
        requires:
          any_of:
            - suits: { $v: [4, 13] }
              hcp: [4, 9]
            - suits: { $v: [3, 13] }
              evals: { total_points: [11, 14] }
        shows: "jump raise: four trumps and weak, or three trumps invitational"
        establishes: { forcing: non_forcing, agreed_suit: $v }
      - id: aod_raise4_$v
        call: 4$v
        priority: 63
        requires:
          any_of:
            - suits: { $v: [5, 13] }
              hcp: [4, 8]
            - suits: { $v: [4, 13] }
              evals: { total_points: [15, 40] }
        shows: "game raise: five trumps preemptive, or four trumps with game values"
        establishes: { forcing: sign_off, agreed_suit: $v }
      - id: aod_new_C2
        call: 2C
        priority: 40
        when: { unbid_suit: C, cheapest_in_suit: true }
        requires: { suits: { C: [5, 13] }, hcp: [8, 40] }
        shows: "new suit over the double: 5+ C, 8+"
        establishes: { forcing: non_forcing }
      - id: aod_new_D2
        call: 2D
        priority: 40
        when: { unbid_suit: D, cheapest_in_suit: true }
        requires: { suits: { D: [5, 13] }, hcp: [8, 40] }
        shows: "new suit over the double: 5+ D, 8+"
        establishes: { forcing: non_forcing }
      - id: aod_new_H2
        call: 2H
        priority: 40
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires: { suits: { H: [5, 13] }, hcp: [8, 40] }
        shows: "new suit over the double: 5+ H, 8+"
        establishes: { forcing: non_forcing }
      - id: aod_new_S2
        call: 2S
        priority: 40
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires: { suits: { S: [5, 13] }, hcp: [8, 40] }
        shows: "new suit over the double: 5+ S, 8+"
        establishes: { forcing: non_forcing }
      - id: aod_pass
        call: P
        priority: 30
        requires: {}
        shows: "no fit and nothing to say over their negative double"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  - id: advance_2level_overcall_doubled
    description: "Advancer after our 2-level overcall is doubled"
    expand_pairs: [ { o: C, v: D }, { o: C, v: H }, { o: C, v: S }, { o: D, v: C }, { o: D, v: H }, { o: D, v: S }, { o: H, v: C }, { o: H, v: D }, { o: H, v: S }, { o: S, v: C }, { o: S, v: D }, { o: S, v: H } ]
    pattern: "1$o - 2$v - X - ?"
    rules:
      - id: aod2_raise3_$v
        call: 3$v
        priority: 60
        requires: { suits: { $v: [3, 13] }, evals: { total_points: [6, 13] } }
        shows: "raise of partner's two-level overcall: 3+ trumps"
        establishes: { forcing: non_forcing, agreed_suit: $v }
      - id: aod2_raise4_$v
        call: 4$v
        priority: 62
        requires:
          any_of:
            - suits: { $v: [5, 13] }
              hcp: [4, 9]
            - suits: { $v: [3, 13] }
              evals: { total_points: [14, 40] }
        shows: "game raise: five trumps preemptive, or three with game values"
        establishes: { forcing: sign_off, agreed_suit: $v }
      - id: aod2_new_C3
        call: 3C
        priority: 40
        when: { unbid_suit: C, cheapest_in_suit: true }
        requires: { suits: { C: [6, 13] }, hcp: [8, 40] }
        shows: "new suit at the three level: 6+ C, 8+"
        establishes: { forcing: non_forcing }
      - id: aod2_new_D3
        call: 3D
        priority: 40
        when: { unbid_suit: D, cheapest_in_suit: true }
        requires: { suits: { D: [6, 13] }, hcp: [8, 40] }
        shows: "new suit at the three level: 6+ D, 8+"
        establishes: { forcing: non_forcing }
      - id: aod2_new_H3
        call: 3H
        priority: 40
        when: { unbid_suit: H, cheapest_in_suit: true }
        requires: { suits: { H: [6, 13] }, hcp: [8, 40] }
        shows: "new suit at the three level: 6+ H, 8+"
        establishes: { forcing: non_forcing }
      - id: aod2_new_S3
        call: 3S
        priority: 40
        when: { unbid_suit: S, cheapest_in_suit: true }
        requires: { suits: { S: [6, 13] }, hcp: [8, 40] }
        shows: "new suit at the three level: 6+ S, 8+"
        establishes: { forcing: non_forcing }
      - id: aod2_pass
        call: P
        priority: 30
        requires: {}
        shows: "no fit and nothing to say over their negative double"
        establishes: { forcing: non_forcing }
        negative_inference_weight: soft

  # --- opener after partner's negative double
  # b0189B (jumped to 4S on a 14-count), b0224A (passed with four hearts),
  # b0127A (passed a forcing double), b0156A, b0341B: no context existed, so
  # responder-scale raises and the 11-12 notrump rules decided.
  - id: opener_after_negative_double
    description: "Opener's rebid after 1m - (1x) - X (negative, showing the other major) - P"
    expand_pairs: [ { m: C, v: H, M: S, c: 1S, j: 2S }, { m: D, v: H, M: S, c: 1S, j: 2S }, { m: C, v: S, M: H, c: 2H, j: 3H }, { m: D, v: S, M: H, c: 2H, j: 3H } ]
    pattern: "1$m - 1$v - X - P - ?"
    rules:
      - id: ond_M_min
        call: $c
        priority: 70
        requires: { suits: { $M: [4, 13] }, hcp: [11, 15] }
        shows: "four $M opposite the negative double, minimum"
        establishes: { forcing: non_forcing, agreed_suit: $M }
      - id: ond_M_jump
        call: $j
        priority: 71
        requires: { suits: { $M: [4, 13] }, hcp: [16, 18] }
        shows: "four $M opposite the negative double, 16-18: invitational"
        establishes: { forcing: invitational, agreed_suit: $M }
      - id: ond_M_game
        call: 4$M
        priority: 72
        requires: { suits: { $M: [4, 13] }, hcp: [19, 21] }
        shows: "four $M opposite the negative double, 19+: game"
        establishes: { forcing: sign_off, agreed_suit: $M }
      - id: ond_1NT
        call: 1NT
        priority: 55
        requires: { hcp: [11, 14], suits: { $M: [0, 3] }, evals: { semi_balanced: [1, 1] }, features: [ "stopper($v)" ] }
        shows: "12-14 balanced with a stopper, no fit for the implied major"
        establishes: { forcing: non_forcing }
      - id: ond_2NT
        call: 2NT
        priority: 56
        requires: { hcp: [18, 19], suits: { $M: [0, 3] }, evals: { semi_balanced: [1, 1] }, features: [ "stopper($v)" ] }
        shows: "18-19 balanced with a stopper, no fit for the implied major"
        establishes: { forcing: non_forcing }
      - id: ond_rebid_2m
        call: 2$m
        priority: 50
        requires: { suits: { $m: [6, 13] }, hcp: [11, 15] }
        shows: "6+ $m, minimum, no fit for the implied major"
        establishes: { forcing: non_forcing }
      - id: ond_2C_second
        call: 2C
        priority: 45
        when: { my_suit: D }
        requires: { suits: { C: [4, 13], $M: [0, 3] }, hcp: [11, 16] }
        shows: "second suit: 4+ clubs, no fit for the implied major"
        establishes: { forcing: non_forcing }
      - id: ond_2D_reverse
        call: 2D
        priority: 45
        when: { my_suit: C }
        requires: { suits: { D: [4, 13], $M: [0, 3] }, hcp: [17, 21] }
        shows: "reverse: 4+ diamonds, 17+, no fit for the implied major"
