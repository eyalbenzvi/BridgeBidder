[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgebidder"
version = "0.1.0"
description = "A 2/1 Game Forcing bridge bidding engine with explanations, inference and simulation arbitration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
dd = ["endplay>=0.5"]
test = ["pytest>=7"]
gui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "openai>=1.0"]

[project.scripts]
bid = "bridgebidder.cli:main"
bid-gui = "bridgebidder.gui.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bridgebidder = ["systems/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
